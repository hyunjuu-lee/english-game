<title>영어 150문장 타임어택</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#070b18}
  :root{
    --ink:#eef3ff; --ink2:#a5b4d8; --ink3:#6d7ea8;
    --blue:#4c8dff; --cyan:#3ee0f5; --violet:#b06bff; --amber:#ffb44d; --red:#ff5a6a; --green:#3fdc8b;
    --edge:#060a15;
  }
  body{
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Helvetica Neue",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;
    background:
      radial-gradient(120% 55% at 50% -12%, #1e2f66 0%, rgba(7,11,24,0) 62%),
      radial-gradient(90% 45% at 50% 112%, #14356b 0%, rgba(7,11,24,0) 60%),
      linear-gradient(180deg,#070b18,#0a1020 55%,#060a15);
  }
  /* iOS Safari 하단 툴바: 100dvh + safe-area 하단 여백으로 잘림 방지 */
  .app{
    position:fixed;left:0;right:0;top:0;bottom:0;margin:0 auto;
    width:100%;max-width:520px;
    height:100%;
    display:flex;flex-direction:column;overflow:hidden;
    background:linear-gradient(180deg,rgba(12,19,40,.92),rgba(7,11,24,.96));
    padding-top:calc(env(safe-area-inset-top,0px) + 6px);
    padding-bottom:0px;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  /* ── HUD ─────────────────────────────── */
  .hud{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:12px 14px 0}
  .hearts{display:flex;gap:2px;flex:0 0 auto}
  .hearts svg{width:15px;height:15px;display:block;transition:transform .15s,opacity .15s;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
  .hearts svg.off{opacity:.4;filter:grayscale(.9) drop-shadow(0 1px 2px rgba(0,0,0,.5))}
  .hearts svg.pop{transform:scale(1.35)}
  .score{margin-left:auto;display:flex;align-items:center;gap:5px;flex:0 0 auto}
  .score .coin{display:flex;flex:0 0 auto}
  .score .coin svg{width:15px;height:15px;display:block;filter:drop-shadow(0 1px 3px rgba(255,180,60,.55))}
  .score em{font-style:normal;font-size:8px;font-weight:900;letter-spacing:.14em;color:#5f739e}
  .score b{font-size:20px;font-weight:900;letter-spacing:-.02em;color:#fff;
    font-variant-numeric:tabular-nums;text-shadow:0 0 16px rgba(110,170,255,.55)}
  .icon{
    -webkit-appearance:none;appearance:none;
    width:31px;height:31px;border-radius:10px;
    background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.045));
    border:1px solid rgba(150,190,255,.16);
    border-bottom:3px solid rgba(0,0,0,.45);
    color:#b9c7e8;display:grid;place-items:center;flex:0 0 auto;cursor:pointer;
    font-family:inherit;white-space:nowrap;transition:transform .08s;
  }
  .icon:active{transform:translateY(2px);border-bottom-width:1px}
  .icon svg{width:18px;height:18px;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
  .icon.off{color:#4a5a80}
  .tag{
    font-size:9.5px;font-weight:900;letter-spacing:.04em;white-space:nowrap;
    color:#9fb0d8;background:rgba(255,255,255,.07);border:1px solid rgba(150,190,255,.14);
    border-radius:8px;padding:4px 7px;display:inline-flex;align-items:center;gap:3px;
  }
  .tag svg{width:13px;height:13px;display:block;flex:0 0 auto}
  .tag.stg{color:#a9c8ff;background:rgba(76,141,255,.16);border-color:rgba(76,141,255,.4);
    box-shadow:0 0 12px rgba(76,141,255,.18)}
  .tag.spd{color:#3a1f00;background:linear-gradient(180deg,#ffd479,#ffab34);
    border-color:#ffcf6b;box-shadow:0 0 14px rgba(255,180,77,.45);font-variant-numeric:tabular-nums}
  .tag.boss{color:#fff;background:linear-gradient(180deg,#ff5a6a,#c2213c);
    border-color:#ff8b98;letter-spacing:.1em;box-shadow:0 0 14px rgba(255,90,106,.5)}
  .bosschip{font-size:8.5px;font-weight:900;letter-spacing:.1em;color:#fff;
    background:linear-gradient(180deg,#ff5a6a,#c2213c);border-radius:6px;padding:2px 5px;flex:0 0 auto}

  .hud2{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 14px 0}
  .goal{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.09);
    box-shadow:inset 0 1px 3px rgba(0,0,0,.55);overflow:hidden;min-width:30px;position:relative}
  .goal i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#3ee0f5,#4c8dff);
    box-shadow:0 0 12px rgba(62,224,245,.7);transition:width .28s cubic-bezier(.2,.8,.2,1)}
  .goalTxt{font-size:11.5px;font-weight:900;color:#8fa2cc;white-space:nowrap;
    font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .goalTxt b{color:#9fd8ff}
  .combo{
    font-size:11px;font-weight:900;letter-spacing:-.01em;color:#5f739e;
    white-space:nowrap;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px;
    transition:color .15s,transform .12s;
  }

  /* ── 낙하 구역(플레이필드) ───────────── */
  .sky{
    flex:1 1 0;min-height:118px;position:relative;margin:9px 12px 0;border-radius:18px;
    border:1px solid rgba(120,170,255,.22);
    background:
      linear-gradient(180deg, rgba(62,224,245,.07), rgba(0,0,0,0) 42%),
      repeating-linear-gradient(0deg, rgba(120,170,255,.055) 0 1px, rgba(0,0,0,0) 1px 27px),
      repeating-linear-gradient(90deg, rgba(120,170,255,.055) 0 1px, rgba(0,0,0,0) 1px 27px),
      linear-gradient(180deg,#101a3c,#0a1024);
    box-shadow:inset 0 0 46px rgba(4,8,22,.9), inset 0 1px 0 rgba(255,255,255,.05), 0 10px 26px rgba(0,0,0,.45);
    overflow:hidden;
  }
  .lane{position:absolute;left:9px;right:9px;top:0;bottom:0;overflow:hidden}
  .row{
    position:absolute;left:0;top:0;display:inline-flex;align-items:center;justify-content:center;
    width:auto;min-width:136px;max-width:82%;
    padding:0 18px 0 22px;border-radius:15px;will-change:transform;cursor:pointer;
    background:
      linear-gradient(180deg, rgba(132,226,255,.22), rgba(132,226,255,0) 46%),
      linear-gradient(180deg,#2f4585,#1a2550 58%,#131c3a);
    border:1px solid rgba(150,215,255,.36);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.26),
      inset 0 -12px 20px rgba(6,10,26,.45),
      0 6px 16px rgba(0,0,0,.45),
      0 0 20px rgba(96,160,255,.18);
    transform:translate3d(0,0,0);
    transition:background .16s,border-color .16s,box-shadow .16s;
  }
  /* 왼쪽 에너지 포트 */
  .row:before{
    content:"";position:absolute;left:6px;top:50%;transform:translateY(-50%);
    width:4px;height:44%;border-radius:3px;
    background:linear-gradient(180deg,#9fd8ff,#4c8dff);
    box-shadow:0 0 10px rgba(110,190,255,.85);
  }
  /* 캡슐 스캔라인 */
  .row:after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(190,235,255,.07) 0 1px, rgba(0,0,0,0) 1px 5px);
    opacity:.75;
  }
  .row .glow{
    position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;
    background:radial-gradient(60% 120% at 50% 0%, rgba(120,220,255,.3), rgba(120,220,255,0) 72%);
  }
  .row .ko{
    display:block;max-width:100%;font-weight:900;letter-spacing:-.03em;color:#f2f6ff;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;
    text-shadow:0 1px 0 rgba(0,0,0,.5), 0 0 12px rgba(120,200,255,.35);
    pointer-events:none;
  }
  /* 타겟 락온 브래킷 ┌ ┐ └ ┘ */
  .row .lock{position:absolute;inset:-4px;pointer-events:none;opacity:0;transition:opacity .18s}
  .row .lock i{
    position:absolute;width:13px;height:13px;
    border:2px solid var(--cyan);border-radius:3px;
    box-shadow:0 0 10px rgba(62,224,245,.85);
  }
  .row .lock i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-top-left-radius:8px}
  .row .lock i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-top-right-radius:8px}
  .row .lock i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-bottom-left-radius:8px}
  .row .lock i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-bottom-right-radius:8px}
  .row .lock:after{
    content:"";position:absolute;inset:-2px;border-radius:16px;
    border:1.5px solid rgba(62,224,245,.8);opacity:0;
  }
  .row.target .lock{opacity:1}
  .row.target .lock:after{animation:lockRing 1.5s ease-out infinite}
  @keyframes lockRing{
    0%{opacity:.85;transform:scale(1)}
    60%{opacity:.12;transform:scale(1.07)}
    100%{opacity:0;transform:scale(1.11)}
  }
  .row.target:before{background:linear-gradient(180deg,#b6f4ff,var(--cyan));
    box-shadow:0 0 12px rgba(62,224,245,.95)}
  .row.target{
    background:
      linear-gradient(180deg, rgba(150,240,255,.3), rgba(150,240,255,0) 50%),
      linear-gradient(180deg,#3572d8,#1d3f96 58%,#16276b);
    border-color:var(--cyan);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.3),
      inset 0 -12px 20px rgba(6,20,50,.45),
      0 6px 0 rgba(6,20,50,.5),
      0 0 0 1px rgba(62,224,245,.55),
      0 0 28px rgba(62,224,245,.45);
  }
  .row.target .ko{color:#fff}
  .row.tone1:not(.target):not(.danger){
    background:
      linear-gradient(180deg, rgba(200,150,255,.22), rgba(200,150,255,0) 46%),
      linear-gradient(180deg,#52368e,#2d1d58 58%,#1d133c);
    border-color:rgba(195,155,255,.4);
  }
  .row.tone1:not(.target):not(.danger):before{background:linear-gradient(180deg,#e0b8ff,#a366ff)}
  .row.tone2:not(.target):not(.danger){
    background:
      linear-gradient(180deg, rgba(110,245,200,.2), rgba(110,245,200,0) 46%),
      linear-gradient(180deg,#1d6065,#123942 58%,#0b252d);
    border-color:rgba(95,230,195,.36);
  }
  .row.tone2:not(.target):not(.danger):before{background:linear-gradient(180deg,#9effe4,#3fdc9b)}
  .row.bossrow:not(.target):not(.danger){
    border-color:rgba(255,195,85,.72);
    box-shadow:inset 0 1px 0 rgba(255,235,180,.35), 0 0 22px rgba(255,175,65,.28);
  }
  .row.danger{
    background:
      linear-gradient(180deg, rgba(255,150,160,.26), rgba(255,150,160,0) 50%),
      linear-gradient(180deg,#8b2434,#4d1020 58%,#33060f);
    border-color:#ff6b7d;
  }
  .row.danger:before{background:linear-gradient(180deg,#ffb3bb,#ff5a6a);
    box-shadow:0 0 12px rgba(255,90,106,.95)}
  .row.danger .glow{
    background:radial-gradient(60% 120% at 50% 100%, rgba(255,90,106,.5), rgba(255,90,106,0) 74%);
    animation:dangerGlow .85s ease-in-out infinite;
  }
  @keyframes dangerGlow{0%,100%{opacity:.4}50%{opacity:1}}
  .row.danger .lock i{border-color:#ff8a97;box-shadow:0 0 10px rgba(255,90,106,.9)}
  .row.danger .lock:after{border-color:rgba(255,120,140,.85)}
  .row.danger.target{background:linear-gradient(180deg,#a02a3c,#5a1324)}
  /* 스폰: 에너지가 모이며 등장 (위치 transform은 건드리지 않고 scale·밝기만) */
  @keyframes rowIn{
    0%{opacity:0;scale:.86;filter:brightness(2.2) saturate(1.5)}

  /* 발사 레이저 빔 */
  .beam{

/* 스테이지 37개 — 패턴 1~30을 하나씩 도는 개별 레벨 + 5패턴마다 MIX + FINAL MIX + 무한 서바이벌.
   Lv.1~5 = 패턴 1~5 → Lv.6 MIX 1(패턴 1~5) → Lv.7~11 = 패턴 6~10 → Lv.12 MIX 2(1~10) → …
   Lv.31~35 = 패턴 26~30 → Lv.36 FINAL MIX(1~30) → Lv.37 무한 서바이벌. 전 스테이지 자유 플레이. */
var GOAL_PAT = 10, GOAL_MIX = 15, GOAL_FINAL = 20;   /* 스테이지 종류별 목표 문장 수 */
var MIX_EVERY = 5;                                   /* 몇 패턴마다 MIX 스테이지를 끼우는지 */
var PAT_STAGES = 48;                                 /* 패턴·MIX 스테이지 = Lv.1~35 */
var STAGES = (function(){
  var list = [], n, block, pos, p, mix, total = PATTERNS.length - 1;
  for(n=1;n<=PAT_STAGES;n++){
    block = Math.floor((n-1)/6); pos = (n-1)%6;
    if(pos === 5){
      mix = block + 1;
      list.push({ n:n, kind:"mix", mix:mix, p:0, from:1, to:MIX_EVERY*mix,
                  goal:Math.min(GOAL_MIX, 5*MIX_EVERY*mix) });
    } else {
      p = block*MIX_EVERY + pos + 1;
      /* 패턴 1은 복습할 앞 패턴이 없어서 그 패턴 5문장짜리 짧은 스테이지가 된다 */
      list.push({ n:n, kind:"pat", mix:0, p:p, from:p, to:p, goal:Math.min(GOAL_PAT, 5*p) });
    }
  }
  list.push({ n:PAT_STAGES+1, kind:"final", mix:0, p:0, from:1, to:total, goal:Math.min(GOAL_FINAL, 5*total) });
  list.push({ n:PAT_STAGES+2, kind:"inf",   mix:0, p:0, from:1, to:total, goal:0 });
  return list;
})();
var STAGES_TOTAL = STAGES.length;    /* 37 */
var LAST_LEVEL = STAGES_TOTAL - 1;   /* 36 — 마지막으로 클리어하는 스테이지, 37은 무한 서바이벌 */
var GOAL = GOAL_PAT;                 /* 기본 목표 — 실제 목표는 stageMeta(n).goal */

/* 스테이지 한 칸의 정보 — 종류(pat/mix/final/inf)·패턴 범위·목표 문장 수 */
function stageMeta(n){
  return STAGES[Math.max(1, Math.min(STAGES_TOTAL, n || 1)) - 1];
}
function isInfStage(n){ return stageMeta(n).kind === "inf"; }
function isBoss(n){ return isInfStage(n); }

/* 원문 데이터 — ko 한국어 / en 영어 / chunks 조립 조각 / p 패턴번호 / lv 난이도 티어 */
var DATA = [];
(function(){
  for(var i=0;i<RAW.length;i++){
    var r = RAW[i];
    DATA.push({ id:i+1, idx:i, ko:r[0], en:r[1], chunks:r[2].split("|"), p:r[3], lv:r[4] });
  }
})();

/* 단계별 30문장 목록 · 전체 문장 목록 */
var LEVEL_IDS = {}, ALL_IDS = [];
(function(){
  var i, lv;
  for(i=0;i<DATA.length;i++) ALL_IDS.push(i);
  for(lv=1;lv<=LAST_LEVEL;lv++) LEVEL_IDS[lv] = [];
  for(i=0;i<DATA.length;i++) if(LEVEL_IDS[DATA[i].lv]) LEVEL_IDS[DATA[i].lv].push(i);
})();
/* 그 단계에 나오는 패턴 종류 수 — 새 구조에서는 어느 단계든 30 */
function countPatterns(n){
  var m = stageMeta(n);
  return m.kind === "inf" ? PATTERNS.length - 1 : (m.to - m.from + 1);
}
/* 함정으로 쓸 수 있는 패턴: 그 단계까지 배운 문장의 패턴(무한전은 전체) */
function patternsOf(stage){
  var set = {}, m = stageMeta(stage || 1), i;
  if(m.kind === "inf"){ for(i=1;i<PATTERNS.length;i++) set[i] = 1; return set; }
  for(i=1;i<=m.to;i++) set[i] = 1;
  return set;
}

(function(){

    if(!BANK[d.p]) BANK[d.p] = [];
    for(var j=0;j<d.chunks.length;j++) BANK[d.p].push(d.chunks[j]);

})();

var FILL = ["can", "was", "is", "are", "take", "leave", "for", "at", "hold", "carry", "make", "do", "get", "bring", "stay", "here", "there", "your", "our", "that", "it", "could", "should", "need", "want", "took", "left", "held", "carried", "went", "came", "saw", "told", "did", "made", "has", "had", "been", "wondering", "depends", "meant", "mean", "sounds", "looks", "feels", "sign", "book", "booked", "closes", "open", "nothing", "anything", "already", "yet", "soon", "with", "without", "until", "by", "many", "much", "if", "when", "worry", "worried", "chose", "picked", "finish"];

/* 패턴별 앞머리 청크 — 함정으로 섞어 '앞머리 고르기'를 시험한다 */
var OPENER = ["",
  "I'm trying to",
  "I'm supposed to",
  "I was about to",
  "I'm here to",
  "I've been",
  "Let me",
  "Can I get",
  "Can you",
  "Do you mind",
  "I'm not sure",
  "I don't think",
  "I think you should",
  "It feels like",
  "It looks like",
  "It sounds like",

  "As far as I know",
  "You don't have to",

  "It depends on",
  "I'll let you know",
  "I didn't mean to",
  "I can't wait to",
  "That's why",
  "That's what"

/* 16번 There is / There are — 문장과 반대쪽 앞머리를 먼저 깔아 준다 */
var SIBLING = { 16: "There are" };

/* 조이 님이 실제로 헷갈렸던 앞머리 그룹 — 그룹에 속한 패턴의 문장이 나오면 같은 그룹의
   다른 앞머리를 단어판에 먼저 깔아 '앞머리 구분'을 실전으로 훈련한다. */
var CONF_PAT = [
  { pats:[4, 1, 5],        openers:["I'm here to", "I'm here", "I'm trying to", "I've been"] },
  { pats:[9, 20],          openers:["Do you mind if I", "Do you mind", "I was wondering if", "Do you know if"] },
  { pats:[10, 11],         openers:["I'm not sure if", "I don't think", "I think", "Are you sure"] },
  { pats:[2, 3],           openers:["I was supposed to", "I was about to", "I'm going to"] },
  { pats:[7, 8, 6, 17],    openers:["Can I get", "Can you", "Could you", "Let me", "I'd like to"] }
];
function confGroup(p){
  for(var i=0;i<CONF_PAT.length;i++) if(CONF_PAT[i].pats.indexOf(p) >= 0) return CONF_PAT[i].openers;
  return null;
}

/* 단어판 색 구분용 — 앞머리 칩(.pat). 정답·함정 오프너가 모두 같은 색이라 정답 스포일러는 없다. */
var OPENSET = {};
(function(){
  var i, j, g;
  for(i=1;i<OPENER.length;i++) OPENSET[norm(OPENER[i])] = 1;
  OPENSET[norm("There are")] = 1;   /* 16번 패턴은 There is / There are 둘 다 앞머리 */
  for(i=0;i<CONF_PAT.length;i++){
    g = CONF_PAT[i].openers;
    for(j=0;j<g.length;j++) OPENSET[norm(g[j])] = 1;
  }
})();

/* 판정용 정규화 — 소문자, 아포스트로피/따옴표 통일, 문장부호 제거, 공백 정리 */
function norm(t){
  return String(t == null ? "" : t)
    .replace(/[\u2018\u2019\u02bc]/g, "'")
    .replace(/[\u201c\u201d]/g, '"')
    .toLowerCase()
    .replace(/[.,?!;:"']/g, "")
    .replace(/\s+/g, " ")
    .replace(/^ | $/g, "");
}
/* 정답 판정은 청크 개수·배열이 아니라 '담은 청크를 이어 붙인 문장'과 정답 문장의 문자열 비교.
   청크를 어떻게 끊어 담았든 완성된 문장이 같으면 정답이다. */
function sameSentence(made, en){
  return norm(made.join(" ")) === norm(en);
}
function makeRng(seed){
  var s = (seed>>>0) || 1;
  return function(){ s = (s*1664525 + 1013904223)>>>0; return s/4294967296; };
}
function shuffled(arr,rng){
  var a = arr.slice(), r = rng || Math.random;
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(r()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

/* 문장 하나의 단어 풀: 정답 청크 100% 먼저 → 남는 칸만 함정
   want = 함정 개수(정답 청크 수와 무관) */
function buildPool(d, trapN, stage){
  var want = trapN || 10;
  var lv = stage || d.lv || 1;
  var pset = patternsOf(lv);
  var rng = makeRng(d.id*7919 + 101);
  var seen = {}, i, j;
  /* 0) 정답 청크는 무조건 먼저 전부 확보 — 어떤 함정도 정답을 밀어내지 못한다 */
  for(i=0;i<d.chunks.length;i++) seen[norm(d.chunks[i])] = 1;

  /* ① 앞머리 청크 함정 2~4개 (해금된 패턴들) */
  var openN = 2 + (lv >= 3 ? 1 : 0) + (lv >= 5 ? 1 : 0);
  var opSet = {}, opCnt = 0;
  for(i=1;i<OPENER.length;i++) if(pset[i]) opSet[OPENER[i]] = 1;
  /* 헷갈림 그룹 앞머리도 '앞머리 함정'으로 센다 — 단어판 앞머리 칩이 단계별 2~4개를 넘지 않게 */
  for(i=0;i<CONF_PAT.length;i++){
    var gop = CONF_PAT[i].openers;
    for(j=0;j<gop.length;j++) opSet[gop[j]] = 1;
  }
  for(i=0;i<OPENER.length;i++) if(SIBLING[i]) opSet[SIBLING[i]] = 1;

  var traps = [];
  function push(c){
    if(!c) return;
    var k = norm(c);
    if(!k || seen[k]) return;
    var isOp = !!opSet[c];
    if(isOp && opCnt >= openN) return;          /* 앞머리 함정은 openN개까지 */
    seen[k] = 1;
    traps.push(c);
    if(isOp) opCnt++;
  }
  var ops = [];
  for(i=1;i<OPENER.length;i++) if(pset[i]) ops.push(OPENER[i]);
  /* 이 문장 패턴의 앞머리는 반드시 함정으로 넣는다 — 'I'm here' vs 'I'm here to' 같은 진짜 함정 */
  if(pset[d.p] && OPENER[d.p]) push(OPENER[d.p]);
  /* There is 문장에는 There are, There are 문장에는 There is 를 먼저 깐다 */
  if(SIBLING[d.p]) push(SIBLING[d.p]);
  /* ①-b 조이 님이 헷갈렸던 그룹의 앞머리를 먼저 채운다 — 이 문장의 앞머리와 비슷하게 생긴
     것들('I'm here to' vs 'I'm here' / 'Do you mind' vs 'Do you mind if I' …)이 2~4개 깔린다.
     비슷한 순서로 넣는다: 앞부분이 겹치거나('I'm here to' → 'I'm here'), 쓰인 단어가 겹치는 것부터. */
  var grp = confGroup(d.p);
  if(grp){
    var own = norm(d.chunks[0] || ""), gs = shuffled(grp, makeRng(d.id*313 + 11));
    var score = function(t){
      var n = norm(t), ow = own.split(" "), tw = n.split(" "), sc = 0, a, b2;
      if(n.indexOf(own) === 0 || own.indexOf(n) === 0) sc += 1000;
      for(a=0;a<ow.length;a++) for(b2=0;b2<tw.length;b2++) if(ow[a] === tw[b2]) sc += 10;
      return sc;
    };
    gs.sort(function(x, y){ return score(y) - score(x); });
    for(i=0;i<gs.length && opCnt<openN;i++) push(gs[i]);
  }
  ops = shuffled(ops, rng);
  for(i=0;i<ops.length && opCnt<openN;i++) push(ops[i]);

  /* ② 단어 혼동형 — 두 번째 청크부터 */
  var conf = [];
  for(i=1;i<d.chunks.length;i++){
    var words = d.chunks[i].split(" ");
    var alts = CONF[words[0].toLowerCase()];
    if(alts && alts.length){
      for(j=0;j<alts.length;j++){
        var rest = words.slice(1).join(" ");
        conf.push(alts[j] + (rest ? " " + rest : ""));
      }
    }
  }
  conf = shuffled(conf, rng);
  var confCap = traps.length + 2;
  for(i=0;i<conf.length && traps.length<confCap;i++) push(conf[i]);

  /* ③ 같은 패턴의 다른 청크 */
  var same = shuffled(BANK[d.p] || [], rng);
  for(i=0;i<same.length && traps.length<want;i++) push(same[i]);

  /* ④ 해금 패턴의 청크(앞머리 고르기) */
  if(traps.length < want){
    var wide = [];
    for(i=1;i<PATTERNS.length;i++) if(pset[i] && BANK[i]) wide = wide.concat(BANK[i]);
    wide = shuffled(wide, rng);
    for(i=0;i<wide.length && traps.length<want;i++) push(wide[i]);
  }

  /* ⑤ 이웃 패턴 */
  if(traps.length < want){
    var near = [], np = [d.p-1, d.p+1, d.p+2];
    for(i=0;i<np.length;i++) if(pset[np[i]] && BANK[np[i]]) near = near.concat(BANK[np[i]]);
    near = shuffled(near, rng);
    for(i=0;i<near.length && traps.length<want;i++) push(near[i]);
  }

  /* ⑥ 최후 채움 */
  var fill = shuffled(FILL, rng);
  for(i=0;i<fill.length && traps.length<want;i++) push(fill[i]);

  /* ⑦ 최종 확인: 혹시라도 빠진 정답 청크가 있으면 맨 앞에 복구 */
  var out = d.chunks.slice();
  for(i=0;i<d.chunks.length;i++){
    var need = norm(d.chunks[i]), has = false;
    for(j=0;j<out.length;j++) if(norm(out[j]) === need) has = true;
    if(!has) out.unshift(d.chunks[i]);
  }
  return shuffled(out.concat(traps), makeRng(d.id*104729 + 7));
}

var KEY = "em100.arcade.v6";
var OLD_KEY = "em100.arcade.v5";    /* 5단계 시절 키 — 최고 기록·푼 문장만 이어받는다 */
var OLD2_KEY = "em100.arcade.v4";   /* 100문장 시절 키 */
var store = { best:0, bestCombo:0, cleared:{}, sound:true, maxStage:1, lastStage:1,
  stageDone:{}, stageBest:{}, bestSurv:0 };
function cleanStore(o){
  if(!o || typeof o !== "object") return null;
  var k = {};
  k.best = +o.best || 0;
  k.bestCombo = +o.bestCombo || 0;
  k.cleared = (o.cleared && typeof o.cleared === "object") ? o.cleared : {};
  k.sound = o.sound !== false;
  k.maxStage = Math.min(STAGES_TOTAL, Math.max(1, +o.maxStage || 1));
  k.lastStage = Math.min(STAGES_TOTAL, Math.max(1, +o.lastStage || 1));
  k.stageDone = (o.stageDone && typeof o.stageDone === "object") ? o.stageDone : {};
  k.stageBest = (o.stageBest && typeof o.stageBest === "object") ? o.stageBest : {};
  k.bestSurv = +o.bestSurv || 0;
  return k;
}
(function(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var o = cleanStore(JSON.parse(raw));
      if(o) store = o;
    } else {
      /* 5단계 시절(v5) 저장값: 문장 150개와 '푼 문장' 기록은 그대로라 이어받는다.
         스테이지 번호 체계가 통째로 바뀌었으니 클리어 배지·단계별 최고점은 넘기지 않는다. */
      var old = localStorage.getItem(OLD_KEY) || localStorage.getItem(OLD2_KEY);
      if(old){
        var v5 = JSON.parse(old);
        if(v5 && typeof v5 === "object"){
          store.best = +v5.best || 0;
          store.bestCombo = +v5.bestCombo || 0;
          store.sound = v5.sound !== false;
          store.bestSurv = +v5.bestSurv || 0;
          if(v5.cleared && typeof v5.cleared === "object") store.cleared = v5.cleared;
          store.maxStage = 1; store.lastStage = 1;
        }
      }
    }
  }catch(e){}
  try{
    var w = window.pickle && window.pickle.widget;
    if(w && w.state && typeof w.state === "object" && w.state.cleared){
      var has = false;
      try{ has = !!localStorage.getItem(KEY); }catch(e2){}
      if(!has){
        var s2 = cleanStore(w.state);
        if(s2){ s2.lastStage = s2.maxStage; store = s2; }
      }
    }
  }catch(e){}
})();
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){}
  try{
    var w = window.pickle && window.pickle.widget;
    if(w && w.save) w.save(store);
  }catch(e){}
}
function clearedCount(){
  var n = 0, k;
  for(k in store.cleared) if(store.cleared.hasOwnProperty(k) && store.cleared[k]) n++;
  return n;
}

var AC = null;
function ctx(){
  if(AC){
    if(AC.state === "suspended"){ try{ AC.resume(); }catch(e){} }
    return AC;
  }
  var C = window.AudioContext || window.webkitAudioContext;
  if(!C) return null;
  try{ AC = new C(); }catch(e){ AC = null; }
  return AC;
}
/* iOS: 첫 터치 안에서 무음 버퍼를 재생해 오디오 세션을 연다 */
function unlockAudio(){
  var a = ctx(); if(!a) return;
  try{ if(a.state === "suspended") a.resume(); }catch(e){}
  try{
    var b = a.createBuffer(1, 1, a.sampleRate || 44100);
    var s = a.createBufferSource();
    s.buffer = b; s.connect(a.destination); s.start(0);
  }catch(e){}
}
function beep(f, dur, type, vol, to){
  if(!store.sound) return;
  var a = ctx(); if(!a) return;
  try{
    var o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime;
    o.type = type || "sine";
    o.frequency.setValueAtTime(f, t0);
    if(to) o.frequency.exponentialRampToValueAtTime(Math.max(40, to), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.06, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }catch(e){}
}
function noise(dur, vol){
  if(!store.sound) return;
  var a = ctx(); if(!a) return;
  try{
    var n = Math.max(1, Math.floor(a.sampleRate * dur)), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for(var i=0;i<n;i++) d[i] = (Math.random()*2 - 1) * (1 - i/n);
    var src = a.createBufferSource(); src.buffer = buf;
    var g = a.createGain(); g.gain.value = vol || 0.05;
    var f = a.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 900;
    src.connect(f); f.connect(g); g.connect(a.destination);
    src.start(0);
  }catch(e){}
}

var NOTE = {
  C3:130.81, G2:98.00, A2:110.00, F2:87.31,
  F3:174.61, G3:196.00, A3:220.00, B3:246.94,
  C4:261.63, D4:293.66, E4:329.63, G4:392.00, A4:440.00,
  C5:523.25, D5:587.33, E5:659.25, G5:783.99
};
/* 4마디 진행: C - G - Am - F (밝고 경쾌) */
var CHORDS = [
  { bass:NOTE.C3, tones:[NOTE.C4, NOTE.E4, NOTE.G4] },
  { bass:NOTE.G2, tones:[NOTE.B3, NOTE.D4, NOTE.G4] },
  { bass:NOTE.A2, tones:[NOTE.A3, NOTE.C4, NOTE.E4] },
  { bass:NOTE.F2, tones:[NOTE.F3, NOTE.A3, NOTE.C4] }
];
var ARP = [0,1,2,3,0,2,1,2];      /* 3 = 한 옥타브 위 */
var LEAD = [
     NOTE.C5,0,NOTE.E5,0,NOTE.G5,0,NOTE.E5,0,
     NOTE.D5,0,NOTE.A4,0,NOTE.G4,0,NOTE.A4,0,
     NOTE.A4,0,NOTE.C5,0,NOTE.E5,0,NOTE.C5,0,
     NOTE.G4,0,NOTE.A4,0,NOTE.C5,0,NOTE.D5,0

function bgmVoice(freq, t, dur, type, vol, cutoff){

  try{
    var o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    if(cutoff){
      var f = a.createBiquadFilter();
      f.type = "lowpass";
      f.frequency.setValueAtTime(cutoff, t);
      g.connect(f); f.connect(BGM.master);

      g.connect(BGM.master);

  }catch(e){}
}
function bgmKick(t){
  var a = AC; if(!a || !BGM.master) return;
  try{
    var o = a.createOscillator(), g = a.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(48, t + 0.13);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.085, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
    o.connect(g); g.connect(BGM.master);
    o.start(t); o.stop(t + 0.2);
  }catch(e){}
}
function bgmHat(t){
  var a = AC; if(!a || !BGM.master) return;
  try{
    var n = Math.floor((a.sampleRate || 44100) * 0.03);
    var buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for(var i=0;i<n;i++) d[i] = (Math.random()*2 - 1) * (1 - i/n);
    var s = a.createBufferSource(); s.buffer = buf;
    var f = a.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 6800;
    var g = a.createGain();
    g.gain.setValueAtTime(0.012, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);

  }catch(e){}

function bgmStep(step, t){
  var bar = Math.floor(step / 8) % 4, s = step % 8;
  var ch = CHORDS[bar];
  if(s === 0 || s === 4) bgmVoice(ch.bass, t, 0.26, "triangle", 0.075, 0);
  var idx = ARP[s];
  var freq = ch.tones[idx % 3] * (idx === 3 ? 2 : 1);
  bgmVoice(freq, t, 0.14, "square", 0.026, 2600);
  var lead = LEAD[step % 32];
  if(lead) bgmVoice(lead, t, 0.17, "triangle", 0.030, 5200);
  if(s === 0 || s === 4) bgmKick(t);

function bgmStart(){

  if(a && BGM.master){
    try{
      var now = a.currentTime, g = BGM.master.gain;
      g.cancelScheduledValues(now);
      g.setValueAtTime(Math.max(0.0001, g.value || 0.0001), now);
      g.exponentialRampToValueAtTime(0.0001, now + 0.22);
    }catch(e){}
  }
}
function bgmTick(){
  var a = AC;
  if(!BGM.on || !a) return;
  BGM.bpm = 116 + Math.min(16, Math.floor(S.combo * 0.5));
  var spb = 60 / BGM.bpm / 2;        /* 8분음표 길이 */
  if(BGM.next < a.currentTime - 0.12) BGM.next = a.currentTime + 0.02;
  var horizon = a.currentTime + 0.30;
  var guard = 0;
  while(BGM.next < horizon && guard++ < 32){
    bgmStep(BGM.step, BGM.next);
    BGM.next += spb;
    BGM.step = (BGM.step + 1) % 32;
  }
}

/* 조립 바 → 타겟 줄로 날아가는 레이저 빔 (0.13초 만에 명중) */
function laserFromBar(rect){
  if(!rect || !elSlots || !document.createElement) return;
  var bar = null;
  try{ bar = elSlots.getBoundingClientRect ? elSlots.getBoundingClientRect() : null; }catch(e){ bar = null; }
  if(!bar || !bar.width) return;
  var sx = bar.left + bar.width/2, sy = bar.top + 2;
  var px = rect.left + rect.width/2, py = rect.top + rect.height/2;
  var dx = px - sx, dy = py - sy;
  var len = Math.sqrt(dx*dx + dy*dy);
  if(!(len > 1)) return;
  var ang = Math.atan2(dy, dx)*180/Math.PI;
  var rot = "rotate(" + ang.toFixed(2) + "deg)";
  var b = document.createElement("div");
  b.className = "beam";
  b.style.left = sx + "px";
  b.style.top = (sy - 3) + "px";
  b.style.width = Math.round(len) + "px";
  b.style.transform = rot + " scaleX(0)";
  document.body.appendChild(b);
  if(b.animate){
    try{
      b.animate([
        {opacity:0, transform:rot + " scaleX(0)"},
        {opacity:1, offset:.26, transform:rot + " scaleX(1)"},
        {opacity:1, offset:.62, transform:rot + " scaleX(1)"},
        {opacity:0, transform:rot + " scaleX(1)"}

}

/* ══════════ 8. 배치·렌더 ══════════ */
function layout(){

  if(h > 0) S.laneH = h;
  if(w > 0) S.laneW = w;

  S.pitch = Math.max(34, Math.floor((S.laneH - 2) / PITCH_ROWS));
  S.R = Math.min(48, Math.max(28, S.pitch - 6));
  var rf = S.R >= 46 ? 15.5 : (S.R >= 40 ? 14 : (S.R >= 34 ? 12.5 : 11.5));
  for(var i=0;i<S.rows.length;i++){
    applyRowSize(S.rows[i]);
  }
  S.fontSize = rf;

}
function applyRowSize(r){

/* 단어판이 화면을 넘지 않게: 4~3열 컴팩트 배치 + 글자 축소 */
function fitPool(){
  if(!elPool) return;
  var cap = S.poolCap || elPool.clientHeight || 0;
  if(!cap) return;
  var sizes = [12.5, 12, 11.5, 11, 10.5, 10, 9.5, 9, 8.5];
  for(var i=0;i<sizes.length;i++){
    var fs = sizes[i];
    var pad = Math.max(4, Math.round(fs * 0.52));
    for(var j=0;j<S.blockEls.length;j++){
      var b = S.blockEls[j];
      b.style.fontSize = fs + "px";
      b.style.padding = pad + "px " + (pad + 3) + "px";
      b.style.borderRadius = Math.max(8, Math.round(fs * 0.8)) + "px";
    }
    if(elPool.scrollHeight <= elPool.clientHeight + 1) break;
  }
}
/* 단어판 높이를 스테이지 시작 시점에 고정 — 문장이 바뀌어도 낙하 구역이 흔들리지 않는다 */
function freezePool(){
  if(!elPool) return;

  var h = elPool.offsetHeight || 0;
  var maxH = appH ? Math.max(108, Math.round(appH*0.29)) : 200;

  if(!S.poolCap) S.poolCap = Math.min(maxH, Math.max(minH, h));
  if(appH && S.poolCap > maxH) S.poolCap = maxH;

}
function renderPool(){

    b.className = OPENSET[norm(t)] ? "blk pat" : "blk";

function renderSlots(){

/* 슬롯에 담은 청크를 그대로 이어 붙인 문장 = 발사할 때 판정하는 문자열 */
function builtText(){
  var out = [], i;
  for(i=0;i<S.slots.length;i++) out.push(S.slots[i].t);
  return out.join(" ");
}
function targetRow(){
  if(!S.rows.length) return null;
  for(var i=0;i<S.rows.length;i++) if(S.rows[i].uid === S.target) return S.rows[i];
  return S.rows[0];

function ensurePool(row){
  if(!row.pool) row.pool = buildPool(row.d, trapCount(row.d), S.stage);
  return row.pool;
}
function setTargetRow(row, keepSlots){
  S.target = row ? row.uid : 0;
  if(!keepSlots) S.slots = [];
  if(!row){
    S.blocks = [];
    elSlots.className = "slots";
    renderSlots(); renderPool(); paintRows();
    return;
  }
  ensurePool(row);
  S.blocks = row.pool;
  elSlots.className = "slots";
  renderSlots(); renderPool(); paintRows();
}
function paintRows(){

  for(i=0;i<S.rows.length;i++){
    r = S.rows[i];
    r.el.style.transform = "translate3d(" + (r.x || 0) + "px," + Math.round(r.y) + "px,0)";
    cls = "row tone" + (r.uid % 3);

    if(t && r.uid === t.uid) cls += " target";

/* ══════════ 9. 출제 — 난이도 단계 큐 ══════════ */
function patternCount(p){
  var n = 0;
  for(var i=0;i<DATA.length;i++) if(DATA[i].p === p) n++;
  return n;
}
function countKeys(o){
  var n = 0, k;
  for(k in o) if(o.hasOwnProperty(k) && o[k]) n++;
  return n;
}
/* 스테이지 문장 풀 — 패턴 레벨은 그 패턴 + 앞 패턴(복습 후보), MIX는 범위 안 패턴 전부 */
function stageIds(stage){
  var m = stageMeta(stage), out = [], i;
  if(m.kind === "inf") return ALL_IDS.slice();
  for(i=0;i<DATA.length;i++){
    if(m.kind === "pat" ? DATA[i].p <= m.p : (DATA[i].p >= m.from && DATA[i].p <= m.to)) out.push(i);
  }
  return out;
}
/* 그 단계의 30문장을 세 웨이브로 나눠 큐에 넣는다. 웨이브마다 패턴 번호를 3으로 나눈 나머지가
   같은 문장들(1·4·7…, 2·5·8…, 3·6·9…)을 모아 섞으므로, 초반·중반·후반 어느 구간을 봐도
   패턴 1~30이 골고루 섞여 나온다(특정 레벨이 몇몇 패턴에 갇히지 않는다). */
function queueFor(stage, run){
  var m = stageMeta(stage), rng = makeRng((stage || 1)*7717 + (run || 0)*137 + 3), i;
  var goal = m.goal || 0, out = [];
  if(m.kind === "inf") return shuffled(ALL_IDS.slice(), rng);   /* 무한전 = 150문장 전체 */

  if(m.kind === "pat"){
    /* 그 패턴 5문장을 모두 넣고, 남는 자리는 앞 패턴 복습으로 번갈아 채운다 */
    var own = [], prev = [];
    for(i=0;i<DATA.length;i++){
      if(DATA[i].p === m.p) own.push(i);
      else if(DATA[i].p < m.p) prev.push(i);
    }
    own = shuffled(own, rng);
    prev = shuffled(prev, makeRng((stage || 1)*911 + (run || 0)*53 + 7)).slice(0, Math.max(0, goal - own.length));
    var oi = 0, ri = 0;
    for(i=0;i<goal;i++){
      if(i % 2 === 0 && oi < own.length) out.push(own[oi++]);
      else if(ri < prev.length) out.push(prev[ri++]);
      else if(oi < own.length) out.push(own[oi++]);
    }
    return out;
  }

  /* MIX · FINAL MIX — 패턴마다 한 문장씩 먼저 뽑아 최대한 골고루 섞고, 남는 자리는 무작위로 채운다 */
  var cand = stageIds(stage), byPat = {}, pats = [];
  for(i=0;i<cand.length;i++){
    var p = DATA[cand[i]].p;
    if(!byPat[p]){ byPat[p] = []; pats.push(p); }
    byPat[p].push(cand[i]);
  }
  pats = shuffled(pats, makeRng((stage || 1)*29 + (run || 0)*13 + 3));
  var picked = {};
  for(i=0;i<pats.length && out.length<goal;i++){
    var one = shuffled(byPat[pats[i]], makeRng((stage || 1)*53 + pats[i]*17 + (run || 0)*7 + 5))[0];
    picked[one] = 1; out.push(one);
  }
  var rest = shuffled(cand.filter(function(x){ return !picked[x]; }), rng);
  for(i=0;i<rest.length && out.length<goal;i++) out.push(rest[i]);
  return shuffled(out, makeRng((stage || 1)*1231 + (run || 0)*97 + 11));
}
/* 30문장을 한 번씩 → 30/30이면 그 단계 문장을 전부 푼 것 */
function refillQueue(){
  var ids = queueFor(S.stage, S.run), out = [], i;
  if(isInfStage(S.stage)){ S.q = ids; return; }
  for(i=0;i<ids.length;i++) if(!S.clearedIds[String(DATA[ids[i]].id)]) out.push(ids[i]);
  S.q = out.length ? out : ids;   /* 남은 문장이 없으면(이론상 목표 달성) 그대로 다시 */
}
function nextSentence(){
  if(!S.q || !S.q.length) refillQueue();
  var idx = S.q.shift();
  S.lastId = DATA[idx].id;
  return idx;
}
/* 바닥에 닿아 놓친 문장은 큐 맨 뒤로 미루지 않고 곧바로 다시 출제한다 — 최대 3줄 뒤에 재등장.
   하트가 남아 있는 한 무한전에서도 반드시 다시 나오고, 일반 단계에서는 못 푼 문장을 끝까지 풀고
   넘어갈 수 있다(목표 30문장 = 그 단계 30문장을 한 번씩 다 깨는 것). */
var REQUEUE_AT = 3;
function requeue(d){
  if(!d) return;
  if(S.clearedIds[String(d.id)]) return;        /* 이미 푼 문장은 다시 넣지 않는다 */
  var at = Math.min(REQUEUE_AT, S.q.length);
  S.q.splice(at, 0, d.idx);
}
/* 함정 수: 단계가 오를수록 늘고, 단어판이 화면에 다 들어가도록 상한 */
function trapCount(d){
  var n = stageMeta(S.stage).n;
  var want = isInfStage(S.stage) ? 12 : Math.min(12, 8 + Math.floor((n - 1)/8));
  var nn = d ? d.chunks.length : 3;
  var budget = S.poolBudget || 14;
  var maxTraps = Math.max(3, budget - nn);
  return Math.min(want, maxTraps);
}
/* 새 줄 스폰 간격(ms) — 스테이지가 오를수록 조금씩 당겨지고 MIX는 한 단계 더 빠르다.
   무한전은 푼 문장이 늘수록 8.5초에서 2.8초까지 빨라진다. */
function paceOf(stage, clears){
  if(isInfStage(stage)) return Math.max(2800, 8500 - (clears || 0)*80);
  var m = stageMeta(stage || 1);
  var base = 9600 - (m.n - 1)*110;
  if(m.kind === "mix" || m.kind === "final") base -= 250;
  return Math.max(5400, Math.round(base));
}
function accelOf(combo){ return 1 + Math.min(0.5, Math.max(0, combo)*0.022); }
function spawnGap(){ return paceOf(S.stage, S.clears) / accelOf(S.combo); }
function fallSpeed(){ return S.pitch / spawnGap(); }
function multOf(c){ return c >= 10 ? 4 : c >= 6 ? 3 : c >= 3 ? 2 : 1; }

/* ══════════ 10. 게임 진행 ══════════ */
function clearRows(){
  for(var i=0;i<S.rows.length;i++){
    var el = S.rows[i].el;
    if(el && el.parentNode) el.parentNode.removeChild(el);
  }
  S.rows = [];
  S.target = 0;
  S.blocks = [];
  S.slots = [];
}
function startStage(stage){
  var n = Math.max(1, Math.min(STAGES_TOTAL, stage || 1));
  var m = stageMeta(n);
  S.mode = "play"; S.lock = false;
  S.stage = n; store.lastStage = n;
  S.goal = m.goal; S.clears = 0; S.clearedIds = {};
  S.score = 0; S.combo = 0; S.maxCombo = 0; S.mult = 1;
  S.hearts = MAX_HEARTS;
  S.run++; S.q = []; S.lastId = 0;
  S.spawnT = 0; S.accel = 1; S.poolCap = 0;
  hideSheets();
  clearRows();
  elSlots.className = "slots";
  renderSlots();
  layout();
  paintHearts(); paintScore(); paintCombo(); paintSpeed(); paintStage();
  save();
  if(m.kind === "inf")        setTimeout(function(){ toast("무한전 · 150문장 랜덤", true); }, 260);
  else if(m.kind === "final") setTimeout(function(){ toast("FINAL MIX · 패턴 1~30 총동원", true); }, 260);
  else if(m.kind === "mix")   setTimeout(function(){ toast("MIX " + m.mix + " · 패턴 1~" + m.to + " 총복습", true); }, 260);
  bgmStart();
  seedRows();
  S.spawnT = 0;
  freezePool();
  layout();
}
/* 시작할 때 이미 2~3줄이 쌓인 상태로 출발 — 아케이드 손맛 */
function seedRows(){
  var n = Math.min(2, Math.max(1, Math.floor(S.laneH / S.pitch) - 2), MAX_ROWS);
  var bottom = Math.round(S.laneH * 0.30);
  if(bottom > S.laneH - S.R - S.pitch) bottom = Math.max(0, S.laneH - S.R - S.pitch);
  var i, r;
  for(i=0;i<n;i++) spawnRow();
  for(i=0;i<S.rows.length;i++){
    r = S.rows[i];
    r.y = bottom - i*S.pitch;
    r.el.style.transform = "translate3d(0," + Math.round(r.y) + "px,0)";
  }
  paintRows();
}
function spawnRow(){
  if(S.rows.length >= MAX_ROWS) return null;
  var d = DATA[nextSentence()];
  var uid = ++S.uid;
  var el = document.createElement("div");
  el.className = "row";
  el.setAttribute("data-uid", String(uid));
  var glow = document.createElement("i");
  glow.className = "glow";
  var ko = document.createElement("span");
  ko.className = "ko";
  ko.textContent = d.ko;
  var lock = document.createElement("span");
  lock.className = "lock";
  for(var q=0;q<4;q++) lock.appendChild(document.createElement("i"));
  el.appendChild(glow);
  el.appendChild(ko);
  el.appendChild(lock);
  /* 등장 연출: 에너지가 모이며 캡슐이 나타난다(위치 transform과 분리된 scale 사용) */
  try{ el.style.animation = "rowIn .34s cubic-bezier(.2,.9,.25,1)"; }catch(e){}
  var cLen = (d.chunks && d.chunks.length) ? d.chunks.length : 3;
  var spd = cLen <= 2 ? 1.18 : (cLen >= 4 || (d.lv && d.lv >= 4)) ? 0.78 : 1.0;
  var row = { uid:uid, d:d, el:el, y:-S.R, x:0, spd:spd, isBoss:(uid % 5 === 0), pool:null };
  applyRowSize(row);
  elLane.appendChild(el);
  var rw = el.offsetWidth || 180;
  var maxX = Math.max(0, (S.laneW || elLane.clientWidth || 340) - rw);
  var lanes = [0.04, 0.94, 0.48, 0.16, 0.82];
  var ratio = lanes[(uid - 1) % lanes.length];
  row.x = Math.round(maxX * ratio);
  el.style.transform = "translate3d(" + row.x + "px," + (-S.R) + "px,0)";
  S.rows.push(row);
  if(!S.target) setTargetRow(row, true);
  paintRows();
  return row;
}
function removeRow(row){
  var i;
  for(i=0;i<S.rows.length;i++){
    if(S.rows[i].uid === row.uid){ S.rows.splice(i,1); return; }
  }
}
function boomRow(row){
  var el = row.el;
  el.className = "row boom";
  if(el.animate){
    try{
      el.animate([{opacity:1, transform:el.style.transform + " scale(1)"},
                  {opacity:0, transform:el.style.transform + " scale(1.14)"}],
        {duration:300, easing:"cubic-bezier(.2,.9,.3,1)", fill:"forwards"});
    }catch(e){}
  }
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 330);
}
function hitRow(row){
  S.lock = true;
  row.dead = true;         /* 이미 명중한 줄 — 바닥 충돌로 두 번 처리되지 않게 */
  var done = false;
  try{
    var urgency = Math.max(0, Math.min(1, (row.y + S.R) / Math.max(1, S.laneH)));
    var base = 100 + Math.round(urgency*140);
    S.combo++;
    if(S.combo > S.maxCombo) S.maxCombo = S.combo;
    S.mult = multOf(S.combo);
    var gain = base * S.mult;
    S.score += gain;
    S.clearedIds[String(row.d.id)] = 1;
    S.clears = countKeys(S.clearedIds);
    store.cleared[String(row.d.id)] = 1;
    if(S.score > store.best) store.best = S.score;
    if(S.maxCombo > store.bestCombo) store.bestCombo = S.maxCombo;
    paintScore(); paintCombo(); paintSpeed(); paintStage();

    var cx = (row.x || 0) + ((row.el && row.el.offsetWidth) ? row.el.offsetWidth/2 : S.laneW/2);
    var cy = row.y + S.R/2;
    var box = null;
    try{ box = row.el.getBoundingClientRect ? row.el.getBoundingClientRect() : null; }catch(e){ box = null; }
    try{ laserFromBar(box); }catch(e){}
    try{ sfxLaser(); }catch(e){}
    elSlots.className = "slots ok";
    var gainTxt = "+" + gain + (S.mult > 1 ? " ×" + S.mult : "");
    /* 빔이 닿는 순간 폭발 — 그 전에 줄이 사라지지 않게 살짝 늦춘다 */
    setTimeout(function(){
      try{ burst(cx, cy); }catch(e){}
      try{ floatText(gainTxt, cx, cy); }catch(e){}
      try{ flash(); sfxPop(); }catch(e){}
      try{ boomRow(row); }catch(e){}
      removeRow(row);
      setTargetRow(S.rows[0] || null);
      if(!done) S.lock = false;
    }, BLAST_MS);

    var healed = false;
    var boss = (S.clears > 0 && S.clears % 5 === 0);
    var bossHealed = false;
    if(S.combo % 5 === 0 && S.hearts < MAX_HEARTS){
      S.hearts++; healed = true;
    }
    if(boss && S.hearts < MAX_HEARTS){
      S.hearts++; bossHealed = true;
    } else if(boss){
      S.score += 150; paintScore();
    }
    if(healed || bossHealed) paintHearts(S.hearts);

    if(bossHealed){
      try{ sfxCombo(); }catch(e){}
      toast("보스 처치 · 하트 +1 회복!", true);
    } else if(S.combo % 5 === 0){
      try{ sfxCombo(); }catch(e){}
      toast(healed ? (S.combo + "콤보 · 하트 +1 회복!") : (S.combo + "콤보 · FEVER ×" + S.mult), true);
    } else if(boss){
      try{ sfxCombo(); }catch(e){}
      toast("보스 처치 · 보너스 +150점!", true);
    }
    save();
    done = !isInfStage(S.stage) && S.clears >= (S.goal || 1);
  } finally {
    setTimeout(function(){
      S.lock = false;
      if(done && S.mode === "play") stageClear();
    }, done ? 420 : BLAST_MS + 80);
  }
}
function wrongRow(row){
  S.lock = true;
  elSlots.className = "slots bad shake";
  sfxBad(); shakeEl(row.el);
  S.combo = 0; S.mult = 1; S.accel = 1;
  paintCombo(); paintSpeed();
  toast("오답 · 다시 조립!");
  setTimeout(function(){
    if(S.mode !== "play") return;
    S.slots = [];
    elSlots.className = "slots";
    renderSlots();
    renderPoolUsed();      /* 방금 쓴 단어 블록을 다시 고를 수 있게 used 해제 */
    S.lock = false;
  }, 460);
}
function crashRow(row){
  if(row && row.dead) return;
  S.hearts--; paintHearts();
  S.combo = 0; S.mult = 1; S.accel = 1;
  paintCombo(); paintSpeed();
  sfxBad();
  var cx = S.laneW/2, cy = row.y + S.R/2;
  floatText("바닥", cx, cy, true);
  toast("줄이 바닥에 닿았어요 · 하트 -1");
  requeue(row.d);
  boomRow(row);
  removeRow(row);
  if(S.target === row.uid) setTargetRow(S.rows[0] || null);
  if(S.hearts <= 0){
    S.lock = true;
    setTimeout(function(){ endRun("over"); }, 420);
  }
}
function slotHas(i){
  for(var k=0;k<S.slots.length;k++) if(S.slots[k].i === i) return true;
  return false;
}
function tapBlock(i){
  if(S.mode !== "play" || S.lock) return;
  var row = targetRow();
  if(!row || !S.blocks.length || i < 0 || i >= S.blocks.length) return;
  if(S.slots.length >= SLOT_MAX){ toast("칩은 7개까지 담을 수 있어요"); return; }
  if(slotHas(i)) return;
  S.slots.push({ i:i, t:S.blocks[i] });
  var el = S.blockEls[i];
  if(el && el.classList) el.classList.add("used");
  sfxTap(S.slots.length);
  renderSlots();
}
function removeSlot(pos){
  if(S.mode !== "play" || S.lock) return;
  if(S.slots.length <= pos) return;
  S.slots.splice(pos, 1);
  beep(420, 0.05, "sine", 0.035, 320);
  renderSlots();
  renderPoolUsed();
}
function renderPoolUsed(){
  for(var i=0;i<S.blockEls.length;i++){
    var el = S.blockEls[i];
    if(!el || !el.classList) continue;
    if(slotHas(i)) el.classList.add("used");
    else el.classList.remove("used");
  }
}
/* [발사] — 유저가 직접 눌러야만 판정한다 */
function fire(){
  if(S.mode !== "play" || S.lock) return false;
  var row = targetRow();
  if(!row) return false;
  if(!S.slots.length){ toast("블록을 담아주세요"); beep(300, 0.08, "sine", 0.03); return false; }
  /* 청크 개수·배열이 아니라 '담은 청크를 이어 붙인 문장'과 정답 문장을 비교한다.
     예: ["I'm here to", "check in"] → "I'm here to check in" = 정답 문장 → 통과 */
  var made = [], i;
  for(i=0;i<S.slots.length;i++) made.push(S.slots[i].t);
  if(sameSentence(made, row.d.en)){ hitRow(row); return true; }
  for(i=0;i<S.rows.length;i++){
    var r = S.rows[i];
    if(r && !r.dead && sameSentence(made, r.d.en)){ hitRow(r); return true; }
  }
  wrongRow(row);
  return false;
}
function selectTarget(uid){
  if(S.mode !== "play" || S.lock) return;
  for(var i=0;i<S.rows.length;i++){
    if(S.rows[i].uid === uid){
      if(S.rows[i].uid === S.target) return;
      setTargetRow(S.rows[i]);
      beep(760, 0.06, "sine", 0.04, 900);
      return;
    }
  }
}
function clearSlots(){
  if(S.mode !== "play" || S.lock) return;
  S.slots = [];
  elSlots.className = "slots";
  renderSlots();
  renderPoolUsed();
  beep(360, 0.06, "sine", 0.04, 260);
}

/* ══════════ 11. 종료 ══════════ */
function recordStage(){
  var k = String(S.stage);
  if(S.score > (+store.stageBest[k] || 0)) store.stageBest[k] = S.score;
  if(S.score > store.best) store.best = S.score;
  if(S.maxCombo > store.bestCombo) store.bestCombo = S.maxCombo;
  if(!isInfStage(S.stage) && S.clears >= (S.goal || 1)) store.stageDone[k] = 1;
}
function stageClear(){
  S.mode = "over"; S.lock = true;
  bgmStop();
  var wasNew = !store.stageDone[String(S.stage)];
  recordStage();
  save();
  sfxCombo();
  paintStars(S.hearts);
  $("clearTitle").textContent = btnLabel(S.stage) + " 클리어";
  if(S.stage >= LAST_LEVEL){
    $("clearLead").textContent = "36개 스테이지를 다 깼어요. 이제 무한 서바이벌뿐!";
  } else {
    $("clearLead").textContent = "다음은 " + stageLine(S.stage + 1);
  }
  $("clScore").textContent = String(S.score);
  $("clCombo").textContent = String(S.maxCombo);
  if($("clGoal")) $("clGoal").textContent = S.clears + "/" + S.goal;
  $("clNew").innerHTML = wasNew ? '<div class="new">NEW STAGE</div>' : "";
  var nb = $("btnNextStage"), nn = Math.min(STAGES_TOTAL, S.stage + 1);
  setBtn(nb, ICON.rocket, btnLabel(nn) + " 시작");
  nb.setAttribute("data-next", String(nn));
  show(elSheetClear);
  try{
    var w = window.pickle && window.pickle.widget;
    if(w && w.signal) w.signal("영어 타임어택: " + btnLabel(S.stage) + " 클리어 · " + S.score + "점");
  }catch(e){}
}
function endRun(kind){
  if(S.mode === "over") return;
  S.mode = "over"; S.lock = true;
  bgmStop();
  var inf = isInfStage(S.stage), rec = false;
  if(inf){
    if(S.clears > (+store.bestSurv || 0)){ store.bestSurv = S.clears; rec = true; }
    if(S.score > (+store.stageBest[String(S.stage)] || 0)) store.stageBest[String(S.stage)] = S.score;
    if(S.score > store.best) store.best = S.score;
    if(S.maxCombo > store.bestCombo) store.bestCombo = S.maxCombo;
  } else {
    recordStage();
    rec = S.score > 0 && S.score >= store.best;
  }
  save();
  sfxOver();
  $("overTitle").textContent = inf ? "무한전 종료" : "게임 오버";
  $("overLead").textContent = inf
    ? ("생존 " + S.clears + "문장 · 최고 " + store.bestSurv + "문장")
    : "여기까지예요. 바로 다시 갈 수 있어요.";
  $("ovScore").textContent = String(S.score);
  $("ovCombo").textContent = String(S.maxCombo);
  $("ovCleared").textContent = inf ? ("생존 " + S.clears) : (S.clears + "/" + S.goal);
  $("newRec").innerHTML = rec ? ('<div class="new">' + (inf ? "NEW SURVIVAL" : "NEW RECORD") + "</div>") : "";
  show(elSheetOver);
  try{
    var w = window.pickle && window.pickle.widget;
    if(w && w.signal) w.signal("영어 타임어택: " + btnLabel(S.stage) + " · " + S.clears + "/" + (inf ? "∞" : S.goal) + " · " + S.score + "점");
  }catch(e){}
}

/* ══════════ 12. 화면 ══════════ */
function show(el){ if(el && el.classList) el.classList.remove("hide"); }
function hide(el){ if(el && el.classList) el.classList.add("hide"); }
function hideSheets(){
  hide(elSheetStart); hide(elSheetPause); hide(elSheetClear); hide(elSheetOver);
  hide(elStageSheet); hide(elBook);
}
function refreshStart(){

/* 클리어 시트의 별 3개 — 남은 하트만큼 채운다 */
function paintStars(got){
  if(!elStars) return;
  var h = "", i;
  for(i=0;i<3;i++) h += (i < got) ? ICON.star : ICON.starOff;
  elStars.innerHTML = h;

function openPause(){

function closePause(){

}

/* ══════════ 13. 스테이지 목록 ══════════ */
function renderStages(){
  var hout = [], i, m, done, best, right, badge, cls, clearedStages = 0;
  for(i=0;i<STAGES.length;i++) if(store.stageDone[String(STAGES[i].n)]) clearedStages++;
  for(i=0;i<STAGES.length;i++){
    m = STAGES[i];
    if(m.kind === "pat" && (m.p - 1) % MIX_EVERY === 0)
      hout.push('<div class="sgroup">패턴 ' + m.p + "~" + (m.p + MIX_EVERY - 1) + "</div>");
    done = !!store.stageDone[String(m.n)];
    best = +store.stageBest[String(m.n)] || 0;
    if(m.kind === "pat")        badge = ICON["lv" + (Math.floor((m.p - 1)/MIX_EVERY) + 1)] || ICON.star;
    else if(m.kind === "mix")   badge = ICON.star;
    else if(m.kind === "final") badge = ICON.crown;
    else                        badge = ICON.boss;
    cls = "stgrow" + (m.kind === "pat" ? "" : " " + m.kind) + (done ? " done" : "");
    if(m.kind === "inf") right = '<span class="sc">생존 ' + (store.bestSurv || 0) + "</span>";
    else if(done) right = '<span class="clearbadge">CLEAR</span>' + (best ? '<span class="sc">' + best + "</span>" : "");
    else right = best ? '<span class="sc">' + best + "</span>" : "";
    hout.push('<button class="' + cls + '" data-stg="' + m.n + '">' +
        '<div class="sbadge">' + badge + "</div>" +
        '<div class="stxt"><b>' + esc(stageLine(m.n)) + "</b><span>" + esc(stageSub(m.n)) + "</span></div>" +
        '<div class="sright">' +
          (m.kind === "inf" ? '<span class="bosschip">BOSS</span>' :
           (m.kind === "final" ? '<span class="mixchip">FINAL</span>' :
            (m.kind === "mix" ? '<span class="mixchip">MIX</span>' : ""))) + right +
        "</div></button>");
  }
  elStageBody.innerHTML = hout.join("");
  elStageBody.scrollTop = 0;
  elStageCnt.textContent = clearedStages + " / " + STAGES_TOTAL;
  show(elStageSheet);
}

/* ══════════ 14. 도감 ══════════ */
function openBook(){

function closeBook(){ hide(elBook); refreshStart(); }
function speak(txt){
  if(!store.sound) return;

    var sy = window.speechSynthesis;

}

/* ══════════ 15. 루프 ══════════ */
var lastTs = 0;
function update(dt){
  if(S.mode !== "play") return;
  /* iOS 사파리 툴바·회전으로 높이가 바뀌면 즉시 재배치(줄이 화면 밖으로 새지 않게) */
  var lh = (elLane && elLane.clientHeight) || 0;
  if(lh > 0 && Math.abs(lh - S.laneH) > 3) layout();
  var gap = spawnGap();
  var v = S.pitch / gap;
  S.v = v; S.accel = accelOf(S.combo);
  var i, r;
  for(i=0;i<S.rows.length;i++){
    r = S.rows[i];
    r.y += v*(r.spd || 1)*dt;
  }
  S.spawnT += dt;
  if(S.spawnT >= gap){
    if(S.rows.length < MAX_ROWS){
      S.spawnT = Math.max(0, S.spawnT - gap);
      spawnRow();
    } else {
      S.spawnT = gap;
    }
  }
  for(i=0;i<S.rows.length;i++){
    r = S.rows[i];
    if(r.y + S.R >= S.laneH){ crashRow(r); break; }
  }
  paintRows();
}
function frame(ts){
  var dt = lastTs ? Math.min(80, ts - lastTs) : 16;
  lastTs = ts;
  update(dt);
  try{ window.requestAnimationFrame(frame); }catch(e){}
}

/* ══════════ 16. 이벤트 ══════════ */
on(elPool, TAP, function(e){
  var t = e.target;
  while(t && t !== elPool && !(t.getAttribute && t.getAttribute("data-i") !== null && t.getAttribute("data-i") !== undefined)) t = t.parentNode;
  if(!t || t === elPool) return;
  var i = parseInt(t.getAttribute("data-i"), 10);
  if(!isNaN(i)) tapBlock(i);
});
on(elSlots, TAP, function(e){
  var t = e.target;
  while(t && t !== elSlots && !(t.getAttribute && t.getAttribute("data-pos") !== null)) t = t.parentNode;
  if(!t || t === elSlots) return;
  var p = parseInt(t.getAttribute("data-pos"), 10);
  if(!isNaN(p)) removeSlot(p);
});
function onSkyTap(e){
  var t = e.target;
  while(t && t !== elSky && !(t.getAttribute && t.getAttribute("data-uid"))) t = t.parentNode;
  if(t && t !== elSky){
    var uid = parseInt(t.getAttribute("data-uid"), 10);
    if(!isNaN(uid)) return selectTarget(uid);
  }
  if(!elLane || !S.rows.length) return;
  var rect = elLane.getBoundingClientRect();
  var cy = (e.touches && e.touches[0] ? e.touches[0].clientY : e.clientY) || 0;
  var py = cy - rect.top;
  for(var i=0;i<S.rows.length;i++){
    var r = S.rows[i];
    if(py >= r.y - 10 && py <= r.y + S.R + 10){
      return selectTarget(r.uid);
    }
  }
}
on(elSky, "pointerdown", onSkyTap);
on(elSky, "touchstart", onSkyTap);
on(elSky, "click", onSkyTap);
on(elFire, "click", function(){ unlockAudio(); fire(); });
on($("btnClear"), "click", clearSlots);
on($("btnStart"), "click", function(){
  unlockAudio();
  var st = parseInt($("btnStart").getAttribute("data-stage"), 10);
  startStage(isNaN(st) ? store.lastStage : st);
});
on($("btnStageList"), "click", renderStages);
on($("btnPauseStages"), "click", function(){ hide(elSheetPause); renderStages(); });
on($("btnOverStages"), "click", renderStages);
on($("btnClearStages"), "click", renderStages);
on($("btnStageClose"), "click", function(){
  hide(elStageSheet);
  refreshStart();
});
on(elStageBody, "click", function(e){
  var t = e.target;
  while(t && t !== elStageBody && !(t.getAttribute && t.getAttribute("data-stg"))) t = t.parentNode;
  if(!t || t === elStageBody) return;
  var n = parseInt(t.getAttribute("data-stg"), 10);
  if(isNaN(n)) return;
  hide(elStageSheet);
  unlockAudio();
  startStage(n);
});
on($("btnNextStage"), "click", function(){
  var n = parseInt($("btnNextStage").getAttribute("data-next"), 10);
  unlockAudio();
  startStage(isNaN(n) ? S.stage : n);
});
on($("btnAgain"), "click", function(){ unlockAudio(); startStage(S.stage); });
on($("btnResume"), "click", function(){ unlockAudio(); closePause(); });
on($("btnQuit"), "click", function(){ hide(elSheetPause); endRun("over"); });
on($("btnPause"), "click", openPause);
on($("btnSound"), "click", function(){
  store.sound = !store.sound;
  paintSound(); save();
  if(store.sound){
    unlockAudio();
    beep(880, 0.08, "sine", 0.05);
    if(S.mode === "play") bgmStart();
  } else {
    bgmStop();
  }
});
on($("btnBook"), "click", openBook);
on($("btnStartBook"), "click", openBook);
on($("btnBookClose"), "click", closeBook);
on($("btnBookDone"), "click", closeBook);
on(elBookBody, "click", function(e){
  var t = e.target;
  while(t && t !== elBookBody && !(t.getAttribute && t.getAttribute("data-say"))) t = t.parentNode;
  if(!t || t === elBookBody) return;
  speak(t.getAttribute("data-say"));
});
on(window, "resize", function(){ layout(); });
on(window, "orientationchange", function(){ setTimeout(layout, 120); });
if(document.addEventListener){
  document.addEventListener("visibilitychange", function(){
    if(document.hidden){
      bgmStop();
      if(S.mode === "play" && S.rows.length) openPause();
    } else if(S.mode === "play"){
      bgmStart();
    }
  }, false);
}

/* ══════════ 17. 호스트 ══════════ */
if(window.pickle && window.pickle.widget){
  window.pickle.widget.oncommand = function(cmd){
    var parts = String(cmd || "").trim().split(/\s+/);
    var c = parts[0];
    if(c === "start" || c === "restart"){
      var n = parseInt(parts[1], 10);
      startStage(isNaN(n) ? store.lastStage : n);
    } else if(c === "stage" || c === "level"){
      var arg = parts[1] || "", s2 = NaN;
      if(/무한|inf|surv|endless/i.test(arg)) s2 = STAGES_TOTAL;
      else if(/final/i.test(arg)) s2 = LAST_LEVEL;
      else if(/^mix/i.test(arg)){
        var mi = parseInt(parts[2], 10);
        s2 = (mi >= 1 && mi <= 5) ? 6*mi : NaN;
      } else s2 = parseInt(arg, 10);
      if(isNaN(s2) || s2 < 1 || s2 > STAGES_TOTAL) throw new Error("1~" + STAGES_TOTAL + " 사이의 스테이지를 입력하세요.");
      startStage(s2);
    } else if(c === "stages"){
      renderStages();
    } else if(c === "pause"){
      openPause();
    } else if(c === "resume"){
      closePause();
    } else if(c === "sound"){
      store.sound = !/off|mute|꺼/i.test(parts[1] || "");
      paintSound(); save();
      if(!store.sound) bgmStop();
      else if(S.mode === "play") bgmStart();
    } else if(c === "book"){
      openBook();
    } else if(c === "stop"){
      endRun("over");
    }
  };
}

$("btnBookClose").innerHTML = ICON.close;
$("btnStageClose").innerHTML = ICON.close;
$("btnBook").innerHTML = ICON.book;

if(elStartLogo) elStartLogo.innerHTML = ICON.logo;
if(elScoreIcon) elScoreIcon.innerHTML = ICON.coin;
if(elOverIcon) elOverIcon.innerHTML = ICON.skull;
$("btnClear").innerHTML = ICON.undo;
$("btnFire").innerHTML = ICON.rocket;
paintSound(); paintHearts(); paintScore(); paintCombo(); paintSpeed();
S.stage = store.lastStage;
S.goal = stageMeta(S.stage).goal;
S.poolBudget = 14;
layout();
paintStage();
refreshStart();
elSlots.className = "slots";
renderSlots();

try{ window.requestAnimationFrame(frame); }catch(e){}
