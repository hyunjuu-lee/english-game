<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="피클 영어">
<meta name="theme-color" content="#FFFFFF">
<meta name="format-detection" content="telephone=no">
<title>영어 300문장 타임어택</title>
__APPICON__
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html, body{height:100%;height:100dvh;overflow:hidden;background:#EDF2F8}
  :root{
    --ink:#111827;--ink2:#4B5563;--ink3:#9CA3AF;--white:#FFFFFF;--bg:#FFFFFF;--mint:#3CECC0;--mint2:#14C89A;
    --mint3:#0D9F71;--mintL:#E9FDF7;--mintBg:#F2FBF8;--blue:#007AFF;--blue2:#005CE6;--blueL:#E8F2FF;--blueDot:#2563EB;
    --orange:#FF7A00;--red:#FF3B30;--coral:#FF5A36;--line:#E5E7EB;--line2:#D1E3DD;--line3:#CBD5E1;
    --sh1:0 1px 2px rgba(16,40,32,.06), 0 6px 18px rgba(16,40,32,.07);
    --sh2:0 1px 2px rgba(16,40,32,.06), 0 12px 28px rgba(16,40,32,.10);--hair:#E4EBE8;
    --pl-hi:inset 0 2px 1px rgba(255,255,255,.65);
    --pl-mint:linear-gradient(180deg,#72F6D5 0%,#43ECC3 52%,#2CDBAE 100%);
    --pl-mint-sh:inset 0 2px 1px rgba(255,255,255,.6), inset 0 -5px 10px rgba(6,128,96,.20), 0 12px 24px -8px rgba(20,190,148,.60), 0 2px 5px rgba(14,150,112,.18);
    --pl-white:linear-gradient(180deg,#FFFFFF 0%,#F3F6F9 100%);
    --pl-white-sh:inset 0 2px 1px #FFFFFF, inset 0 -4px 8px rgba(20,40,60,.06), 0 8px 18px -6px rgba(20,40,60,.20), 0 1px 3px rgba(20,40,60,.08);
    --pl-blue:linear-gradient(180deg,#5AB0FF 0%,#1E86FF 55%,#0B6FEA 100%);
    --pl-blue-sh:inset 0 2px 1px rgba(255,255,255,.45), inset 0 -5px 10px rgba(0,50,140,.25), 0 12px 22px -8px rgba(0,110,240,.60), 0 2px 5px rgba(0,80,200,.18);
    --pl-coral:linear-gradient(180deg,#FFA078 0%,#FF7A55 55%,#F2603F 100%);
    --pl-coral-sh:inset 0 2px 1px rgba(255,255,255,.5), inset 0 -5px 10px rgba(170,50,20,.22), 0 12px 22px -8px rgba(240,96,63,.60), 0 2px 5px rgba(200,70,40,.18);
    --pl-gray:linear-gradient(180deg,#F3F6F9 0%,#E2E8EE 100%);
    --pl-gray-sh:inset 0 2px 1px #FFFFFF, inset 0 -4px 8px rgba(20,40,60,.07), 0 4px 10px -4px rgba(20,40,60,.14)}
  body{
    color:var(--ink);background:#EDF2F8;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Helvetica Neue",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
    -webkit-text-size-adjust:100%;text-size-adjust:100%}
  .app{
    position:fixed;inset:0;margin:0 auto;width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;
    overflow:hidden;padding:0;background:#FFFFFF}
  .view{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;position:relative;background:#FFFFFF}
  .hide{display:none !important}

  /* ════════ 공통: 버튼 · 배지 ════════ */
  .btn3{
    -webkit-appearance:none;appearance:none;border:0;font-family:inherit;cursor:pointer;position:relative;
    display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;letter-spacing:-.02em;
    white-space:nowrap;transition:transform .07s ease, box-shadow .07s ease}
  .btn3 svg{width:22px;height:22px;display:block;flex:0 0 auto}
  .btn3:active{transform:translateY(4px)}
  .btn3.mint{
    background:linear-gradient(180deg,#5CF3CB 0%,#3CECC0 48%,#22D9AA 100%);border:2px solid #8FF8DC;
    box-shadow:0 6px 0 #0FB88C, 0 12px 20px rgba(20,200,154,.28);color:#04372A}
  .btn3.mint:active{box-shadow:0 2px 0 #0FB88C}
  .btn3.locked{
    background:linear-gradient(180deg,#E7EBF0 0%,#D3DAE3 100%);border:2px solid #E2E8F0;box-shadow:0 6px 0 #B9C2CE;
    color:#6B7684}
  .btn3.locked:active{transform:none;box-shadow:0 6px 0 #B9C2CE}
  .btn3.locked .star{display:none}
  .badge{
    display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px 0 8px;border-radius:999px;
    background:#fff;border:1.5px solid var(--line);box-shadow:0 2px 0 var(--line);font-weight:800;font-size:14px;
    color:var(--ink);font-variant-numeric:tabular-nums}
  .badge svg{width:18px;height:18px;display:block}
  .badge em{font-style:normal;font-size:9px;letter-spacing:.1em;color:var(--ink3)}
  .icon3{
    -webkit-appearance:none;appearance:none;border:0;font-family:inherit;cursor:pointer;width:38px;height:38px;
    border-radius:12px;display:grid;place-items:center;flex:0 0 auto;background:#fff;border:1.5px solid var(--line);
    box-shadow:0 2px 0 var(--line);color:var(--ink2);transition:transform .07s}
  .icon3:active{transform:translateY(2px);box-shadow:0 0 0 var(--line)}
  .icon3 svg{width:20px;height:20px;display:block}
  .icon3.off{color:var(--ink3);background:#F3F4F6}

  /* ════════ 피클 ㅌ 마스코트 ════════ */
  .mascot{display:block;width:100%;height:100%;overflow:visible}
  .mascot .mEye{animation:mBlink 5.2s infinite}
  .mascot .mEyeShut{animation:mBlinkShut 5.2s infinite}
  @keyframes mBlink{0%,93%,100%{opacity:1}95%,97.5%{opacity:0}}
  @keyframes mBlinkShut{0%,93%,100%{opacity:0}95%,97.5%{opacity:1}}

  /* ════════ 1. 홈 로비 ════════ */
  .view.lobby{overflow:hidden}
  .lobbyBg{
    position:absolute;left:0;right:0;top:0;bottom:0;z-index:0;pointer-events:none;overflow:hidden;border-radius:0}
  .lobbyBg svg{width:100%;display:block;height:100%}
  .lobbyTop, .lobbyChips, .lobbyStage, .lobbyAction{position:relative;z-index:2}
  .lobbyTop{
    display:flex;align-items:center;flex:0 0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 4px;gap:10px}
  .avatarBox{
    position:relative;width:48px;height:48px;border-radius:15px;padding:2px;flex:0 0 auto;cursor:pointer;
    background:#fff;border:1.5px solid var(--line);box-shadow:0 2px 0 var(--line);font-family:inherit}
  .avatarBox:active{transform:translateY(2px)}
  .avatarBox .in{
    width:100%;height:100%;border-radius:12px;background:var(--mintBg);display:grid;place-items:center;
    overflow:hidden}
  .avatarBox .in svg{width:38px;height:38px}
  .avatarBox .gearTag{
    position:absolute;right:-4px;bottom:-4px;width:19px;height:19px;border-radius:50%;background:#fff;
    border:1.5px solid var(--line);box-shadow:0 1px 3px rgba(17,24,39,.12);display:grid;place-items:center;
    color:var(--muted)}
  .avatarBox .gearTag svg{width:11px;height:11px;display:block}
  .lobbyTop .spacer{margin-left:auto}
  .lobbyChips{flex:0 0 auto;display:flex;align-items:center;padding:0;gap:6px}
  .lobbyChip{
    display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);padding:5px 10px 5px 7px;
    border-radius:12px;box-shadow:0 2px 0 #E3E8EE}
  .lobbyChip .ic{display:grid;place-items:center;width:22px;height:22px}
  .lobbyChip .ic svg{width:22px;height:22px;display:block}
  .lobbyChip b{font-size:13px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
  .lobbyChip em{font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.04em;color:var(--ink3)}
  .lobbyStage{
    flex:1 1 auto;min-height:0;display:flex;align-items:center;position:relative;flex-direction:column;
    justify-content:center;padding:8px 16px 18px;gap:20px}
  .boardWrap{position:relative;z-index:1;max-width:none;width:calc(100% - 64px);padding-top:0}
  .boardWrap:before{
    content:"";position:absolute;left:1px;right:1px;bottom:1px;border-radius:22px;pointer-events:none;top:1px;
    box-shadow:0 1px 2px rgba(16,40,32,.06), 0 18px 36px -10px rgba(16,40,32,.18)}
  .boardMascot{
    position:absolute;left:50%;z-index:4;animation:bounceMascot 1.9s cubic-bezier(.5,0,.5,1) infinite;
    filter:drop-shadow(0 6px 8px rgba(17,24,39,.16));width:72px;height:72px;margin-left:-36px;top:-38px;display:none}
  @keyframes bounceMascot{0%,100%{transform:translateY(0) rotate(-2deg)}
    45%{transform:translateY(-9px) rotate(2deg)}
    62%{transform:translateY(-4px) rotate(1deg)}}
  .board{
    position:relative;border-radius:22px;background:#FFFFFF;
    -webkit-mask-image:radial-gradient(circle 10px at 0 calc(100% - 43px), #0000 97%, #000 100%), radial-gradient(circle 10px at 100% calc(100% - 43px), #0000 97%, #000 100%);
    -webkit-mask-composite:source-in;
    mask-image:radial-gradient(circle 10px at 0 calc(100% - 43px), #0000 97%, #000 100%), radial-gradient(circle 10px at 100% calc(100% - 43px), #0000 97%, #000 100%);
    mask-composite:intersect;padding:14px 18px 14px;border-color:var(--hair);border:0;box-shadow:none}
  .bpStub{
    position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:14px;padding-top:12px}
  .bpStub:before{content:"";position:absolute;left:-3px;right:-3px;top:0;border-top:1.5px dashed #DCE7F0}
  .bpStars{display:flex;align-items:center;gap:4px;flex:0 0 auto}
  .bpStar{
    display:grid;place-items:center;width:26px;height:26px;border:0;background:none;padding:0;border-radius:50%;
    transition:transform .12s, background .12s, box-shadow .12s}
  .bpStar.btn{cursor:pointer;pointer-events:none}
  .bpStar.btn:active{transform:scale(.9)}
  .bpStar.sel{opacity:1}
  .bpStar.lock svg{opacity:.55}
  .bpStar svg{width:22px;height:22px;display:block}
  .bpMetrics{display:flex;align-items:center;gap:14px;margin-left:auto}
  .bpMetric{text-align:right}
  .bpMetric em{display:block;font-style:normal;font-size:10px;font-weight:800;color:var(--ink3);line-height:1.1}
  .bpMetric b{
    display:block;font-size:15px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.25}
  .boardTop{
    display:flex;align-items:center;gap:6px;position:relative;z-index:2;flex-wrap:nowrap;overflow:visible;
    padding-bottom:3px;margin-top:0}
  .lvChip{
    font-size:12px;font-weight:800;letter-spacing:-.01em;color:#04372A;background:var(--mint);border-radius:9px;
    padding:4px 9px;box-shadow:0 2px 0 #0FB88C}
  .lvChip.mix{color:#fff;background:var(--blue);box-shadow:0 2px 0 var(--blue2)}
  .lvChip.final{color:#fff;background:var(--orange);box-shadow:0 2px 0 #D96000}
  .lvChip.inf{color:#fff;background:var(--red);box-shadow:0 2px 0 #C42218}
  .stageBest{
    font-size:10px;font-weight:800;letter-spacing:-.01em;color:#8A5A00;white-space:nowrap;background:#FFF6DC;
    border:1.5px solid #FFE1A0;border-radius:999px;padding:3px 8px;font-variant-numeric:tabular-nums}
  .boardProg{
    margin-left:auto;font-size:10.5px;font-weight:800;color:var(--ink3);font-variant-numeric:tabular-nums;
    white-space:nowrap}
  .boardTitle{
    position:relative;z-index:2;line-height:1.18;font-weight:800;letter-spacing:-.035em;color:var(--ink);
    word-break:keep-all;margin-top:12px;font-size:26px}
  .boardSub{
    position:relative;z-index:2;margin-top:7px;font-size:12px;font-weight:800;color:var(--ink2);letter-spacing:-.01em}
  .boardSub.lock{color:#8A6135}
  .tierRow{
    position:relative;z-index:4;display:flex;justify-content:flex-end;align-items:flex-end;padding:0 18px;
    margin-bottom:-2px;min-height:0}
  .tSeg{display:inline-flex;align-items:flex-end;gap:4px;padding:0;background:none;box-shadow:none}
  .tSegBtn{
    -webkit-appearance:none;appearance:none;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;
    justify-content:center;gap:3px;min-width:44px;height:27px;padding:0 12px;border-radius:11px 11px 0 0;
    border:1.5px solid #D3E2EE;border-bottom:0;background:#E3EEF6;color:#748699;font-size:12px;font-weight:800;
    line-height:1;letter-spacing:0;transition:background .12s, color .12s, height .12s, transform .1s}
  .tSegBtn b{font-size:12px;font-weight:800}
  .tSegBtn .iLock{display:grid;place-items:center;width:9px;height:9px;opacity:.65}
  .tSegBtn .iLock svg{width:9px;height:9px;display:block}
  .tSegBtn.done{background:#DCF8EE;border-color:#A8EAD3;color:var(--mint3)}
  .tSegBtn.on{
    height:33px;padding-bottom:2px;background:#FFFFFF;border-color:#DCE7F0;color:var(--ink);
    box-shadow:0 -2px 6px rgba(15,23,42,.06)}
  .tSegBtn.on.done{background:#FFFFFF;border-color:#DCE7F0;color:var(--mint3)}
  .tSegBtn.on.lock{background:#FFFFFF;border-color:#DCE7F0;color:#8D9BA8}
  .tSegBtn:active{transform:translateY(1px)}
  .boardKo{
    position:relative;z-index:2;font-weight:800;color:var(--mint3);letter-spacing:-.02em;margin-top:4px;
    font-size:14px}
  .bpProg{position:relative;z-index:2;display:flex;align-items:center;gap:8px;margin-top:10px}
  .bpProg b{
    flex:0 0 auto;font-size:11px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums;
    letter-spacing:-.01em;white-space:nowrap}
  .boardBar{
    position:relative;z-index:2;flex:1 1 auto;min-width:44px;height:8px;border-radius:999px;overflow:hidden;
    background:#EDF1F6;box-shadow:inset 0 1px 2px rgba(15,23,42,.10)}
  .boardBar i{
    display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#5CF3CB,#14C89A);
    transition:width .45s cubic-bezier(.2,.9,.2,1)}
  .boardBar i.done{background:linear-gradient(90deg,#FFD25A,#FFB000)}
  .boardNav{
    -webkit-appearance:none;appearance:none;position:absolute;top:50%;transform:translateY(-50%);width:32px;
    height:56px;border-radius:14px;display:grid;place-items:center;cursor:pointer;background:#fff;
    border:1.5px solid var(--line);box-shadow:0 2px 0 var(--line);color:var(--ink);z-index:5;padding:0}
  .boardNav svg{width:18px;height:18px;display:block}
  .boardNav:active{transform:translateY(-50%) translateY(2px);box-shadow:none}
  .boardNav.prev{left:-2px}
  .boardNav.next{right:-2px}
  .boardNav[disabled]{opacity:.32;color:var(--ink3);visibility:hidden}
  .lobbyAction{flex:0 0 auto;padding:6px 18px 20px;display:flex;flex-direction:column;gap:7px}
  .btnStart3d{height:68px;border-radius:22px;font-size:22px;letter-spacing:-.02em;margin-bottom:22px}
  .btnStart3d .star{
    width:24px;height:24px;flex:0 0 auto;background:radial-gradient(circle at 40% 35%,#fff,#CFFBEF 45%,#26D5A6);
    clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 95%,50% 72%,21% 95%,32% 57%,2% 35%,39% 35%)}

  /* ════════ 2. 하단 탭 바 — 컬러 3D 아이콘 · 유리 광택 홈 버튼 ════════ */
  .tabbar{
    flex:0 0 auto;display:flex;align-items:center;z-index:20;position:relative;bottom:0;margin-top:auto;gap:0;
    padding:6px 10px calc(env(safe-area-inset-bottom,0px) + 10px);background:rgba(255,255,255,.96);
    border-top:1px solid #E6ECF2;border-radius:0;box-shadow:0 -6px 20px rgba(16,40,32,.05)}
  .tab{
    -webkit-appearance:none;appearance:none;border:0;background:none;font-family:inherit;cursor:pointer;flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:#8A96A6;
    padding:4px 0 4px;position:relative}
  .tab svg{width:34px;height:34px;display:block}
  .tab.on{color:var(--blue)}
  .tab.on .tabIco{transform:translateY(-1px) scale(1.06)}
  .tab.on:after{
    content:"";position:absolute;bottom:0;width:26px;height:3.5px;border-radius:3px;
    background:linear-gradient(90deg,#5CF3CB,#14C89A)}
  .tabIco{
    display:grid;place-items:center;transition:transform .12s;width:48px;height:40px;border-radius:15px;
    position:relative}
  .tab:not(.home).on .tabIco{
    background:linear-gradient(180deg,#FFFFFF 0%,#E9FBF5 60%,#DBF6EC 100%);
    box-shadow:inset 0 1.5px 0 #FFFFFF, 0 2px 6px rgba(20,200,154,.18), 0 0 0 1.5px rgba(20,200,154,.16)}
  .tab:not(.home):not(.on) .tabIco svg{opacity:.74;filter:saturate(.86)}
  .tab:not(.home).on .tabIco svg{opacity:1;filter:drop-shadow(0 2px 3px rgba(11,122,95,.22))}
  .tab:active .tabIco{transform:translateY(2px) scale(.96)}
  .tab.home{flex:0 0 auto;width:100px}
  .tab.home .tabIco{
    width:62px;height:62px;border-radius:50%;margin-top:-48px;
    background:linear-gradient(180deg,#57A6FF 0%,#0A7BFF 46%,#0055D8 100%);border:3px solid #FFFFFF;
    box-shadow:0 5px 0 #0047B3, 0 10px 18px rgba(0,92,230,.30), inset 0 2px 0 rgba(255,255,255,.45)}
  .tab.home .tabIco:after{
    content:"";position:absolute;left:8px;right:8px;top:5px;height:22px;
    border-radius:50% 50% 46% 46% / 72% 72% 28% 28%;
    background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.06));pointer-events:none}
  .tab.home .tabIco svg{
    width:32px;height:32px;color:#fff;position:relative;z-index:1;filter:drop-shadow(0 1.5px 1px rgba(0,40,110,.35))}
  .tab.home.on:after{display:none}
  .tab.home.on .tabIco{transform:none}
  .tab.home:active .tabIco{transform:translateY(3px);box-shadow:0 2px 0 #0047B3, 0 4px 10px rgba(0,92,230,.26)}

  /* ════════ 3. 여정 맵 ════════ */
  .view.journey{background:#F1FAF6}
  .jHead{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;position:relative;z-index:20;background:#fff;
    border-radius:0;box-shadow:none;padding:12px 16px;border-bottom:1px solid #E6ECF2}
  .jTitle{font-size:18px;font-weight:800;letter-spacing:-.045em;color:var(--ink);white-space:nowrap}
  .jTitle em{font-style:normal;color:var(--mint2)}
  .jCount{
    margin-left:auto;font-size:12px;font-weight:800;color:var(--mint3);font-variant-numeric:tabular-nums;
    background:var(--mintL);border:1.5px solid #9DEFD2;border-radius:999px;padding:3px 10px}
  .jScroll::-webkit-scrollbar{display:none}
  .jScroll{
    flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;position:relative;border-bottom:0;margin:0;border:0;border-radius:0}
  .jScroll.padcard{padding-bottom:86px}
  .jMap{
    position:relative;width:100%;overflow:hidden;
    background:radial-gradient(46% 4.5% at 84% 1.6%, #FFF6DC 0%, rgba(255,246,220,0) 72%), radial-gradient(60% 16% at 22% 6%, #FFFFFF 0%, rgba(255,255,255,0) 66%), linear-gradient(180deg,#E4FBF4 0%,#EEFAF6 52%,#E2F8F0 100%)}
  .jMap:after{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.3;
    background-image:radial-gradient(rgba(20,200,154,.18) 1.2px, rgba(0,0,0,0) 1.2px);background-size:18px 18px;
    display:none}
  .jDeco .sun{
    position:absolute;right:30px;top:30px;width:54px;height:54px;border-radius:50%;
    background:radial-gradient(circle at 42% 36%,#FFFDF2,#FFE9A8 68%,#FFDD86);opacity:.9;
    box-shadow:0 0 0 15px rgba(255,243,204,.32)}
  .jDeco .cloud{
    position:absolute;border-radius:999px;background:#fff;
    box-shadow:-11px 7px 0 -3px #fff, 13px 6px 0 -5px #fff, 0 7px 12px rgba(20,120,100,.05)}
  .jNode .jTier{
    position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);display:flex;align-items:center;gap:1px;
    padding:2px 5px;border-radius:999px;z-index:4;background:#FFFFFF;border:1.5px solid #E3EAF2;
    box-shadow:0 2px 5px rgba(15,23,42,.12)}
  .jNode .jTier i{display:block;width:15px;height:15px;color:#C6D1DE}
  .jNode .jTier i.on{color:#FFB000}
  .jNode .jTier svg{width:15px;height:15px;display:block}
  .jNode .jTier i.on svg{filter:drop-shadow(0 1px 1px rgba(180,110,0,.28))}
  .jNode.done .jTier{border-color:#8FE8CF;background:#F4FFFB}
  .jNode.now .jTier{border-color:#9CC8FF;background:#F3F9FF}
  .jNode.lock .jTier{background:#F7F9FB;border-color:#E6EBF1;box-shadow:none}
  .jPath{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:1}

  /* ════════ 4. 인게임 — HUD ════════ */

    display:inline-flex;align-items:center;gap:3px}

  /* ════════ 5. 낙하 구역(스테이지 게임판) · 캡슐 ════════ */
  .sky{
    flex:1 1 0;min-height:150px;position:relative;margin:8px 12px 0;border-radius:22px;overflow:hidden;
    background:linear-gradient(180deg,#7FE0F7 0%,#A9F0DE 55%,#DFFBF2 100%);border:2px solid #FFFFFF;
    box-shadow:0 8px 22px rgba(15,23,42,.14)}

  .sky.th2{background:linear-gradient(180deg,#2F7BFF 0%,#63B6FF 55%,#CDE7FF 100%)}
  .sky.th3{background:linear-gradient(180deg,#7B6CFF 0%,#B79CFF 55%,#E8E1FF 100%)}
  .sky.th4{background:linear-gradient(180deg,#FF8A5B 0%,#FFB27A 55%,#FFE3C6 100%)}
  .sky.th5{background:linear-gradient(180deg,#0E9C7A 0%,#2FD3A6 55%,#C7F8E9 100%)}
  .sky.th6{background:linear-gradient(180deg,#121C3E 0%,#2A3E7C 58%,#5A6FBE 100%)}

    position:absolute;left:0;top:0;z-index:5;display:inline-flex;align-items:center;justify-content:center;width:auto;
    min-width:120px;max-width:calc(100% - 20px);box-sizing:border-box;padding:0 16px 0 24px;border-radius:16px;
    will-change:transform;cursor:pointer;background:#FFFFFF;border:1.5px solid #D8E0EA;
    border-bottom:3px solid #C2CCDB;box-shadow:0 6px 14px rgba(15,23,42,.20);transform:translate3d(0,0,0);

  .flash{

  /* ════════ 6. 조작부 — 게임판과 확실히 나뉜 보드 턱 ════════ */
  .boardPad{
    flex:0 0 auto;padding:0;margin-top:10px;background:#F3F6FA;border-top:1px solid #E1E7EF;
    border-radius:24px 24px 0 0;box-shadow:0 -6px 16px rgba(15,23,42,.06)}

    background:#E3E9F1;box-shadow:inset 0 2px 6px rgba(15,23,42,.16), inset 0 -1px 0 rgba(255,255,255,.9)}

    display:inline-flex;align-items:center;padding:5px 9px;border-radius:10px;font-size:12.5px;font-weight:800;

    border-bottom:3px solid var(--line3)}

    font-weight:800;color:var(--ink3);margin-top:2px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;min-height:11px;line-height:1.1;margin:5px 4px 0;font-size:11px}

  .hintIn.ok{color:var(--mint3)}

  .slots .slot:last-child{animation:slotPop .34s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes slotPop{0%{transform:scale(.72);opacity:.35}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
  .slot.ok{background:var(--mintL);border-color:#9DEFD2;border-bottom-color:#3CECC0;color:#0A6B52}
  .slot.bad{
    background:#FFF1EE;border-color:#FFB3A7;border-bottom-color:#FF5A36;color:#B02A10;
    animation:chipBad .5s cubic-bezier(.36,.07,.19,.97) both}
  .slot.na{opacity:.38}
  @keyframes chipBad{0%,100%{transform:translateX(0)}
    15%{transform:translateX(-4px) rotate(-2deg)}
    35%{transform:translateX(4px) rotate(2deg)}
    55%{transform:translateX(-3px) rotate(-1deg)}
    75%{transform:translateX(2px)}}

  .slots.shake{animation:shakeS .26s ease-out}
  @keyframes shakeS{0%,100%{transform:translateX(0)}
    20%{transform:translateX(-5px)}
    45%{transform:translateX(4px)}
    70%{transform:translateX(-2px)}}
  .pool{flex:0 0 auto;display:flex;flex-wrap:wrap;align-content:flex-start;overflow:hidden;margin:10px 12px 0;gap:7px}
  .poolSep{flex:0 0 100%;height:0;margin:0;pointer-events:none}
  .blk{
    -webkit-appearance:none;appearance:none;font-family:inherit;cursor:pointer;font-weight:800;letter-spacing:-.02em;
    color:var(--ink);white-space:nowrap;background:linear-gradient(180deg,#FFFFFF 0%,#F0F4FA 100%);
    border:1.5px solid #D3DBE6;border-bottom:4px solid #BFC9D8;border-radius:12px;
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95), 0 3px 7px rgba(15,23,42,.10);
    transition:transform .07s ease, box-shadow .07s ease, opacity .15s}

  /* ════════ v51 · 정리 후 조정 ════════ */
  /* 보조 글자는 600 — 제목(800)·레이블(700)과 무게로도 구분 */
  .boardSub, .bpMetric em, .pSub, .panel .lead, .jCard .jl span, .jTierNote, .brow .txt span, .built, .hint, .goalTxt, .stats em{font-weight:600}
  .boardSub:empty, .pSub:empty{display:none}
  /* 홈 카드 아래 줄 — 최고 기록만 */
  .bpStub{justify-content:flex-end}
  .bpMetrics{margin-left:0}
  /* 내려오는 문장 카드 — 점 장식 없이 가운데 정렬 */
  .row{padding:0 18px}
  .row.twoline{padding:6px 16px}
  /* 여정 — 깃발·보물상자 번호 배지 없이, 잠긴 라벨도 읽히게 */
  .jFlag, .jNo{display:none}
  .jNode.lock .jCap{background:#FFFFFF;color:#6B7684;box-shadow:0 1px 3px rgba(20,40,60,.12)}
  /* 탭바 — 손가락이 편한 높이로 올린다 */
  .tabbar{padding:8px 10px max(22px, calc(env(safe-area-inset-bottom,0px) + 12px))}
  .firebar{padding:10px 12px max(18px, calc(env(safe-area-inset-bottom,0px) + 8px))}
  .stars .st.off{opacity:1;filter:none}
  .new, .panel .best{background:var(--pl-coral);color:#FFFFFF;border:0;
    box-shadow:inset 0 1px 1px rgba(255,255,255,.45), 0 6px 14px -6px rgba(240,96,63,.6)}

  /* ════════ v52 · 여정 — 3D 숫자판 + 그 위에 둥둥 뜨는 캐릭터 ════════ */
  /* 숫자판: 위 하이라이트 + 아래 두께(같은 색 짙은 띠) + 바닥 그림자 → 원판 */
  .jPod{width:60px;height:38px;bottom:14px;
    box-shadow:inset 0 2px 1px rgba(255,255,255,.55), inset 0 -3px 6px rgba(0,40,120,.20), 0 6px 0 #0A58C9, 0 13px 14px -3px rgba(0,80,200,.38)}
  .jNode.now .jPod{box-shadow:inset 0 2px 1px rgba(255,255,255,.55), inset 0 -3px 6px rgba(0,40,120,.20), 0 6px 0 #0A58C9, 0 13px 14px -3px rgba(0,80,200,.38), 0 0 0 7px rgba(0,122,255,.13)}
  .jNode.done .jPod{box-shadow:inset 0 2px 1px rgba(255,255,255,.6), inset 0 -3px 6px rgba(6,120,90,.20), 0 6px 0 #10A47D, 0 13px 14px -3px rgba(16,150,112,.32)}
  .jNode.lock .jPod{box-shadow:inset 0 2px 1px #FFFFFF, inset 0 -3px 6px rgba(20,40,60,.07), 0 5px 0 #BFC8D3, 0 11px 12px -3px rgba(20,40,60,.16)}
  .jPod.gold{box-shadow:inset 0 2px 1px rgba(255,255,255,.5), inset 0 -3px 6px rgba(170,50,20,.20), 0 6px 0 #D24E22, 0 13px 14px -3px rgba(240,96,63,.38)}
  .jNum{bottom:20px;font-size:17px}
  .jNode.lock .jLock{bottom:23px}
  /* 캐릭터: 숫자판 바로 위에서 위아래로 둥둥, 판 위 그림자는 뜰 때 작아진다 */
  .jMascot{left:50%;top:auto;bottom:46px;width:50px;height:50px;margin:0 0 0 -25px;z-index:6;animation:none;filter:none}
  .jMascot svg{width:100%;height:100%;animation:mFloat 2.2s ease-in-out infinite;
    filter:drop-shadow(0 6px 5px rgba(16,40,32,.16))}
  .jMascot:after{content:"";position:absolute;left:50%;bottom:-3px;width:30px;height:8px;margin-left:-15px;border-radius:50%;
    background:rgba(4,40,90,.28);animation:mShadow 2.2s ease-in-out infinite;z-index:-1}
  .jNode.kind-mix .jMascot, .jNode.kind-final .jMascot{bottom:56px}
  .jNode.kind-inf .jMascot{bottom:80px}
  @keyframes mFloat{0%,100%{transform:translateY(-11px)}50%{transform:translateY(-2px)}}
  @keyframes mShadow{0%,100%{transform:scale(.62);opacity:.45}50%{transform:scale(1);opacity:.9}}

  /* ════════ v53 · 떠 있는 필로우 탭바 ════════
     화면 끝에 붙은 직선 띠 대신, 둥근 모서리 + 필로우 그림자로 바닥에서 띄운다.
     바 뒤로 배경이 이어지고, 각 화면은 바 높이만큼 아래 여백을 둔다. */
  :root{--tabH:72px;--tabGap:max(28px, calc(env(safe-area-inset-bottom,0px) + 14px))}
  .tabbar{position:absolute;left:14px;right:14px;bottom:var(--tabGap);margin:0;
    padding:6px 8px 8px;border:0;border-radius:28px;
    background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    box-shadow:inset 0 2px 1px #FFFFFF, inset 0 -4px 10px rgba(20,40,60,.05), 0 14px 32px -10px rgba(16,40,32,.30), 0 2px 6px rgba(16,40,32,.08)}
  .tabIco, .tab.home .tabIco{height:32px;border-radius:16px}
  .view.lobby .lobbyStage{padding-bottom:calc(var(--tabH) + var(--tabGap) + 8px)}
  .jScroll{padding-bottom:calc(var(--tabH) + var(--tabGap) + 16px)}
  .jScroll.padcard{padding-bottom:calc(var(--tabH) + var(--tabGap) + 170px)}
  .jCard{bottom:calc(var(--tabH) + var(--tabGap) + 10px)}
  .fbody, .fbody.pad{padding-bottom:calc(var(--tabH) + var(--tabGap) + 24px)}

  /* ════════ v53 · 지도 풍경 — 챕터 테마 띠 + 장식 ════════ */
  .jDeco .deco{position:absolute;display:block;pointer-events:none}
  .jDeco .deco svg{width:100%;height:100%;display:block;overflow:visible}
  .jDeco .deco.tw{animation:twinkle 2.6s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
  .zoneTag{position:absolute;z-index:1;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px 0 6px;
    border-radius:999px;font-size:12px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;
    background:rgba(255,255,255,.82);color:#374151;box-shadow:0 4px 12px -4px rgba(16,40,32,.25)}
  .zoneTag b{display:inline-grid;place-items:center;height:20px;padding:0 7px;border-radius:999px;font-size:10.5px;font-weight:800;color:#FFFFFF}
  .zoneTag.z1 b{background:#14B5A8} .zoneTag.z2 b{background:#2F7BFF} .zoneTag.z3 b{background:#8A6CFF}
  .zoneTag.z4 b{background:#FF7A55} .zoneTag.z5 b{background:#14A86E} .zoneTag.z6 b{background:#6B7CFF}
  .zoneTag.z6{background:rgba(255,255,255,.14);color:#E6EBFF;box-shadow:none}
  /* 밤하늘 구역 — 잠긴 레벨 캡션·길 대비 */
  .jNode.zone6.lock .jNum{color:#C9D3F0}
  .jNode.kind-inf .jNum{display:none}
  .jNode.zone6 .jBase{opacity:.25}
  /* 지도 카드 — 완료 배지·레벨 칩 */
  .jCard .jdn{display:inline-flex;align-items:center;gap:3px}
  .jCard .jdn svg{width:10px;height:10px;display:block}
  .jCard .jlv{color:#04372A}
  .jCard.lock .jlv{background:#E9EEF3;color:#5B6875;box-shadow:none}

  /* ════════ v53 · 탭바 글래스모피즘 ════════ */
  .tabbar{background:rgba(255,255,255,.42);
    -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
    border:1px solid rgba(255,255,255,.7);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.85), 0 14px 34px -12px rgba(16,40,32,.35), 0 2px 8px rgba(16,40,32,.08)}
  .tab{color:#4B5563}
  .tab.on{color:#0B8A63}
  .tab.on .tabIco, .tab.home.on .tabIco, .tab:not(.home).on .tabIco{background:rgba(255,255,255,.75);
    box-shadow:inset 0 1px 0 #FFFFFF, 0 4px 10px -4px rgba(16,40,32,.25)}

  /* ════════ v54 · 글래스모피즘 — 화려한 배경 위에 떠 있는 요소에만 ════════
     읽어야 하는 본문(홈 카드·내려오는 문장·팝업)은 불투명하게 둔다. */
  :root{
    --gl-bg:rgba(255,255,255,.46);
    --gl-bd:1px solid rgba(255,255,255,.72);
    --gl-blur:blur(18px) saturate(180%);
    --gl-sh:inset 0 1px 0 rgba(255,255,255,.85), 0 10px 26px -12px rgba(16,40,32,.30), 0 1px 3px rgba(16,40,32,.06);
    --headH:58px;
  }
  /* 지도·문장 화면 제목줄 — 내용 위에 떠서 아래가 비쳐 보이게 */
  .view.journey, .view.book{position:relative}
  .jHead, .view.book .fhead{position:absolute;left:0;right:0;top:0;z-index:20;height:var(--headH);
    background:rgba(255,255,255,.55);-webkit-backdrop-filter:var(--gl-blur);backdrop-filter:var(--gl-blur);
    border-bottom:1px solid rgba(255,255,255,.6);box-shadow:0 6px 20px -12px rgba(16,40,32,.25)}
  .jScroll{padding-top:var(--headH)}
  .view.book .fbody{padding-top:var(--headH)}
  .pgroup h3{top:0;background:rgba(247,248,250,.62);
    -webkit-backdrop-filter:var(--gl-blur);backdrop-filter:var(--gl-blur)}
  .jCount, .fhead .cnt{background:rgba(255,255,255,.6);border:var(--gl-bd)}
  /* 지도 위 카드·챕터 이름표 */
  .jCard{background:rgba(255,255,255,.72);-webkit-backdrop-filter:var(--gl-blur);backdrop-filter:var(--gl-blur);
    border:var(--gl-bd);box-shadow:var(--gl-sh), 0 18px 40px -14px rgba(16,40,32,.30)}

  .lobbyChip, .avatarBox, .boardNav{background:var(--gl-bg);-webkit-backdrop-filter:var(--gl-blur);backdrop-filter:var(--gl-blur);
    border:var(--gl-bd);box-shadow:var(--gl-sh)}
  /* 알림 토스트 — 어두운 유리 */
  .toast{background:rgba(17,24,39,.62);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);
    border:1px solid rgba(255,255,255,.14)}
  /* 팝업 뒤 배경 — 흐림을 조금 더 */
  .sheet{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  /* 지도 카드 — 옛 메타 문구 규칙(.jCard .jl span)이 칩까지 덮지 않게 */
  .jCard .jl .jlv{display:inline-block;color:#04372A;font-size:11.5px;font-weight:800;margin-top:0}
  .jCard.lock .jl .jlv{background:#E9EEF3;color:#5B6875}

  .jCard .jl .jdn.hide{display:none}

  /* ════════ v55 · 홈 카드 — 시작 버튼과 같은 폭 ════════
     좌우 화살표 자리를 비우느라 좁아졌던 카드를 넓힌다. 이동은 레벨 띠 탭 · 카드 좌우 밀기로. */
  .boardNav{display:none}
  .boardWrap{width:100%}
  .lobbyStage .lobbyAction{padding:0}
  .board{padding:20px 22px 16px}
  .boardTitle{font-size:29px;margin-top:14px}

  /* 카드를 밀어 넘길 때 살짝 따라가는 손맛 */
  .board.swL{animation:cardSwL .26s cubic-bezier(.2,.9,.3,1)}
  .board.swR{animation:cardSwR .26s cubic-bezier(.2,.9,.3,1)}
  @keyframes cardSwL{0%{transform:translateX(28px);opacity:.4}100%{transform:none;opacity:1}}
  @keyframes cardSwR{0%{transform:translateX(-28px);opacity:.4}100%{transform:none;opacity:1}}
  @media (max-height:720px){

  /* ════════ v56 · 홈 카드 다시 잡기 ════════
     탑승권 흔적(반원 홈·점선) 제거. 레벨·별 → 패턴 → 예문 말풍선(듣기) → 난이도 → 진행 → 기록 한 줄 */
  .board{-webkit-mask-image:none;mask-image:none;padding:20px 20px 18px;border-radius:28px}

  .egTxt i{font-style:normal;font-size:12px;font-weight:600;color:#6B7684;line-height:1.3}

  @media (max-height:720px){

    .egAva{width:34px;height:34px} .egAva svg{width:26px;height:26px}
    .egTxt i{display:none}
    .lobbyTiers{margin-top:10px}
    .tSegBtn, .tSegBtn.on, .tSegBtn.on.done{height:36px}
    .bpProg{margin-top:10px}
  }
  .lvChip.lock{background:#E9EEF3;color:#6B7684;box-shadow:none}

  /* ════════ v59 · 꼬리 모드 ════════ */
  .tailEntry{order:2;-webkit-appearance:none;appearance:none;border:0;font-family:inherit;cursor:pointer;text-align:left;
    display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:12px 14px 12px 12px;border-radius:20px;
    background:var(--gl-bg);-webkit-backdrop-filter:var(--gl-blur);backdrop-filter:var(--gl-blur);border:var(--gl-bd);box-shadow:var(--gl-sh)}

  .tCue{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:10px 4px}

  .tOpt{-webkit-appearance:none;appearance:none;border:0;font-family:inherit;cursor:pointer;touch-action:manipulation;

  .tWeak p{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0}
  .tWeak p b{font-weight:800;color:var(--ink)}

  @media (max-height:720px){

  /* ════════ v60 · 꼬리 모드 — 타이핑(정확도) ════════
     키보드가 아래를 덮으므로 입력칸까지 모두 화면 위쪽에 모은다 */
  .view.tail .tCue{flex:0 0 auto;justify-content:flex-start;padding:18px 0 8px;gap:12px}

  .tSent{font-size:15px}
  .tType{display:flex;gap:8px;margin-top:6px}
  .tInput{flex:1;min-width:0;height:54px;padding:0 16px;border-radius:16px;border:0;outline:0;font-family:inherit;
    font-size:18px;font-weight:700;color:var(--ink);background:#FFFFFF;
    box-shadow:inset 0 2px 4px rgba(20,40,60,.08), 0 0 0 1.5px #D6E0E8}

    min-width:84px;height:54px;border-radius:16px;font-size:16px;font-weight:800;color:#04372A;

    .tCell{width:20px;height:30px;font-size:17px}
  }

  /* ════════ v61 · 꼬리 모드 — 키보드 위에 다 들어가게 ════════ */
  .view.tail{position:fixed;left:0;right:0;top:0;height:100%;max-width:520px;margin:0 auto;z-index:30;overflow:hidden;
    padding:0 16px 8px}
