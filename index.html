<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html, body{height:100%;height:100dvh;overflow:hidden;background:#EDF2F8}
  :root{
    --ink:#111827;--ink2:#4B5563;--ink3:#9CA3AF;--white:#FFFFFF;--bg:#FFFFFF;--mint:#3CECC0;--mint2:#14C89A;
    --mint3:#0D9F71;--mintL:#E9FDF7;--mintBg:#F2FBF8;--blue:#007AFF;--blue2:#005CE6;--blueL:#E8F2FF;--blueDot:#2563EB;
    --orange:#FF7A00;--red:#FF3B30;--coral:#FF5A36;--line:#E5E7EB;--line2:#D1E3DD;--line3:#CBD5E1;
    --sh1:0 1px 2px rgba(16,40,32,.06), 0 6px 18px rgba(16,40,32,.07);
    --sh2:0 1px 2px rgba(16,40,32,.06), 0 12px 28px rgba(16,40,32,.10);--hair:#E4EBE8;
    --pl-hi:inset 0 2px 1px rgba(255,255,255,.65);
    --pl-mint:linear-gradient(180deg,#72F6D5 0%,#43ECC3 52%,#2CDBAE 100%);
    --pl-mint-sh:inset 0 2px 1px rgba(255,255,255,.6), inset 0 -5px 10px rgba(6,128,96,.20), 0 12px 24px -8px rgba(20,190,148,.60), 0 2px 5px rgba(14,150,112,.18);
    --pl-white:linear-gradient(180deg,#FFFFFF 0%,#F3F6F9 100%);
    --pl-white-sh:inset 0 2px 1px #FFFFFF, inset 0 -4px 8px rgba(20,40,60,.06), 0 8px 18px -6px rgba(20,40,60,.20), 0 1px 3px rgba(20,40,60,.08);
    --pl-blue:linear-gradient(180deg,#5AB0FF 0%,#1E86FF 55%,#0B6FEA 100%);
    --pl-blue-sh:inset 0 2px 1px rgba(255,255,255,.45), inset 0 -5px 10px rgba(0,50,140,.25), 0 12px 22px -8px rgba(0,110,240,.60), 0 2px 5px rgba(0,80,200,.18);
    --pl-coral:linear-gradient(180deg,#FFA078 0%,#FF7A55 55%,#F2603F 100%);
    --pl-coral-sh:inset 0 2px 1px rgba(255,255,255,.5), inset 0 -5px 10px rgba(170,50,20,.22), 0 12px 22px -8px rgba(240,96,63,.60), 0 2px 5px rgba(200,70,40,.18);
    --pl-gray:linear-gradient(180deg,#F3F6F9 0%,#E2E8EE 100%);
    --pl-gray-sh:inset 0 2px 1px #FFFFFF, inset 0 -4px 8px rgba(20,40,60,.07), 0 4px 10px -4px rgba(20,40,60,.14)}
  body{
    color:var(--ink);background:#EDF2F8;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Helvetica Neue",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
    -webkit-text-size-adjust:100%;text-size-adjust:100%}
  .app{
    position:fixed;inset:0;margin:0 auto;width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;
    overflow:hidden;padding:0;background:#FFFFFF}
  .view{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;position:relative;background:#FFFFFF}
  .hide{display:none !important}

  /* ════════ 공통: 버튼 · 배지 ════════ */
  .btn3{
    -webkit-appearance:none;appearance:none;border:0;font-family:inherit;cursor:pointer;position:relative;
    display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;letter-spacing:-.02em;
    white-space:nowrap;transition:transform .07s ease, box-shadow .07s ease}
  .btn3 svg{width:22px;height:22px;display:block;flex:0 0 auto}
  .btn3:active{transform:translateY(4px)}
  .btn3.mint{
    background:linear-gradient(180deg,#5CF3CB 0%,#3CECC0 48%,#22D9AA 100%);border:2px solid #8FF8DC;
    box-shadow:0 6px 0 #0FB88C, 0 12px 20px rgba(20,200,154,.28);color:#04372A}
  .btn3.mint:active{box-shadow:0 2px 0 #0FB88C}
  .btn3.locked{
    background:linear-gradient(180deg,#E7EBF0 0%,#D3DAE3 100%);border:2px solid #E2E8F0;box-shadow:0 6px 0 #B9C2CE;
    color:#6B7684}
  .btn3.locked:active{transform:none;box-shadow:0 6px 0 #B9C2CE}
  .btn3.locked .star{display:none}
  .badge{
    display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px 0 8px;border-radius:999px;
    background:#fff;border:1.5px solid var(--line);box-shadow:0 2px 0 var(--line);font-weight:800;font-size:14px;
    color:var(--ink);font-variant-numeric:tabular-nums}
  .badge svg{width:18px;height:18px;display:block}
  .badge em{font-style:normal;font-size:9px;letter-spacing:.1em;color:var(--ink3)}
  .icon3{
    -webkit-appearance:none;appearance:none;border:0;font-family:inherit;cursor:pointer;width:38px;height:38px;
    border-radius:12px;display:grid;place-items:center;flex:0 0 auto;background:#fff;border:1.5px solid var(--line);
    box-shadow:0 2px 0 var(--line);color:var(--ink2);transition:transform .07s}
  .icon3:active{transform:translateY(2px);box-shadow:0 0 0 var(--line)}
  .icon3 svg{width:20px;height:20px;display:block}
  .icon3.off{color:var(--ink3);background:#F3F4F6}

  /* ════════ 피클 ㅌ 마스코트 ════════ */
  .mascot{display:block;width:100%;height:100%;overflow:visible}
  .mascot .mEye{animation:mBlink 5.2s infinite}
  .mascot .mEyeShut{animation:mBlinkShut 5.2s infinite}
  @keyframes mBlink{0%,93%,100%{opacity:1}95%,97.5%{opacity:0}}
  @keyframes mBlinkShut{0%,93%,100%{opacity:0}95%,97.5%{opacity:1}}

  /* ════════ 1. 홈 로비 ════════ */
  .view.lobby{overflow:hidden}
  .lobbyBg{
    position:absolute;left:0;right:0;top:0;bottom:0;z-index:0;pointer-events:none;overflow:hidden;border-radius:0}
  .lobbyBg svg{width:100%;display:block;height:100%}
  .lobbyTop, .lobbyChips, .lobbyStage, .lobbyAction{position:relative;z-index:2}
  .lobbyTop{
    display:flex;align-items:center;flex:0 0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 4px;gap:10px}
  .avatarBox{
    position:relative;width:48px;height:48px;border-radius:15px;padding:2px;flex:0 0 auto;cursor:pointer;
    background:#fff;border:1.5px solid var(--line);box-shadow:0 2px 0 var(--line);font-family:inherit}
  .avatarBox:active{transform:translateY(2px)}
  .avatarBox .in{
    width:100%;height:100%;border-radius:12px;background:var(--mintBg);display:grid;place-items:center;
    overflow:hidden}
  .avatarBox .in svg{width:38px;height:38px}
  .avatarBox .gearTag{
    position:absolute;right:-4px;bottom:-4px;width:19px;height:19px;border-radius:50%;background:#fff;
    border:1.5px solid var(--line);box-shadow:0 1px 3px rgba(17,24,39,.12);display:grid;place-items:center;
    color:var(--muted)}
  .avatarBox .gearTag svg{width:11px;height:11px;display:block}
  .lobbyTop .spacer{margin-left:auto}
  .lobbyChips{flex:0 0 auto;display:flex;align-items:center;padding:0;gap:6px}
  .lobbyChip{
    display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);padding:5px 10px 5px 7px;
    border-radius:12px;box-shadow:0 2px 0 #E3E8EE}
  .lobbyChip .ic{display:grid;place-items:center;width:22px;height:22px}
  .lobbyChip .ic svg{width:22px;height:22px;display:block}
  .lobbyChip b{font-size:13px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
  .lobbyChip em{font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.04em;color:var(--ink3)}
  .lobbyStage{
    flex:1 1 auto;min-height:0;display:flex;align-items:center;position:relative;flex-direction:column;
    justify-content:center;padding:8px 16px 18px;gap:20px}
  .boardWrap{position:relative;z-index:1;max-width:none;width:calc(100% - 64px);padding-top:0}
  .boardWrap:before{
    content:"";position:absolute;left:1px;right:1px;bottom:1px;border-radius:22px;pointer-events:none;top:1px;
    box-shadow:0 1px 2px rgba(16,40,32,.06), 0 18px 36px -10px rgba(16,40,32,.18)}
  .boardMascot{
    position:absolute;left:50%;z-index:4;animation:bounceMascot 1.9s cubic-bezier(.5,0,.5,1) infinite;
    filter:drop-shadow(0 6px 8px rgba(17,24,39,.16));width:72px;height:72px;margin-left:-36px;top:-38px;display:none}
  @keyframes bounceMascot{0%,100%{transform:translateY(0) rotate(-2deg)}
    45%{transform:translateY(-9px) rotate(2deg)}
    62%{transform:translateY(-4px) rotate(1deg)}}
  .board{
    position:relative;border-radius:22px;background:#FFFFFF;
    -webkit-mask-image:radial-gradient(circle 10px at 0 calc(100% - 43px), #0000 97%, #000 100%), radial-gradient(circle 10px at 100% calc(100% - 43px), #0000 97%, #000 100%);
    -webkit-mask-composite:source-in;
    mask-image:radial-gradient(circle 10px at 0 calc(100% - 43px), #0000 97%, #000 100%), radial-gradient(circle 10px at 100% calc(100% - 43px), #0000 97%, #000 100%);
    mask-composite:intersect;padding:14px 18px 14px;border-color:var(--hair);border:0;box-shadow:none}
  .bpStub{
    position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:14px;padding-top:12px}
  .bpStub:before{content:"";position:absolute;left:-3px;right:-3px;top:0;border-top:1.5px dashed #DCE7F0}
  .bpStars{display:flex;align-items:center;gap:4px;flex:0 0 auto}
  .bpStar{
    display:grid;place-items:center;width:26px;height:26px;border:0;background:none;padding:0;border-radius:50%;
    transition:transform .12s, background .12s, box-shadow .12s}
  .bpStar.btn{cursor:pointer;pointer-events:none}
  .bpStar.btn:active{transform:scale(.9)}
  .bpStar.sel{opacity:1}
  .bpStar.lock svg{opacity:.55}
  .bpStar svg{width:22px;height:22px;display:block}
  .bpMetrics{display:flex;align-items:center;gap:14px;margin-left:auto}
  .bpMetric{text-align:right}
  .bpMetric em{display:block;font-style:normal;font-size:10px;font-weight:800;color:var(--ink3);line-height:1.1}
  .bpMetric b{
    display:block;font-size:15px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.25}
  .boardTop{
    display:flex;align-items:center;gap:6px;position:relative;z-index:2;flex-wrap:nowrap;overflow:visible;
    padding-bottom:3px;margin-top:0}
  .lvChip{
    font-size:12px;font-weight:800;letter-spacing:-.01em;color:#04372A;background:var(--mint);border-radius:9px;
    padding:4px 9px;box-shadow:0 2px 0 #0FB88C}
  .lvChip.mix{color:#fff;background:var(--blue);box-shadow:0 2px 0 var(--blue2)}

  /* ════════ 2. 하단 탭 바 — 컬러 3D 아이콘 · 유리 광택 홈 버튼 ════════ */
  .tabbar{

    border-top:1px solid #E6ECF2;border-radius:0;box-shadow:0 -6px 20px rgba(16,40,32,.05)}
  .tab{
    -webkit-appearance:none;appearance:none;border:0;background:none;font-family:inherit;cursor:pointer;flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:#8A96A6;
    padding:4px 0 4px;position:relative}
  .tab svg{width:34px;height:34px;display:block}
  .tab.on{color:var(--blue)}
  .tab.on .tabIco{transform:translateY(-1px) scale(1.06)}
  .tab.on:after{
    content:"";position:absolute;bottom:0;width:26px;height:3.5px;border-radius:3px;
    background:linear-gradient(90deg,#5CF3CB,#14C89A)}
  .tabIco{
    display:grid;place-items:center;transition:transform .12s;width:48px;height:40px;border-radius:15px;
    position:relative}
  .tab:not(.home).on .tabIco{

    box-shadow:inset 0 1.5px 0 #FFFFFF, 0 2px 6px rgba(20,200,154,.18), 0 0 0 1.5px rgba(20,200,154,.16)}
  .tab:not(.home):not(.on) .tabIco svg{opacity:.74;filter:saturate(.86)}
  .tab:not(.home).on .tabIco svg{opacity:1;filter:drop-shadow(0 2px 3px rgba(11,122,95,.22))}
  .tab:active .tabIco{transform:translateY(2px) scale(.96)}
  .tab.home{flex:0 0 auto;width:100px}
  .tab.home .tabIco{
    width:62px;height:62px;border-radius:50%;margin-top:-48px;
    background:linear-gradient(180deg,#57A6FF 0%,#0A7BFF 46%,#0055D8 100%);border:3px solid #FFFFFF;
    box-shadow:0 5px 0 #0047B3, 0 10px 18px rgba(0,92,230,.30), inset 0 2px 0 rgba(255,255,255,.45)}
  .tab.home .tabIco:after{
    content:"";position:absolute;left:8px;right:8px;top:5px;height:22px;
    border-radius:50% 50% 46% 46% / 72% 72% 28% 28%;
    background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.06));pointer-events:none}
  .tab.home .tabIco svg{
    width:32px;height:32px;color:#fff;position:relative;z-index:1;filter:drop-shadow(0 1.5px 1px rgba(0,40,110,.35))}
  .tab.home.on:after{display:none}
  .tab.home.on .tabIco{transform:none}
  .tab.home:active .tabIco{transform:translateY(3px);box-shadow:0 2px 0 #0047B3, 0 4px 10px rgba(0,92,230,.26)}

  /* ════════ 4. 인게임 — HUD ════════ */

    color:#fff;background:linear-gradient(180deg,#FF9A5C,#FF3B30);border-radius:9px;padding:2px 7px;

  /* ════════ 5. 낙하 구역(스테이지 게임판) · 캡슐 ════════ */
  .sky{
    flex:1 1 0;min-height:150px;position:relative;margin:8px 12px 0;border-radius:22px;overflow:hidden;
    background:linear-gradient(180deg,#7FE0F7 0%,#A9F0DE 55%,#DFFBF2 100%);border:2px solid #FFFFFF;
    box-shadow:0 8px 22px rgba(15,23,42,.14)}

  .sky.th2{background:linear-gradient(180deg,#2F7BFF 0%,#63B6FF 55%,#CDE7FF 100%)}
  .sky.th3{background:linear-gradient(180deg,#7B6CFF 0%,#B79CFF 55%,#E8E1FF 100%)}
  .sky.th4{background:linear-gradient(180deg,#FF8A5B 0%,#FFB27A 55%,#FFE3C6 100%)}
  .sky.th5{background:linear-gradient(180deg,#0E9C7A 0%,#2FD3A6 55%,#C7F8E9 100%)}
  .sky.th6{background:linear-gradient(180deg,#121C3E 0%,#2A3E7C 58%,#5A6FBE 100%)}

  .stageArt .artBot{bottom:0}

  .lane .line{
    position:absolute;left:0;right:0;border:0;height:8px;border-radius:0;bottom:0;
    background:repeating-linear-gradient(45deg,#FF6B5E 0 8px,#FFB4AB 8px 16px);
    box-shadow:0 -2px 10px rgba(255,59,48,.35)}
  .row{
    position:absolute;left:0;top:0;z-index:5;display:inline-flex;align-items:center;justify-content:center;width:auto;
    min-width:120px;max-width:calc(100% - 20px);box-sizing:border-box;padding:0 16px 0 24px;border-radius:16px;
    will-change:transform;cursor:pointer;background:#FFFFFF;border:1.5px solid #D8E0EA;
    border-bottom:3px solid #C2CCDB;box-shadow:0 6px 14px rgba(15,23,42,.20);transform:translate3d(0,0,0);
    transition:border-color .15s, box-shadow .15s, background .15s}
  .row .bob{
    position:relative;display:flex;align-items:center;justify-content:center;max-width:100%;
    animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(-1px)}50%{transform:translateY(1.5px)}}
  .row .glow{
    position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0))}
  .row .ko{
    display:block;max-width:100%;font-weight:800;letter-spacing:-.03em;color:var(--ink);white-space:nowrap;
    overflow:hidden;position:relative;pointer-events:none}
  .row.twoline{padding:6px 14px 6px 22px}
  .row.twoline .ko{white-space:normal;line-height:1.16;text-align:center;word-break:keep-all}
  .row.bossrow{background:var(--mintBg);border-color:#9DEFD2;border-bottom-color:#3CECC0}
  .row.target{

    box-shadow:0 0 0 4px rgba(37,99,235,.10), 0 6px 16px rgba(37,99,235,.20)}
  .sky.inDanger{
    box-shadow:inset 0 0 0 3px rgba(240,68,82,.65), inset 0 -46px 40px -12px rgba(240,68,82,.35);
    animation:dangerBorder .55s ease-in-out infinite alternate}
  @keyframes dangerBorder{from{box-shadow:inset 0 0 0 2.5px rgba(240,68,82,.45), inset 0 -40px 34px -14px rgba(240,68,82,.25)}

    z-index:15;border-color:var(--coral);border-bottom-color:#E8391F;

    animation:dangerPulse 1s ease-in-out infinite}
  @keyframes dangerPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.05)}}
  @keyframes rowIn{0%{opacity:0;scale:.9}60%{opacity:1;scale:1.02}100%{opacity:1;scale:1}}

  .fx{position:absolute;inset:0;pointer-events:none;z-index:9;overflow:hidden}

    position:absolute;left:50%;top:12px;transform:translate(-50%,-16px) scale(.92);opacity:0;z-index:12;

    white-space:nowrap;pointer-events:none;box-shadow:0 6px 16px rgba(17,24,39,.24);
    transition:opacity .22s, transform .28s cubic-bezier(.34,1.56,.64,1);border-radius:14px}
  .toast.blue{background:linear-gradient(180deg,#2F8BFF,#005CE6);box-shadow:0 6px 16px rgba(0,92,230,.34)}
  .toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
  .flash{
    position:absolute;inset:0;opacity:0;pointer-events:none;z-index:11;
    background:radial-gradient(circle at 50% 45%,#fff 0%,rgba(255,255,255,.5) 30%,rgba(255,255,255,0) 68%)}

  /* ════════ 6. 조작부 — 게임판과 확실히 나뉜 보드 턱 ════════ */
  .boardPad{
    flex:0 0 auto;padding:0;margin-top:10px;background:#F3F6FA;border-top:1px solid #E1E7EF;
    border-radius:24px 24px 0 0;box-shadow:0 -6px 16px rgba(15,23,42,.06)}
  .deck{flex:0 0 auto;border-radius:15px;margin:12px 12px 0;padding:0;background:transparent;border:0;box-shadow:none}
  .slots{
    display:flex;flex-wrap:wrap;align-items:center;gap:5px;min-height:44px;padding:4px 6px;border-radius:12px;
    background:#E3E9F1;box-shadow:inset 0 2px 6px rgba(15,23,42,.16), inset 0 -1px 0 rgba(255,255,255,.9)}
  .hint{letter-spacing:-.02em;font-size:12.5px;font-weight:700;color:#A3AEBD;padding-left:4px}
  .slot{
    display:inline-flex;align-items:center;padding:5px 9px;border-radius:10px;font-size:12.5px;font-weight:800;
    letter-spacing:-.02em;color:var(--ink);white-space:nowrap;background:#fff;border:1.5px solid var(--line);
    border-bottom:3px solid var(--line3)}
  .built{
    font-weight:800;color:var(--ink3);margin-top:2px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;min-height:11px;line-height:1.1;margin:5px 4px 0;font-size:11px}
  .hintIn{font-weight:800}
  .hintIn.ok{color:var(--mint3)}
  .hintIn.bad{color:var(--red)}
  .slots .slot:last-child{animation:slotPop .34s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes slotPop{0%{transform:scale(.72);opacity:.35}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
  .slot.ok{background:var(--mintL);border-color:#9DEFD2;border-bottom-color:#3CECC0;color:#0A6B52}
  .slot.bad{
    background:#FFF1EE;border-color:#FFB3A7;border-bottom-color:#FF5A36;color:#B02A10;
    animation:chipBad .5s cubic-bezier(.36,.07,.19,.97) both}
  .slot.na{opacity:.38}
  @keyframes chipBad{0%,100%{transform:translateX(0)}
    15%{transform:translateX(-4px) rotate(-2deg)}
    35%{transform:translateX(4px) rotate(2deg)}
    55%{transform:translateX(-3px) rotate(-1deg)}
    75%{transform:translateX(2px)}}
  .slots.ok .slot{border-color:#9DEFD2;border-bottom-color:#3CECC0;background:var(--mintL)}
  .slots.bad .slot{border-color:#FFB3A7;border-bottom-color:#FF5A36;background:#FFF1EE}
  .slots.shake{animation:shakeS .26s ease-out}
  @keyframes shakeS{0%,100%{transform:translateX(0)}
    20%{transform:translateX(-5px)}
    45%{transform:translateX(4px)}
    70%{transform:translateX(-2px)}}
  .pool{flex:0 0 auto;display:flex;flex-wrap:wrap;align-content:flex-start;overflow:hidden;margin:10px 12px 0;gap:7px}
  .poolSep{flex:0 0 100%;height:0;margin:0;pointer-events:none}
  .blk{
    -webkit-appearance:none;appearance:none;font-family:inherit;cursor:pointer;font-weight:800;letter-spacing:-.02em;
    color:var(--ink);white-space:nowrap;background:linear-gradient(180deg,#FFFFFF 0%,#F0F4FA 100%);
    border:1.5px solid #D3DBE6;border-bottom:4px solid #BFC9D8;border-radius:12px;
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95), 0 3px 7px rgba(15,23,42,.10);
    transition:transform .07s ease, box-shadow .07s ease, opacity .15s}
  .blk:active{transform:translateY(3px);border-bottom-width:1.5px;box-shadow:0 1px 3px rgba(15,23,42,.14)}
  .blk.pat{
    color:var(--blue2);background:linear-gradient(180deg,#EAF3FF 0%,#D5E7FF 100%);border-color:#A9CCFF;
    border-bottom-color:#7FB0FF}
  .blk.used{opacity:.3;filter:saturate(.4);transform:translateY(3px)}
  .firebar{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:9px;
    padding:10px 12px max(12px, env(safe-area-inset-bottom,0px))}
  .clearbtn{
    -webkit-appearance:none;appearance:none;font-family:inherit;cursor:pointer;width:58px;height:50px;
    border-radius:16px;display:grid;place-items:center;color:var(--ink2);background:#FFFFFF;
    border:1.5px solid var(--line);border-bottom:3px solid var(--line3)}
  .clearbtn:active{transform:translateY(2px);border-bottom-width:1.5px}
  .clearbtn svg{width:25px;height:25px;display:block}
  .fire{
    -webkit-appearance:none;appearance:none;border:0;font-family:inherit;cursor:pointer;flex:1;height:54px;
    border-radius:18px;display:flex;align-items:center;justify-content:center;gap:9px;color:#fff;
    background:linear-gradient(180deg,#FF9A5C 0%,#FF7A00 52%,#FF3B30 100%);border:2px solid #FFC49B;
    border-bottom:5px solid #C42218;box-shadow:0 6px 16px rgba(255,90,54,.26);
    transition:transform .07s, box-shadow .07s, background .2s}
  .fire:active{transform:translateY(3px);border-bottom-width:2px}
  .fire svg{width:32px;height:32px;display:block}
  .fire.dim{
    background:#F3F4F6;color:var(--ink3);border-color:var(--line);border-bottom-color:var(--line3);box-shadow:none}
  .fire.dim svg{filter:none;opacity:.55}
  .fire.recoil{animation:recoil .28s cubic-bezier(.2,.9,.3,1)}
  @keyframes recoil{0%{transform:translateY(0) scale(1)}
    28%{transform:translateY(5px) scale(.965)}
    62%{transform:translateY(-3px) scale(1.02)}
    100%{transform:translateY(0) scale(1)}}

  /* ════════ 7. 시트 ════════ */
  .sheet{
    position:fixed;left:0;right:0;top:0;bottom:0;z-index:60;display:flex;align-items:center;justify-content:center;
    padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(4px);

    border:1.5px solid var(--line);box-shadow:0 18px 50px rgba(17,24,39,.28);

    flex:1 1 auto;height:9px;border-radius:999px;overflow:hidden;display:block;background:#EDF1F6;
    box-shadow:inset 0 1px 2px rgba(15,23,42,.10)}
  .ovProg .ovTrack i{
    display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#5CF3CB,#14C89A);
    transition:width .45s cubic-bezier(.2,.9,.2,1)}
  .ovProg b{flex:0 0 auto;font-size:11.5px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
  .ovMissed{
    margin-top:10px;padding:9px 11px;border-radius:13px;text-align:left;background:#F7FAFF;border:1.5px solid #E1EAF6}

    display:block;font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.08em;color:#7C8BA1;
    text-transform:uppercase}

  .ovMissed i{
    display:block;margin-top:2px;font-style:normal;font-size:11.5px;font-weight:700;color:var(--ink2);line-height:1.3}

    flex:1;padding:9px 4px;border-radius:13px;text-align:center;border:0;background:#F4F7F6;

    display:block;margin-top:3px;font-size:17px;font-weight:800;letter-spacing:-.03em;color:var(--ink);
    font-variant-numeric:tabular-nums}
  .stars{display:flex;justify-content:center;gap:6px;margin-bottom:6px}

  .stars .st svg{width:38px;height:38px;display:block}
  .stars .st.off{opacity:.22;filter:grayscale(1) brightness(1.4)}
  .bolt.warn{width:50px;height:50px;margin:0 auto 4px}
  .bolt.warn svg{width:100%;height:100%}
  .new{
    margin:12px auto 0;width:max-content;padding:5px 13px;border-radius:999px;font-size:11px;font-weight:800;
    letter-spacing:.08em;color:#fff;background:linear-gradient(180deg,#FF9A5C,#FF3B30);box-shadow:0 2px 0 #C42218}
  .panel .btn{
    margin-top:12px;width:100%;height:58px;border-radius:18px;font-size:17px;-webkit-appearance:none;appearance:none;
    border:0;font-family:inherit;cursor:pointer;position:relative;display:flex;align-items:center;

  /* ════════ 9. 연출 파티클 ════════ */

  /* ════════ v47 · UI 다듬기 ════════
     홈: 카드와 시작 버튼을 한 덩어리로 / 배경을 화면 끝까지 / 상단 인사말
     여정: 잠긴 노드가 길 점선을 비치지 않게, 흐린 장식 제거, 판 테두리 제거
     게임: 조립 바 한 겹, 발사 버튼에 글자, 경고 띠 얇게
     도감: 긴 영어 문장 줄바꿈, 패턴 안 번호 1~10, 패턴 헤더 고정 */
  .avatarBox{

  .lobbyChip .ic, .lobbyChip .ic svg{width:18px;height:18px}

  .jNode.lock .jChest{filter:grayscale(1) brightness(1.5) opacity(.75)}

  /* ════════ v49 · 원본 스타일 고도화 ════════
     화이트·민트 바탕, 부드러운 그림자, 색 바닥 그림자의 3D 버튼은 그대로.
     외곽선은 1px 저채도 선만, 그림자는 두 겹(가까운 1px + 먼 블러)으로 정리. */
  .lvStrip{position:relative;width:100%;max-width:330px;display:flex;align-items:center;justify-content:space-between}
  .lvStrip .lvLine{
    position:absolute;left:20px;right:20px;top:50%;height:3px;margin-top:-1.5px;border-radius:2px;background:#D6E6DF}
  .lvDot{
    -webkit-appearance:none;appearance:none;position:relative;cursor:pointer;padding:0;width:40px;height:40px;
    border-radius:50%;display:grid;place-items:center;background:#FFFFFF;border:1px solid var(--hair);
    box-shadow:var(--sh1);color:#9AA7B4;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
  .lvDot svg{width:16px;height:16px;color:#FFFFFF}
  .lvDot.done{

    box-shadow:0 3px 0 #13B98E, 0 6px 12px rgba(20,200,154,.22)}

    background:linear-gradient(180deg,#3D9BFF,#0A72F0);
    box-shadow:0 4px 0 #0057C2, 0 0 0 5px rgba(0,122,255,.14), 0 10px 18px rgba(0,92,230,.22)}
  .lvDot.now.done{
    background:linear-gradient(180deg,#5CF3CB,#2EDDB0);box-shadow:0 4px 0 #13B98E, 0 0 0 5px rgba(20,200,154,.16)}
  .lvDot.lock{background:#F4F7F9;box-shadow:none;color:#B3BEC9}
  .lvDot:active{transform:translateY(2px)}
  .lobbyTiers{margin-top:12px}
  .lobbyTiers .tSeg, .jTiers .tSeg{
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;width:100%;padding:4px;border-radius:13px;
    background:#EEF2F5;box-shadow:inset 0 2px 4px rgba(20,40,60,.08)}
  .tierRow.jTiers{padding:0;margin:0;justify-content:stretch}
  .tSegBtn{
    min-width:0;height:38px;padding:0 6px;border:0;border-radius:10px;background:transparent;color:#7D8A96;
    font-size:13.5px;font-weight:800;gap:4px;box-shadow:none}
  .tSegBtn b{font-size:13.5px;font-weight:800}
  .tSegBtn .iLock, .tSegBtn .iLock svg{width:13px;height:13px;opacity:.9;margin:0}
  .tSegBtn.done{background:transparent;color:var(--mint3)}
  .tSegBtn.on, .tSegBtn.on.done{

    box-shadow:0 1px 2px rgba(16,40,32,.08), 0 3px 8px rgba(16,40,32,.08)}

  .tSegBtn.on.lock{background:#FFFFFF;color:#8D9BA8;border:0}

  .tab{color:#8B97A3;gap:2px;padding:4px 0 0}

    font-size:11px;font-weight:700;color:inherit;letter-spacing:-.02em}
  .tab.on{color:var(--mint3)}
  .tab.on:after{font-weight:800}
  .tabIco, .tab.home .tabIco{
    width:56px;height:30px;margin:0;border-radius:15px;background:none;border:0;box-shadow:none}
  .tab .tabIco svg, .tab.home .tabIco svg{width:23px;height:23px;filter:none;opacity:1;color:currentColor}
  .tab.home .tabIco:after{display:none}
  .tab.home{flex:1;width:auto}
  .tab.on .tabIco, .tab.home.on .tabIco, .tab:not(.home).on .tabIco{transform:none;box-shadow:none;background:#E3FAF3}
  .tab:not(.home):not(.on) .tabIco svg{opacity:1;filter:none}
  .tab:active .tabIco, .tab.home:active .tabIco{transform:scale(.94);box-shadow:none}
  .jCard.lock .jlv{background:#E9EEF3;color:#5B6875}
  .blk{

    box-shadow:var(--pl-white-sh);border-radius:14px}

  /* ════════ v50 · 탭 B안 · 자물쇠 1안 · 필로우 스타일 ════════
     필로우 = 딱딱한 바닥 받침 대신 위쪽 하이라이트 + 안쪽 아래 음영 + 바깥 부드러운 그림자로 '부푼' 느낌. */
  .tab .tabIco svg.tOn{display:none}
  .tab.on .tabIco svg.tOn{display:block}
  .tab.on .tabIco svg.tOff{display:none}
  .tab .tabIco svg, .tab.home .tabIco svg{width:26px;height:26px}

  .jCardBtn:active{transform:translateY(1px) scale(.985);box-shadow:0 5px 12px -6px rgba(20,190,148,.55)}

  .panel .btn.ghost:active{box-shadow:inset 0 2px 4px rgba(20,40,60,.10)}

    background:linear-gradient(180deg,#FFF6F3,#FFE9E3);border:0;color:#C4391B;
    box-shadow:inset 0 2px 1px #FFFFFF, inset 0 -3px 6px rgba(200,70,40,.08), 0 6px 14px -6px rgba(240,96,63,.30)}

  .icon3, .boardNav, .clearbtn{background:var(--pl-white);border:0;box-shadow:var(--pl-white-sh);color:#4B5563}
  .icon3:active, .clearbtn:active{transform:translateY(1px);box-shadow:inset 0 2px 4px rgba(20,40,60,.10)}

    border-radius:20px}

    box-shadow:inset 0 2px 1px rgba(255,255,255,.4), 0 5px 12px -6px rgba(240,96,63,.55)}

    background:linear-gradient(180deg,#FFF4EE,#FFE6DB);color:#F2A27A;border:0;
    box-shadow:inset 0 2px 1px #FFFFFF, inset 0 -3px 6px rgba(200,90,40,.06)}

    transform:translateY(1px) scale(.97);border-bottom-width:0;box-shadow:inset 0 2px 4px rgba(20,40,60,.10)}

    box-shadow:inset 0 2px 1px #FFFFFF, inset 0 -4px 8px rgba(0,80,200,.08), 0 8px 16px -6px rgba(0,110,240,.30), 0 1px 3px rgba(0,80,200,.10)}

    .lobbyStage{padding-bottom:12px;gap:12px}
    .btnStart3d{height:56px;font-size:18px}
    .lvDot{width:36px;height:36px}
    .lvDot.now{width:46px;height:46px}
    .lobbyTiers{margin-top:8px}
    .tSegBtn, .tSegBtn.on{height:34px}
  }

  /* ════════ v51 · 정리 후 조정 ════════ */
  /* 보조 글자는 600 — 제목(800)·레이블(700)과 무게로도 구분 */
  .boardSub, .bpMetric em, .pSub, .panel .lead, .jCard .jl span, .jTierNote, .brow .txt span, .built, .hint, .goalTxt, .stats em{font-weight:600}
  .boardSub:empty, .pSub:empty{display:none}
  /* 홈 카드 아래 줄 — 최고 기록만 */
  .bpStub{justify-content:flex-end}
  .bpMetrics{margin-left:0}
  /* 내려오는 문장 카드 — 점 장식 없이 가운데 정렬 */
  .row{padding:0 18px}
  .row.twoline{padding:6px 16px}
  /* 여정 — 깃발·보물상자 번호 배지 없이, 잠긴 라벨도 읽히게 */
  .jFlag, .jNo{display:none}
  .jNode.lock .jCap{background:#FFFFFF;color:#6B7684;box-shadow:0 1px 3px rgba(20,40,60,.12)}
  /* 탭바 — 손가락이 편한 높이로 올린다 */
  .tabbar{padding:8px 10px max(22px, calc(env(safe-area-inset-bottom,0px) + 12px))}
  .firebar{padding:10px 12px max(18px, calc(env(safe-area-inset-bottom,0px) + 8px))}
  .stars .st.off{opacity:1;filter:none}
  .new, .panel .best{background:var(--pl-coral);color:#FFFFFF;border:0;
    box-shadow:inset 0 1px 1px rgba(255,255,255,.45), 0 6px 14px -6px rgba(240,96,63,.6)}

  /* ════════ v52 · 여정 — 3D 숫자판 + 그 위에 둥둥 뜨는 캐릭터 ════════ */
  /* 숫자판: 위 하이라이트 + 아래 두께(같은 색 짙은 띠) + 바닥 그림자 -> 원판 */
  .jPod{width:60px;height:38px;bottom:14px;
    box-shadow:inset 0 2px 1px rgba(255,255,255,.55), inset 0 -3px 6px rgba(0,40,120,.20), 0 6px 0 #0A58C9, 0 13px 14px -3px rgba(0,80,200,.38)}
  .jNode.now .jPod{box-shadow:inset 0 2px 1px rgba(255,255,255,.55), inset 0 -3px 6px rgba(0,40,120,.20), 0 6px 0 #0A58C9, 0 13px 14px -3px rgba(0,80,200,.38), 0 0 0 7px rgba(0,122,255,.13)}
  .jNode.done .jPod{box-shadow:inset 0 2px 1px rgba(255,255,255,.6), inset 0 -3px 6px rgba(6,120,90,.20), 0 6px 0 #10A47D, 0 13px 14px -3px rgba(16,150,112,.32)}
  .jNode.lock .jPod{box-shadow:inset 0 2px 1px #FFFFFF, inset 0 -3px 6px rgba(20,40,60,.07), 0 5px 0 #BFC8D3, 0 11px 12px -3px rgba(20,40,60,.16)}
  .jPod.gold{box-shadow:inset 0 2px 1px rgba(255,255,255,.5), inset 0 -3px 6px rgba(170,50,20,.20), 0 6px 0 #D24E22, 0 13px 14px -3px rgba(240,96,63,.38)}
  .jNum{bottom:20px;font-size:17px}
  .jNode.lock .jLock{bottom:23px}
  /* 캐릭터: 숫자판 바로 위에서 위아래로 둥둥, 판 위 그림자는 뜰 때 작아진다 */
  .jMascot{left:50%;top:auto;bottom:46px;width:50px;height:50px;margin:0 0 0 -25px;z-index:6;animation:none;filter:none}
  .jMascot svg{width:100%;height:100%;animation:mFloat 2.2s ease-in-out infinite;
    filter:drop-shadow(0 6px 5px rgba(16,40,32,.16))}
  .jMascot:after{content:"";position:absolute;left:50%;bottom:-3px;width:30px;height:8px;margin-left:-15px;border-radius:50%;
    background:rgba(4,40,90,.28);animation:mShadow 2.2s ease-in-out infinite;z-index:-1}
  .jNode.kind-mix .jMascot, .jNode.kind-final .jMascot{bottom:56px}
  .jNode.kind-inf .jMascot{bottom:80px}
  @keyframes mFloat{0%,100%{transform:translateY(-11px)}50%{transform:translateY(-2px)}}
  @keyframes mShadow{0%,100%{transform:scale(.62);opacity:.45}50%{transform:scale(1);opacity:.9}}

  /* ════════ v53 · 떠 있는 필로우 탭바 ════════
     화면 끝에 붙은 직선 띠 대신, 둥근 모서리 + 필로우 그림자로 바닥에서 띄운다.
     바 뒤로 배경이 이어지고, 각 화면은 바 높이만큼 아래 여백을 둔다. */
  :root{--tabH:72px;--tabGap:max(28px, calc(env(safe-area-inset-bottom,0px) + 14px))}
  .tabbar{position:absolute;left:14px;right:14px;bottom:var(--tabGap);margin:0;
    padding:6px 8px 8px;border:0;border-radius:28px;
    background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    box-shadow:inset 0 2px 1px #FFFFFF, inset 0 -4px 10px rgba(20,40,60,.05), 0 14px 32px -10px rgba(16,40,32,.30), 0 2px 6px rgba(16,40,32,.08)}
  .tabIco, .tab.home .tabIco{height:32px;border-radius:16px}
  .view.lobby .lobbyStage{padding-bottom:calc(var(--tabH) + var(--tabGap) + 8px)}
  .jScroll{padding-bottom:calc(var(--tabH) + var(--tabGap) + 16px)}
  .jScroll.padcard{padding-bottom:calc(var(--tabH) + var(--tabGap) + 170px)}
  .jCard{bottom:calc(var(--tabH) + var(--tabGap) + 10px)}
  .fbody, .fbody.pad{padding-bottom:calc(var(--tabH) + var(--tabGap) + 24px)}

  /* ════════ v53 · 지도 풍경 — 챕터 테마 띠 + 장식 ════════ */
  .jDeco .deco{position:absolute;display:block;pointer-events:none}
  .jDeco .deco svg{width:100%;height:100%;display:block;overflow:visible}
  .jDeco .deco.tw{animation:twinkle 2.6s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
  .zoneTag{position:absolute;z-index:1;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px 0 6px;
    border-radius:999px;font-size:12px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;
    background:rgba(255,255,255,.82);color:#374151;box-shadow:0 4px 12px -4px rgba(16,40,32,.25)}
  .zoneTag b{display:inline-grid;place-items:center;height:20px;padding:0 7px;border-radius:999px;font-size:10.5px;font-weight:800;color:#FFFFFF}
  .zoneTag.z1 b{background:#14B5A8} .zoneTag.z2 b{background:#2F7BFF} .zoneTag.z3 b{background:#8A6CFF}
  .zoneTag.z4 b{background:#FF7A55} .zoneTag.z5 b{background:#14A86E} .zoneTag.z6 b{background:#6B7CFF}
  .zoneTag.z6{background:rgba(255,255,255,.14);color:#E6EBFF;box-shadow:none}
  /* 밤하늘 구역 — 잠긴 레벨 캡션·길 대비 */
  .jNode.zone6.lock .jNum{color:#C9D3F0}
  .jNode.kind-inf .jNum{display:none}
  .jNode.zone6 .jBase{opacity:.25}
  /* 지도 카드 — 완료 배지·레벨 칩 */
  .jCard .jdn{display:inline-flex;align-items:center;gap:3px}
  .jCard .jdn svg{width:10px;height:10px;display:block}
  .jCard .jlv{color:#04372A}
  .jCard.lock .jlv{background:#E9EEF3;color:#5B6875;box-shadow:none}

  /* ════════ v53 · 탭바 글래스모피즘 ════════ */
  .tabbar{background:rgba(255,255,255,.42);
    -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
    border:1px solid rgba(255,255,255,.7);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.85), 0 14px 34px -12px rgba(16,40,32,.35), 0 2px 8px rgba(16,40,32,.08)}
  .tab{color:#4B5563}
  .tab.on{color:#0B8A63}
  .tab.on .tabIco, .tab.home.on .tabIco, .tab:not(.home).on .tabIco{background:rgba(255,255,255,.75);
    box-shadow:inset 0 1px 0 #FFFFFF, 0 4px 10px -4px rgba(16,40,32,.25)}

  /* ════════ v54 · 글래스모피즘 — 화려한 배경 위에 떠 있는 요소에만 ════════
     읽어야 하는 본문(홈 카드·내려오는 문장·팝업)은 불투명하게 둔다. */
  :root{
    --gl-bg:rgba(255,255,255,.46);
    --gl-bd:1px solid rgba(255,255,255,.72);
    --gl-blur:blur(18px) saturate(180%);
    --gl-sh:inset 0 1px 0 rgba(255,255,255,.85), 0 10px 26px -12px rgba(16,40,32,.30), 0 1px 3px rgba(16,40,32,.06);
    --headH:58px;
  }
  /* 지도·문장 화면 제목줄 — 내용 위에 떠서 아래가 비쳐 보이게 */
  .view.journey, .view.book{position:relative}
  .jHead, .view.book .fhead{position:absolute;left:0;right:0;top:0;z-index:20;height:var(--headH);
    background:rgba(255,255,255,.55);-webkit-backdrop-filter:var(--gl-blur);backdrop-filter:var(--gl-blur);
    border-bottom:1px solid rgba(255,255,255,.6);box-shadow:0 6px 20px -12px rgba(16,40,32,.25)}
  .jScroll{padding-top:var(--headH)}
  .view.book .fbody{padding-top:var(--headH)}
  .pgroup h3{top:0;background:rgba(247,248,250,.62);
    -webkit-backdrop-filter:var(--gl-blur);backdrop-filter:var(--gl-blur)}
  .jCount, .fhead .cnt{background:rgba(255,255,255,.6);border:var(--gl-bd)}
  /* 지도 위 카드·챕터 이름표 */
  .jCard{background:rgba(255,255,255,.72);-webkit-backdrop-filter:var(--gl-blur);backdrop-filter:var(--gl-blur);
    border:var(--gl-bd);box-shadow:var(--gl-sh), 0 18px 40px -14px rgba(16,40,32,.30)}
  .jCard.lock{background:rgba(248,250,252,.74)}
  .zoneTag{background:var(--gl-bg);-webkit-backdrop-filter:var(--gl-blur);backdrop-filter:var(--gl-blur);
    border:var(--gl-bd);box-shadow:var(--gl-sh)}
  .zoneTag.z6{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#EEF1FF}
  /* 홈 상단 칩 · 좌우 화살표 */
  .lobbyChip, .avatarBox, .boardNav{background:var(--gl-bg);-webkit-backdrop-filter:var(--gl-blur);backdrop-filter:var(--gl-blur);
    border:var(--gl-bd);box-shadow:var(--gl-sh)}
  /* 알림 토스트 — 어두운 유리 */
  .toast{background:rgba(17,24,39,.62);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);
    border:1px solid rgba(255,255,255,.14)}
  /* 팝업 뒤 배경 — 흐림을 조금 더 */
  .sheet{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  /* 지도 카드 — 옛 메타 문구 규칙(.jCard .jl span)이 칩까지 덮지 않게 */
  .jCard .jl .jlv{display:inline-block;color:#04372A;font-size:11.5px;font-weight:800;margin-top:0}
  .jCard.lock .jl .jlv{background:#E9EEF3;color:#5B6875}
  .jCard .jl .jdn{display:inline-flex;align-items:center;gap:3px;margin-top:0;color:#0D9F71;font-size:10px;font-weight:800}
  .jCard .jl .jdn.hide{display:none}

  /* ════════ v55 · 홈 카드 — 시작 버튼과 같은 폭 ════════
     좌우 화살표 자리를 비우느라 좁아졌던 카드를 넓힌다. 이동은 레벨 띠 탭 · 카드 좌우 밀기로. */
  .boardNav{display:none}
  .boardWrap{width:100%}
  .lobbyStage .lobbyAction{padding:0}
  .board{padding:20px 22px 16px}
  .boardTitle{font-size:29px;margin-top:14px}
  .boardKo{font-size:15.5px;margin-top:6px}
  .lobbyTiers{margin-top:16px}
  .tSegBtn, .tSegBtn.on, .tSegBtn.on.done{height:42px}
  .bpProg{margin-top:14px}
  .lvStrip{max-width:none;padding:0 4px}
  /* 카드를 밀어 넘길 때 살짝 따라가는 손맛 */
  .board.swL{animation:cardSwL .26s cubic-bezier(.2,.9,.3,1)}
  .board.swR{animation:cardSwR .26s cubic-bezier(.2,.9,.3,1)}
  @keyframes cardSwL{0%{transform:translateX(28px);opacity:.4}100%{transform:none;opacity:1}}
  @keyframes cardSwR{0%{transform:translateX(-28px);opacity:.4}100%{transform:none;opacity:1}}
  @media (max-height:720px){
    .board{padding:16px 18px 12px}
    .boardTitle{font-size:24px;margin-top:10px}
    .lobbyTiers{margin-top:10px}
    .tSegBtn, .tSegBtn.on, .tSegBtn.on.done{height:36px}
  }

  /* ════════ v56 · 홈 카드 다시 잡기 ════════
     탑승권 흔적(반원 홈·점선) 제거. 레벨·별 -> 패턴 -> 예문 말풍선(듣기) -> 난이도 -> 진행 -> 기록 한 줄 */
  .board{-webkit-mask-image:none;mask-image:none;padding:20px 20px 18px;border-radius:28px}
  .boardWrap:before{border-radius:28px}
  .boardTop{display:flex;align-items:center;justify-content:space-between;margin:0}
  .bpStars{display:flex;gap:2px}
  .bpStars .bpStar{width:22px;height:22px;pointer-events:none}
  .bpStars .bpStar svg{width:20px;height:20px}
  .boardTitle{margin-top:14px;font-size:30px;line-height:1.12;letter-spacing:-.04em}
  .boardKo{margin-top:6px;font-size:15px;font-weight:700}
  .egBubble{-webkit-appearance:none;appearance:none;border:0;font-family:inherit;cursor:pointer;text-align:left;
    display:flex;align-items:center;gap:10px;width:100%;margin-top:16px;padding:10px 10px 10px 8px;border-radius:18px;
    background:linear-gradient(180deg,#F2FCF8,#E7F8F1);box-shadow:inset 0 1px 0 #FFFFFF, inset 0 -2px 6px rgba(13,159,113,.06)}
  .egBubble:active{transform:scale(.985)}
  .egAva{flex:0 0 auto;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;
    background:#FFFFFF;box-shadow:0 4px 10px -4px rgba(16,40,32,.25)}
  .egAva svg{width:32px;height:32px}
  .egTxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .egTxt b{font-size:14.5px;font-weight:700;color:var(--ink);letter-spacing:-.01em;line-height:1.3;word-break:keep-all}
  .egTxt i{font-style:normal;font-size:12px;font-weight:600;color:#6B7684;line-height:1.3}
  .egPlay{flex:0 0 auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#04372A;
    background:var(--pl-mint);box-shadow:inset 0 1px 1px rgba(255,255,255,.6), 0 6px 12px -6px rgba(20,190,148,.7)}
  .egPlay svg{width:18px;height:18px}
  .lobbyTiers{margin-top:14px}
  .tSegBtn, .tSegBtn.on, .tSegBtn.on.done{height:40px}
  .boardSub{margin-top:8px;font-size:12px;color:#8A6135}
  .bpProg{margin-top:14px;gap:10px}
  .boardBar{height:10px}
  .boardRec{margin-top:10px;font-size:12px;font-weight:600;color:#6B7684}
  .boardRec b{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
  .boardRec.hide{display:none}
  @media (max-height:720px){
    .board{padding:16px 16px 14px}
    .boardTitle{font-size:25px;margin-top:10px}
    .egBubble{margin-top:10px;padding:8px}
    .egAva{width:34px;height:34px} .egAva svg{width:26px;height:26px}
    .egTxt i{display:none}
    .lobbyTiers{margin-top:10px}
    .tSegBtn, .tSegBtn.on, .tSegBtn.on.done{height:36px}
    .bpProg{margin-top:10px}
  }
  .lvChip.lock{background:#E9EEF3;color:#6B7684;box-shadow:none}
</style>
</head>

<body>
<div class="app" id="app">

  <!-- ══════════ 홈 로비 ══════════ -->
  <section class="view lobby" id="viewLobby">
    <div class="lobbyBg" id="lobbyBg" aria-hidden="true"><svg viewBox="0 0 390 780" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="lbSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#EEFBF6"/><stop offset="1" stop-color="#DDF6EC"/></linearGradient>
        <linearGradient id="lbH1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C6F3E2"/><stop offset="1" stop-color="#B2EDD7"/></linearGradient>
        <linearGradient id="lbH2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93E6C8"/><stop offset="1" stop-color="#7EDDBB"/></linearGradient>
        <linearGradient id="lbH3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ED5B2"/><stop offset="1" stop-color="#5CCBA6"/></linearGradient>
      </defs>
      <rect width="390" height="780" fill="url(#lbSky)"/>
      <circle cx="330" cy="140" r="30" fill="#FFF4D1" opacity=".7"/>
      <circle cx="330" cy="140" r="20" fill="#FFE59A"/>
      <g fill="#FFFFFF">
        <path d="M40 214 a22 22 0 0 1 40 -10 a17 17 0 0 1 30 12 h-70z"/>
        <path d="M232 120 a18 18 0 0 1 33 -8 a14 14 0 0 1 25 10 h-58z"/>
      </g>
      <path d="M0 470 C70 430 140 432 200 456 C262 480 320 440 390 452 V780 H0 Z" fill="url(#lbH1)"/>
      <path d="M0 540 C80 500 160 512 226 536 C292 560 340 528 390 534 V780 H0 Z" fill="url(#lbH2)"/>
      <path d="M0 650 C90 626 300 626 390 650 V780 H0 Z" fill="url(#lbH3)"/>
      <path d="M0 650 C90 626 300 626 390 650 V656 C300 634 90 634 0 658 Z" fill="#FFFFFF" opacity=".35"/>
      <g fill="#FFFFFF" opacity=".55"><ellipse cx="96" cy="700" rx="26" ry="4"/><ellipse cx="290" cy="716" rx="34" ry="5"/></g>
    </svg></div>
    <div class="lobbyTop">
      <button class="avatarBox" id="btnProfileSet" aria-label="설정"><div class="in" id="lobbyAvatar"></div><span class="gearTag" id="avatarGear"></span></button>
      <div class="lobbyHello"><b>피클 영어</b><span id="lobbyRank">출국 준비</span></div>
      <div class="spacer"></div>
      <div class="lobbyChips">
        <div class="lobbyChip"><span class="ic" id="chipIcoBook"></span><b id="chipBook">0/300</b></div>
        <div class="lobbyChip"><span class="ic" id="chipIcoCrown"></span><b id="chipSurv">0</b></div>
      </div>
    </div>

    <div class="lobbyStage">
      <div class="lvStrip" id="lvStrip" aria-label="레벨 진행"></div>
      <div class="boardRow">
      <button class="boardNav prev" id="btnStagePrev" aria-label="이전 레벨"></button>
      <button class="boardNav next" id="btnStageNext" aria-label="다음 레벨"></button>
      <div class="boardWrap">
        <div class="boardMascot" id="boardMascot"></div>
        <div class="board" id="boardCard">
          <div class="boardTop">
            <span class="lvChip" id="lobbyLv">Lv.1</span>
            <span class="bpStars" id="lobbyStars" aria-label="깬 난이도"></span>
          </div>
          <h1 class="boardTitle" id="lobbyTitle">I'm trying to ~</h1>
          <p class="boardKo" id="lobbyKo"></p>
          <button class="egBubble" id="lobbyEg" aria-label="예문 듣기">
            <span class="egAva" id="lobbyEgAva" aria-hidden="true"></span>
            <span class="egTxt"><b id="lobbyEgEn"></b><i id="lobbyEgKo"></i></span>
            <span class="egPlay" id="lobbyEgPlay" aria-hidden="true"></span>
          </button>
          <div class="lobbyTiers" id="lobbyTiers" role="group" aria-label="난이도"></div>
          <p class="boardSub" id="lobbySub"></p>
          <div class="bpProg">
            <span class="boardBar"><i id="lobbyBar"></i></span>
            <b id="lobbyProgTxt">0 / 10문장</b>
          </div>
          <p class="boardRec" id="lobbyRec">최고 <b id="lobbyStageBest">-</b>점 · 콤보 <b id="lobbyStageCombo">-</b></p>
        </div>
      </div>
      </div>

/* 원어민 필수 회화 패턴 30 — widgets/english-patterns-30 과 같은 번호·문구·의미를 쓴다.
   도감·스테이지 목록·앞머리 함정·패턴 해금 계산이 모두 이 번호를 기준으로 돈다. */
var PATTERNS = ["",

/* 스테이지 37개 — 패턴 1~30을 하나씩 도는 개별 레벨 + 5패턴마다 MIX + FINAL MIX + 무한 서바이벌.
   Lv.1~5 = 패턴 1~5 -> Lv.6 MIX 1(패턴 1~5) -> Lv.7~11 = 패턴 6~10 -> Lv.12 MIX 2(1~10) -> …
   Lv.31~35 = 패턴 26~30 -> Lv.36 FINAL MIX(1~30) -> Lv.37 무한 서바이벌. 전 스테이지 자유 플레이. */
var GOAL_PAT = 10, GOAL_MIX = 15, GOAL_FINAL = 20;   /* 스테이지 종류별 목표 문장 수 */
var MIX_EVERY = 5;                                   /* 몇 패턴마다 MIX 스테이지를 끼우는지 */
var PAT_STAGES = 35;                                 /* 패턴·MIX 스테이지 = Lv.1~35 */
var STAGES = (function(){
  var list = [], n, block, pos, p, mix, total = PATTERNS.length - 1;
  for(n=1;n<=PAT_STAGES;n++){
    block = Math.floor((n-1)/6); pos = (n-1)%6;
    if(pos === 5){
      mix = block + 1;
      list.push({ n:n, kind:"mix", mix:mix, p:0, from:1, to:MIX_EVERY*mix,
                  goal:Math.min(GOAL_MIX, 10*MIX_EVERY*mix) });
    } else {
      p = block*MIX_EVERY + pos + 1;
      /* 패턴마다 10문장 — Lv.1도 패턴 1의 10문장을 전부 푼다 */
      list.push({ n:n, kind:"pat", mix:0, p:p, from:p, to:p, goal:Math.min(GOAL_PAT, 10*p) });
    }
  }
  list.push({ n:PAT_STAGES+1, kind:"final", mix:0, p:0, from:1, to:total, goal:Math.min(GOAL_FINAL, 10*total) });
  list.push({ n:PAT_STAGES+2, kind:"inf",   mix:0, p:0, from:1, to:total, goal:0 });
  return list;
})();
var STAGES_TOTAL = STAGES.length;    /* 37 */
var LAST_LEVEL = STAGES_TOTAL - 1;   /* 36 — 마지막으로 클리어하는 스테이지, 37은 무한 서바이벌 */
var GOAL = GOAL_PAT;                 /* 기본 목표 — 실제 목표는 stageMeta(n).goal */

/* 스테이지 한 칸의 정보 — 종류(pat/mix/final/inf)·패턴 범위·목표 문장 수 */
function stageMeta(n){
  return STAGES[Math.max(1, Math.min(STAGES_TOTAL, n || 1)) - 1];
}
function isInfStage(n){ return stageMeta(n).kind === "inf"; }
function isBoss(n){ return isInfStage(n); }

/* ── 순차 해금 ──
   기본은 Lv.1만 열려 있고, 해금된 최대 단계를 깨면 그 다음 단계가 열린다.
   이미 클리어 기록(stageDone)이 있으면 '가장 높이 깬 단계 + 1'까지 자동으로 열린다. */
function unlockedMax(){
  var n = 1, k, v;
  for(k in store.stageDone){
    if(!store.stageDone.hasOwnProperty(k) || !store.stageDone[k]) continue;
    v = +k;
    if(isNaN(v)) continue;
    if(v + 1 > n) n = v + 1;
  }
  return Math.min(STAGES_TOTAL, Math.max(1, n));
}
function stageLocked(n){ return (n || 1) > unlockedMax(); }
function needStageOf(n){ return Math.max(1, (n || 1) - 1); }

/* ── 레벨별 3단계(티어) ──
   패턴 스테이지는 같은 패턴을 난이도만 올려 세 번 도전한다.
     Lv.N-1  그 패턴 집중 · 10문장
     Lv.N-2  Lv.N+4까지 깬 패턴을 섞어 12문장 (Lv.N-1 + Lv.N+4 클리어 시 해금)
     Lv.N-3  Lv.N+9까지 깬 패턴을 섞어 15문장 (Lv.N-2 + Lv.N+9 클리어 시 해금) */
var TIER_GOAL = [0, 10, 12, 15];
function needStage2(n){ return Math.min(LAST_LEVEL, (n || 1) + 4); }
function needStage3(n){ return Math.min(LAST_LEVEL, (n || 1) + 9); }
function tierNeed(n, t){ return (t <= 2) ? needStage2(n) : needStage3(n); }
function tierKey(n, t){ return (t > 1) ? (n + "-" + t) : String(n); }
function tierDone(n, t){ return !!store.stageDone[tierKey(n, t)]; }
function tierLocked(n, t){
  t = Math.max(1, Math.min(3, t || 1));
  if(stageLocked(n)) return true;
  if(t === 1) return false;
  if(tierDone(n, t)) return false;          /* 이미 깬 단계는 언제든 다시 할 수 있다 */
  if(!tierDone(n, t - 1)) return true;
  return !store.stageDone[String(tierNeed(n, t))];
}
var TIER_NAMES = ["", "Easy", "Normal", "Hard"];
/* 레벨 표기 — 패턴이면 Lv.N Easy, MIX/FINAL이면 Lv.N */
function lvStageLabel(n){
  var m = stageMeta(n);
  return "Lv." + n;
}
/* 잠긴 이유 — 시작 버튼에 들어갈 짧은 말 */
function tierNeedShort(n, t){
  t = Math.max(1, Math.min(3, t || 1));
  if(stageLocked(n)) return lvStageLabel(needStageOf(n)) + " 완료 후 열려요";
  if(!tierDone(n, t - 1)) return TIER_NAMES[t - 1] + " 완료 후 열려요";
  return lvStageLabel(tierNeed(n, t)) + " 완료 후 열려요";
}
/* 잠긴 이유 — 보드 아래 한 줄 */
function tierNeedDesc(n, t){
  t = Math.max(1, Math.min(3, t || 1));
  if(stageLocked(n)) return lvStageLabel(needStageOf(n)) + " 완료 후 열려요";
  if(!tierDone(n, t - 1)) return TIER_NAMES[t - 1] + " · " + lvStageLabel(tierNeed(n, t)) + " 완료 후 열려요";
  return lvStageLabel(tierNeed(n, t)) + " 완료 후 열려요";
}
/* 깬 단계 수 = 별 개수 */
function tierCount(n){ var c = 0, i; for(i=1;i<=3;i++) if(tierDone(n, i)) c++; return c; }
var MAX_STARS = 90;              /* 패턴 30개 x 3단계 — 한 단계 깰 때마다 별 1개 */
function totalStars(){
  var i, s = 0;
  for(i=0;i<STAGES.length;i++){
    if(STAGES[i].kind !== "pat") continue;
    s += tierCount(STAGES[i].n);
  }
  return s;
}
function tierGoal(n, t){
  var m = stageMeta(n);
  if(m.kind !== "pat") return m.goal;
  return TIER_GOAL[Math.max(1, Math.min(3, t || 1))];
}
/* 이 패턴에서 지금 열려 있는 가장 높은 단계 */
function tierOpen(n){ var t = 0, i; for(i=1;i<=3;i++) if(!tierLocked(n, i)) t = i; return t || 1; }
/* 홈 카드가 처음 골라 줄 단계 — 아직 안 깬, 가장 높은 열린 단계 */
function defaultTier(n){
  var t;
  if(stageMeta(n).kind !== "pat") return 1;
  for(t=1;t<=3;t++) if(!tierDone(n, t) && !tierLocked(n, t)) return t;
  for(t=3;t>=1;t--) if(!tierLocked(n, t)) return t;
  return 1;
}
/* 2·3단계가 섞어 내는 마지막 패턴 */
function tierMixTo(n, t){ return stageMeta(tierNeed(n, t)).to; }
function tierHint(n, t){
  var m = stageMeta(n);
  if(m.kind !== "pat") return stageHint(n);
  t = Math.max(1, Math.min(3, t || 1));
  if(t === 1) return TIER_GOAL[1] + "문장";
  return "복습 포함 · " + TIER_GOAL[t] + "문장";
}
/* 클리어한 뒤 이어서 할 단계 — 같은 레벨의 다음 단계가 열렸으면 그것부터 */
function nextStageTier(n, t){
  var t2;
  if(stageMeta(n).kind === "pat")
    for(t2 = (t || 1) + 1; t2 <= 3; t2++) if(!tierLocked(n, t2)) return { n:n, t:t2 };
  var n2 = Math.min(STAGES_TOTAL, (n || 1) + 1);
  return { n:n2, t:defaultTier(n2) };
}

/* 원문 데이터 — ko 한국어 / en 영어 / chunks 조립 조각 / p 패턴번호 / lv 난이도 티어 */
var DATA = [];
(function(){
  for(var i=0;i<RAW.length;i++){
    var r = RAW[i];
    DATA.push({ id:(r[5] || (i+1)), idx:i, ko:r[0], en:r[1], chunks:r[2].split("|"), p:r[3], lv:r[4] });
  }
})();

/* 단계별 30문장 목록 · 전체 문장 목록 */
var LEVEL_IDS = {}, ALL_IDS = [];
(function(){
  var i, lv;
  for(i=0;i<DATA.length;i++) ALL_IDS.push(i);
  for(lv=1;lv<=LAST_LEVEL;lv++) LEVEL_IDS[lv] = [];
  for(i=0;i<DATA.length;i++) if(LEVEL_IDS[DATA[i].lv]) LEVEL_IDS[DATA[i].lv].push(i);
})();
/* 그 단계에 나오는 패턴 종류 수 — 새 구조에서는 어느 단계든 30 */
function countPatterns(n){
  var m = stageMeta(n);
  return m.kind === "inf" ? PATTERNS.length - 1 : (m.to - m.from + 1);
}
/* 함정으로 쓸 수 있는 패턴: 그 단계까지 배운 문장의 패턴(무한전은 전체) */
function patternsOf(stage){
  var set = {}, m = stageMeta(stage || 1), i, to = m.to;
  if(m.kind === "inf"){ for(i=1;i<PATTERNS.length;i++) set[i] = 1; return set; }
  if(m.kind === "pat" && (S.tier || 1) > 1) to = Math.max(to, tierMixTo(m.n, S.tier));
  for(i=1;i<=to;i++) set[i] = 1;
  return set;
}

/* 같은 패턴의 다른 청크 -> 진짜 헷갈리는 함정 */
var BANK = {};
(function(){
  for(var i=0;i<DATA.length;i++){
    var d = DATA[i];
    if(!BANK[d.p]) BANK[d.p] = [];
    for(var j=0;j<d.chunks.length;j++) BANK[d.p].push(d.chunks[j]);

var CONF_VERB = { finish:1, book:1, check:1, stay:1, order:1, ask:1, help:1, mind:1, do:1,

  rent:1, reserve:1, confirm:1, transfer:1, charge:1, clean:1, cook:1, taste:1,

function splitChunkWords(c){
  var w = String(c).split(" "), out = [], i, n = w.length;
  if(n <= 2) return [c];
  var head = bareWord(w[0]);
  var pair = bareWord(w[0]) + " " + bareWord(w[1]);
  if(CONF_VERB[head] && !KEEP_PAIR[pair]){
    out.push(w[0]);
    w = w.slice(1);
    n = w.length;

  if(!n) return out;
  var cur = [w[0]];
  for(i=1;i<n;i++){
    if(CHUNK_PREP[bareWord(w[i])] && cur.length >= 1 && (n - i) >= 1){
      out.push(cur.join(" "));
      cur = [w[i]];
    } else {
      cur.push(w[i]);
    }
  }
  if(cur.length) out.push(cur.join(" "));
  return out;

function packChunks(list, cap){
  cap = cap || 5;
  while(list.length > cap){
    var bi = -1, bl = 1e9, i, a, b;
    for(i=0;i<list.length-1;i++){
      a = list[i]; b = list[i+1];
      if(a.indexOf(" ") < 0 && CONF[bareWord(a)]) continue;      if(a.length + b.length < bl){ bl = a.length + b.length; bi = i; }
    }
    if(bi < 0) bi = 0;
    list.splice(bi, 2, list[bi] + " " + list[bi+1]);
  }
  return list;
}

/* 판정용 정규화 — 소문자, 아포스트로피/따옴표 통일, 문장부호 제거, 공백 정리 */
function norm(t){
  return String(t == null ? "" : t)
    .replace(/[\u2018\u2019\u02bc]/g, "'")
    .replace(/[\u201c\u201d]/g, '"')
    .toLowerCase()
    .replace(/[.,?!;:"']/g, "")
    .replace(/\s+/g, " ")
    .replace(/^ | $/g, "");
}
/* 정답 판정은 청크 개수·배열이 아니라 '담은 청크를 이어 붙인 문장'과 정답 문장의 문자열 비교.
   청크를 어떻게 끊어 담았든 완성된 문장이 같으면 정답이다. */
function sameSentence(made, en){
  return norm(made.join(" ")) === norm(en);
}
function makeRng(seed){
  var s = (seed>>>0) || 1;
  return function(){ s = (s*1664525 + 1013904223)>>>0; return s/4294967296; };
}
function shuffled(arr,rng){
  var a = arr.slice(), r = rng || Math.random;
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(r()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

/* 문장 하나의 단어 풀: 정답 청크 100% 먼저 -> 남는 칸만 함정
   want = 함정 개수(정답 청크 수와 무관) */
function buildPool(d, trapN, stage){
  var want = trapN || 10;
  var lv = stage || d.lv || 1;
  var pset = patternsOf(lv);
  var rng = makeRng(d.id*7919 + 101);
  var seen = {}, i, j;
  /* 0) 정답 청크는 무조건 먼저 전부 확보 — 어떤 함정도 정답을 밀어내지 못한다 */
  for(i=0;i<d.chunks.length;i++) seen[norm(d.chunks[i])] = 1;

  /* ① 앞머리 청크 함정 2~4개 (해금된 패턴들) */
  var openN = 2 + (lv >= 3 ? 1 : 0) + (lv >= 5 ? 1 : 0);
  var opSet = {}, opCnt = 0;
  for(i=1;i<OPENER.length;i++) if(pset[i]) opSet[OPENER[i]] = 1;
  /* 헷갈림 그룹 앞머리도 '앞머리 함정'으로 센다 — 단어판 앞머리 칩이 단계별 2~4개를 넘지 않게 */
  for(i=0;i<CONF_PAT.length;i++){
    var gop = CONF_PAT[i].openers;
    for(j=0;j<gop.length;j++) opSet[gop[j]] = 1;
  }
  for(i=0;i<OPENER.length;i++) if(SIBLING[i]) opSet[SIBLING[i]] = 1;

  var traps = [];
  function push(c){
    if(!c) return;
    var k = norm(c);
    if(!k || seen[k]) return;
    var isOp = !!opSet[c];
    if(isOp && opCnt >= openN) return;          /* 앞머리 함정은 openN개까지 */
    seen[k] = 1;
    traps.push(c);
    if(isOp) opCnt++;
  }
  var ops = [];
  for(i=1;i<OPENER.length;i++) if(pset[i]) ops.push(OPENER[i]);
  /* 이 문장 패턴의 앞머리는 반드시 함정으로 넣는다 — 'I'm here' vs 'I'm here to' 같은 진짜 함정 */
  if(pset[d.p] && OPENER[d.p]) push(OPENER[d.p]);
  /* There is 문장에는 There are, There are 문장에는 There is 를 먼저 깐다 */
  if(SIBLING[d.p]){
    var sb = SIBLING[d.p];
    if(typeof sb === "string") push(sb);
    else for(var sbi=0;sbi<sb.length;sbi++) push(sb[sbi]);
  }
  /* ①-b 조이 님이 헷갈렸던 그룹의 앞머리를 먼저 채운다 — 이 문장의 앞머리와 비슷하게 생긴
     것들('I'm here to' vs 'I'm here' / 'Do you mind' vs 'Do you mind if I' …)이 2~4개 깔린다.
     비슷한 순서로 넣는다: 앞부분이 겹치거나('I'm here to' -> 'I'm here'), 쓰인 단어가 겹치는 것부터. */
  var grp = confGroup(d.p);
  if(grp){
    var own = norm(d.chunks[0] || ""), gs = shuffled(grp, makeRng(d.id*313 + 11));
    var score = function(t){
      var n = norm(t), ow = own.split(" "), tw = n.split(" "), sc = 0, a, b2;
      if(n.indexOf(own) === 0 || own.indexOf(n) === 0) sc += 1000;
      for(a=0;a<ow.length;a++) for(b2=0;b2<tw.length;b2++) if(ow[a] === tw[b2]) sc += 10;
      return sc;
    };
    gs.sort(function(x, y){ return score(y) - score(x); });
    for(i=0;i<gs.length && opCnt<openN;i++) push(gs[i]);
  }
  ops = shuffled(ops, rng);
  for(i=0;i<ops.length && opCnt<openN;i++) push(ops[i]);

  /* ② 단어 혼동형 — 두 번째 청크부터 */
  var conf = [];
  for(i=1;i<d.chunks.length;i++){
    var words = d.chunks[i].split(" ");
    var alts = CONF[words[0].toLowerCase()];
    if(alts && alts.length){
      for(j=0;j<alts.length;j++) conf.push(alts[j]);
    }
  }
  conf = shuffled(conf, rng);
  var confCap = traps.length + 2;
  for(i=0;i<conf.length && traps.length<confCap;i++) push(conf[i]);

  /* ③ 같은 패턴의 다른 청크 */
  var same = shuffled(BANK[d.p] || [], rng);
  for(i=0;i<same.length && traps.length<want;i++) push(same[i]);

  /* ④ 해금 패턴의 청크(앞머리 고르기) */
  if(traps.length < want){
    var wide = [];
    for(i=1;i<PATTERNS.length;i++) if(pset[i] && BANK[i]) wide = wide.concat(BANK[i]);
    wide = shuffled(wide, rng);
    for(i=0;i<wide.length && traps.length<want;i++) push(wide[i]);
  }

  /* ⑤ 이웃 패턴 */
  if(traps.length < want){
    var near = [], np = [d.p-1, d.p+1, d.p+2];
    for(i=0;i<np.length;i++) if(pset[np[i]] && BANK[np[i]]) near = near.concat(BANK[np[i]]);
    near = shuffled(near, rng);
    for(i=0;i<near.length && traps.length<want;i++) push(near[i]);
  }

  all.sort(function(a, b){

var AC = null;
function isSpeaking(){
  /* iOS 의 speechSynthesis.speaking 값은 실제와 어긋날 때가 있다 — 앱이 직접 기록한 재생 상태가 우선 */
  if(typeof voiceBusy === "function" && voiceBusy()) return true;
  try{ var sy = window.speechSynthesis; return !!(sy && (sy.speaking || sy.pending)); }catch(e){ return false; }
}
function ctx(){
  if(AC){
    if(AC.state === "suspended" && !isSpeaking()){ try{ AC.resume(); }catch(e){} }
    return AC;
  }
  var C = window.AudioContext || window.webkitAudioContext;
  if(!C) return null;
  try{ AC = new C(); }catch(e){ AC = null; }
  return AC;
}
/* iOS: 첫 터치 안에서 무음 버퍼를 재생해 오디오 세션을 연다 */
function unlockAudio(){
  var a = ctx(); if(!a) return null;
  try{ if(a.state !== "running" && a.resume) a.resume(); }catch(e){}
  /* iOS Safari: 제스처 안에서 1샘플 무음 버퍼를 한 번 재생해야 오디오 세션이 열린다 */
  try{
    var b = a.createBuffer(1, 1, a.sampleRate || 44100);
    var s = a.createBufferSource();
    s.buffer = b; s.connect(a.destination);
    if(s.start) s.start(0);
  }catch(e){}
  return a;
}
/* 터치·복귀마다 오디오가 잠겼으면 다시 깨운다 — 쉬었다 와도 iOS 소리가 살아난다 */
(function(){
  if(typeof document === "undefined" || !document.addEventListener) return;
  var wasHidden = false;
  function resetAudio(){
    try{ bgmStop(); }catch(e){}
    if(AC){
      try{ if(AC.close) AC.close(); }catch(e){}
      AC = null;
    }
    BGM.master = null;
  }
  function wake(){
    /* iOS: 원어민 음성이 나오는 동안 오디오를 깨우려 하면 오디오 세션을 다시 잡느라
       탭 처리가 밀린다 — 말하는 중이면 건드리지 않고, 끝나면 sayDone 이 되살린다 */
    if(isSpeaking()) return;
    /* 이미 소리가 나고 있으면 할 일이 없다(탭마다 무음 버퍼를 만들지 않는다) */
    if(!wasHidden && AC && AC.state === "running"){
      if(store.sound && S.mode === "play" && !BGM.on){ try{ bgmStart(); }catch(e){} }
      return;
    }
    /* 'interrupted'(iOS 음성·전화가 오디오를 잠깐 가져간 상태)는 다시 만들지 않고 resume 만 —
       매번 새로 만들면 BGM 이 처음부터 다시 쌓이며 끊긴다 */
    if(wasHidden || (AC && AC.state === "closed")){
      wasHidden = false;
      resetAudio();
    }
    var a = unlockAudio();
    if(a && a.resume && a.state !== "running"){
      try{
        var p = a.resume();
        if(p && p.then) p.then(function(){
          if(store.sound && S.mode === "play" && !BGM.on){ try{ bgmStart(); }catch(e){} }
          if(BGM.on && BGM.master && AC){
            try{ BGM.master.gain.value = BGM.duck; BGM.next = AC.currentTime + 0.05; }catch(e){}
          }
        });
      }catch(e){}
    }
    if(store.sound && S.mode === "play" && !BGM.on){ try{ bgmStart(); }catch(e){} }
  }
  var evs = ["pointerdown","touchstart","click","keydown"], i;
  for(i=0;i<evs.length;i++) document.addEventListener(evs[i], wake, true);
  document.addEventListener("visibilitychange", function(){
    if(document.hidden){
      wasHidden = true;
      try{ bgmStop(); }catch(e){}
    }
  });
  if(typeof window !== "undefined" && window.addEventListener){
    window.addEventListener("pagehide", function(){ wasHidden = true; try{ bgmStop(); }catch(e){} });
  }
})();
function beep(f, dur, type, vol, to){
  if(!store.sound) return;
  var a = ctx(); if(!a) return;
  try{
    var o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime;
    o.type = type || "sine";

    if(to) o.frequency.exponentialRampToValueAtTime(Math.max(40, to), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.09, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(a.destination);

}
function noise(dur, vol){
  if(!store.sound) return;

    var n = Math.max(1, Math.floor(a.sampleRate * dur)), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for(var i=0;i<n;i++) d[i] = (Math.random()*2 - 1) * (1 - i/n);
    var src = a.createBufferSource(); src.buffer = buf;
    var g = a.createGain(); g.gain.value = vol || 0.05;
    var f = a.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 900;
    src.connect(f); f.connect(g); g.connect(a.destination);
    src.start(0);
  }catch(e){}
}

/* ── BGM: Web Audio 신스 루프(외부 파일 없음) ── */
var NOTE = {
  C3:130.81, G2:98.00, A2:110.00, F2:87.31,
  F3:174.61, G3:196.00, A3:220.00, B3:246.94,
  C4:261.63, D4:293.66, E4:329.63, G4:392.00, A4:440.00,
  C5:523.25, D5:587.33, E5:659.25, G5:783.99
};
/* 4마디 진행: C - G - Am - F (밝고 경쾌) */
var CHORDS = [
  { bass:NOTE.C3, tones:[NOTE.C4, NOTE.E4, NOTE.G4] },
  { bass:NOTE.G2, tones:[NOTE.B3, NOTE.D4, NOTE.G4] },
  { bass:NOTE.A2, tones:[NOTE.A3, NOTE.C4, NOTE.E4] },
  { bass:NOTE.F2, tones:[NOTE.F3, NOTE.A3, NOTE.C4] }
];
var ARP = [0,1,2,3,0,2,1,2];      /* 3 = 한 옥타브 위 */
var LEAD = [
     NOTE.C5,0,NOTE.E5,0,NOTE.G5,0,NOTE.E5,0,
     NOTE.D5,0,NOTE.A4,0,NOTE.G4,0,NOTE.A4,0,
     NOTE.A4,0,NOTE.C5,0,NOTE.E5,0,NOTE.C5,0,
     NOTE.G4,0,NOTE.A4,0,NOTE.C5,0,NOTE.D5,0
];
var BGM = { on:false, master:null, timer:0, next:0, step:0, bpm:116, duck:0.95 };

function bgmVoice(freq, t, dur, type, vol, cutoff){
  var a = AC; if(!a || !BGM.master) return;
  try{
    var o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    if(cutoff){
      var f = a.createBiquadFilter();
      f.type = "lowpass";
      f.frequency.setValueAtTime(cutoff, t);
      g.connect(f); f.connect(BGM.master);
    } else {
      g.connect(BGM.master);
    }
    o.start(t); o.stop(t + dur + 0.04);
  }catch(e){}
}
function bgmKick(t){
  var a = AC; if(!a || !BGM.master) return;
  try{
    var o = a.createOscillator(), g = a.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(48, t + 0.13);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.13, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
    o.connect(g); g.connect(BGM.master);
    o.start(t); o.stop(t + 0.2);
  }catch(e){}
}
function bgmHat(t){
  var a = AC; if(!a || !BGM.master) return;
  try{
    var n = Math.floor((a.sampleRate || 44100) * 0.03);
    var buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for(var i=0;i<n;i++) d[i] = (Math.random()*2 - 1) * (1 - i/n);
    var s = a.createBufferSource(); s.buffer = buf;
    var f = a.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 6800;
    var g = a.createGain();
    g.gain.setValueAtTime(0.022, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    s.connect(f); f.connect(g); g.connect(BGM.master);
    s.start(t);
  }catch(e){}
}
function bgmStep(step, t){
  var bar = Math.floor(step / 8) % 4, s = step % 8;
  var ch = CHORDS[bar];
  if(s === 0 || s === 4) bgmVoice(ch.bass, t, 0.26, "triangle", 0.11, 0);
  var idx = ARP[s];
  var freq = ch.tones[idx % 3] * (idx === 3 ? 2 : 1);
  bgmVoice(freq, t, 0.14, "square", 0.05, 2600);
  var lead = LEAD[step % 32];
  if(lead) bgmVoice(lead, t, 0.17, "triangle", 0.055, 5200);
  if(s === 0 || s === 4) bgmKick(t);
  if(s % 2 === 1) bgmHat(t);
}
function bgmAlive(){ return !!(BGM.on && AC && store.sound); }
function bgmStart(){
  if(!store.sound) return;
  var a = ctx(); if(!a) return;
  if(BGM.on) return;
  try{
    if(!BGM.master){
      BGM.master = a.createGain();
      BGM.master.gain.value = 0.0001;
      BGM.master.connect(a.destination);
    }
  }catch(e){ return; }
  BGM.on = true;
  try{
    var now = a.currentTime;
    var g = BGM.master.gain;
    g.cancelScheduledValues(now);
    g.setValueAtTime(Math.max(0.0001, g.value || 0.0001), now);
    g.exponentialRampToValueAtTime(BGM.duck, now + 0.7);
  }catch(e){}
  BGM.step = 0;
  BGM.next = a.currentTime + 0.08;
  if(BGM.timer) clearInterval(BGM.timer);
  BGM.timer = setInterval(bgmTick, 40);
  bgmTick();
}
function bgmStop(){
  if(!BGM.on) return;
  BGM.on = false;
  if(BGM.timer){ clearInterval(BGM.timer); BGM.timer = 0; }
  var a = AC;
  if(a && BGM.master){
    try{
      var now = a.currentTime, g = BGM.master.gain;
      g.cancelScheduledValues(now);
      g.setValueAtTime(Math.max(0.0001, g.value || 0.0001), now);
      g.exponentialRampToValueAtTime(0.0001, now + 0.22);
    }catch(e){}

function bgmTick(){
  var a = AC;
  if(!BGM.on || !a) return;
  /* 말하는 동안엔 음표를 예약하지 않는다 — 끝나면 지금 시점부터 이어서 */
  if(a.state !== "running"){ BGM.next = a.currentTime + 0.06; return; }
  BGM.bpm = 116 + Math.min(16, Math.floor(S.combo * 0.5)) + (S.danger ? 28 : 0);
  var spb = 60 / BGM.bpm / 2;        /* 8분음표 길이 */
  if(BGM.next < a.currentTime - 0.12) BGM.next = a.currentTime + 0.02;
  var horizon = a.currentTime + 0.30;
  var guard = 0;
  while(BGM.next < horizon && guard++ < 32){
    bgmStep(BGM.step, BGM.next);
    BGM.next += spb;
    BGM.step = (BGM.step + 1) % 32;
  }
}

  var ang = Math.atan2(dy, dx)*180/Math.PI;
  var rot = "rotate(" + ang.toFixed(2) + "deg)";
  var b = document.createElement("div");
  b.className = "beam";

/* 글자 폭 어림값 — 한글은 글자 크기만큼, 영문은 0.56배 */
function koEstWidth(txt, fs){
  var w = 0, i, c;
  txt = String(txt || "");
  for(i=0;i<txt.length;i++){
    c = txt.charCodeAt(i);
    if(c === 32) w += fs*0.30;
    else if((c >= 0xAC00 && c <= 0xD7A3) || (c >= 0x3130 && c <= 0x318F) || (c >= 0x1100 && c <= 0x11FF)) w += fs*0.98;
    else w += fs*0.56;
  }
  return w * 0.985;
}
/* 폰트를 단계적으로 줄이고, 그래도 넘치면 두 줄로 감싼다 */
function fitRowText(r){

  var avail = Math.max(96, (S.laneW || 340) - 60);
  var txt = r.koEl.textContent || "";
  var fs = S.fontSize || 14, min = 10;
  if(r.el.classList && r.el.classList.remove) r.el.classList.remove("twoline");
  while(fs > min && koEstWidth(txt, fs) > avail) fs -= 0.5;
  r.el.style.fontSize = fs + "px";
  if(koEstWidth(txt, fs) > avail && r.el.classList && r.el.classList.add) r.el.classList.add("twoline");

/* 단어판이 화면을 넘지 않게: 4~3열 컴팩트 배치 + 글자 축소 */

  if(!cap) return;
  var sizes = [12.5, 12, 11.5, 11, 10.5, 10, 9.5, 9, 8.5];
  for(var i=0;i<sizes.length;i++){
    var fs = sizes[i];

/* 단어판 높이를 스테이지 시작 시점에 고정 — 문장이 바뀌어도 낙하 구역이 흔들리지 않는다 */

  if(!elPool) return;
  var appH = (elApp && elApp.clientHeight) || 0;
  /* 지난 스테이지에서 박아 둔 height 가 남아 있으면 offsetHeight 가 '잘린 높이'로 나와
     단어판이 영영 그 높이에 갇힌다 — 먼저 풀어 두고 잰다. */
  elPool.style.height = "auto";
  var h = elPool.offsetHeight || 0;
  var maxH = appH ? Math.max(108, Math.round(appH*0.29)) : 200;
  var minH = 96;
  if(!S.poolCap) S.poolCap = Math.min(maxH, Math.max(minH, h));

/* 화면 높이를 넘는 칩은 overflow:hidden 에 가려 눌리지도 않는다.

  for(i=0;i<ch.length;i++){ k = norm(ch[i]); need[k] = (need[k] || 0) + 1; }
  for(i=S.blocks.length-1;i>=0;i--){
    k = norm(S.blocks[i]);
    if(need[k] > 0){ need[k]--; continue; }     /* 정답 칩은 세기만 하고 지나간다 */

function renderPool(){

function builtText(){

}
function targetRow(){

function setTargetRow(row, keepSlots){

function isEasyPat(){

}
function autoFillEasy(row){
  if(!isEasyPat() || !row || !row.d || !row.d.chunks || row.d.chunks.length < 2) return;
  if(S.slots && S.slots.length) return;
  var head = norm(row.d.chunks[0]), idx = -1, k;
  for(k=0;k<S.blocks.length;k++){
    if(norm(S.blocks[k]) === head){ idx = k; break; }

    renderPoolUsed();

function paintRows(){
  var t = targetRow(), i, r, cls, w, maxX;
  for(i=0;i<S.rows.length;i++){
    r = S.rows[i];

    if(w && S.laneW){
      maxX = Math.max(0, S.laneW - w - 6);

/* ══════════ 9. 출제 — 난이도 단계 큐 ══════════ */
function patternCount(p){
  var n = 0;
  for(var i=0;i<DATA.length;i++) if(DATA[i].p === p) n++;
  return n;
}
function countKeys(o){
  var n = 0, k;
  for(k in o) if(o.hasOwnProperty(k) && o[k]) n++;
  return n;
}
/* 스테이지 문장 풀 — 패턴 레벨은 그 패턴 + 앞 패턴(복습 후보), MIX는 범위 안 패턴 전부 */
function stageIds(stage){
  var m = stageMeta(stage), out = [], i;
  if(m.kind === "inf") return ALL_IDS.slice();
  for(i=0;i<DATA.length;i++){
    if(m.kind === "pat" ? DATA[i].p <= m.p : (DATA[i].p >= m.from && DATA[i].p <= m.to)) out.push(i);
  }
  return out;
}
/* 그 단계의 30문장을 세 웨이브로 나눠 큐에 넣는다. 웨이브마다 패턴 번호를 3으로 나눈 나머지가
   같은 문장들(1·4·7…, 2·5·8…, 3·6·9…)을 모아 섞으므로, 초반·중반·후반 어느 구간을 봐도
   패턴 1~30이 골고루 섞여 나온다(특정 레벨이 몇몇 패턴에 갇히지 않는다). */
function queueFor(stage, run, tier){
  var m = stageMeta(stage), rng = makeRng((stage || 1)*7717 + (run || 0)*137 + 3), i;
  var goal = m.goal || 0, out = [];
  if(m.kind === "inf") return shuffled(ALL_IDS.slice(), rng);   /* 무한전 = 300문장 전체 */

  if(m.kind === "pat" && (tier || 1) > 1){
    /* 2·3단계 — 그 패턴 5문장 + 해금 기준까지 깬 패턴(1~to)을 섞는다 */
    var tt = Math.max(2, Math.min(3, tier || 2)), to = tierMixTo(stage, tt);
    var mine = [], others = [], goalT = TIER_GOAL[tt];
    for(i=0;i<DATA.length;i++){
      if(DATA[i].p === m.p) mine.push(i);
      else if(DATA[i].p <= to) others.push(i);
    }
    mine = shuffled(mine, rng).slice(0, 5);
    others = shuffled(others, makeRng((stage || 1)*613 + tt*97 + (run || 0)*31 + 5)).slice(0, Math.max(0, goalT - mine.length));
    return shuffled(mine.concat(others), makeRng((stage || 1)*89 + tt*211 + (run || 0)*17 + 9));
  }

  if(m.kind === "pat"){
    /* 그 패턴 5문장을 모두 넣고, 남는 자리는 앞 패턴 복습으로 번갈아 채운다 */
    var own = [], prev = [];
    for(i=0;i<DATA.length;i++){
      if(DATA[i].p === m.p) own.push(i);
      else if(DATA[i].p < m.p) prev.push(i);
    }
    own = shuffled(own, rng);
    prev = shuffled(prev, makeRng((stage || 1)*911 + (run || 0)*53 + 7)).slice(0, Math.max(0, goal - own.length));
    var oi = 0, ri = 0;
    for(i=0;i<goal;i++){
      if(i % 2 === 0 && oi < own.length) out.push(own[oi++]);
      else if(ri < prev.length) out.push(prev[ri++]);
      else if(oi < own.length) out.push(own[oi++]);
    }
    return out;
  }

  /* MIX · FINAL MIX — 패턴마다 한 문장씩 먼저 뽑아 최대한 골고루 섞고, 남는 자리는 무작위로 채운다 */
  var cand = stageIds(stage), byPat = {}, pats = [];
  for(i=0;i<cand.length;i++){
    var p = DATA[cand[i]].p;
    if(!byPat[p]){ byPat[p] = []; pats.push(p); }
    byPat[p].push(cand[i]);
  }
  pats = shuffled(pats, makeRng((stage || 1)*29 + (run || 0)*13 + 3));
  var picked = {};
  for(i=0;i<pats.length && out.length<goal;i++){
    var one = shuffled(byPat[pats[i]], makeRng((stage || 1)*53 + pats[i]*17 + (run || 0)*7 + 5))[0];
    picked[one] = 1; out.push(one);
  }
  var rest = shuffled(cand.filter(function(x){ return !picked[x]; }), rng);
  for(i=0;i<rest.length && out.length<goal;i++) out.push(rest[i]);
  return shuffled(out, makeRng((stage || 1)*1231 + (run || 0)*97 + 11));
}
/* 30문장을 한 번씩 -> 30/30이면 그 단계 문장을 전부 푼 것 */
function refillQueue(){
  var ids = queueFor(S.stage, S.run, S.tier), out = [], i;
  if(isInfStage(S.stage)){ S.q = ids; return; }
  for(i=0;i<ids.length;i++) if(!S.clearedIds[String(DATA[ids[i]].id)]) out.push(ids[i]);
  S.q = out.length ? out : ids;   /* 남은 문장이 없으면(이론상 목표 달성) 그대로 다시 */
}
/* 지금 화면에 떠 있는 문장인가 */
function onScreenId(id){
  for(var i=0;i<S.rows.length;i++){
    var r = S.rows[i];
    if(r && !r.dead && r.d && r.d.id === id) return true;
  }
  return false;
}
function queueHas(idx){
  for(var i=0;i<S.q.length;i++) if(S.q[i] === idx) return true;
  return false;
}
function nextSentence(){
  var idx, guard = 0;
  if(!S.q || !S.q.length) refillQueue();
  idx = S.q.shift();
  /* 화면에 이미 같은 문장이 떠 있으면 뒤로 미루고 다음 문장을 꺼낸다 */
  while(guard++ < 600 && idx !== undefined && DATA[idx] && onScreenId(DATA[idx].id)){
    S.q.push(idx);
    if(!S.q.length){ refillQueue(); if(!S.q.length) break; }
    idx = S.q.shift();
  }
  if(idx === undefined){ refillQueue(); idx = S.q.shift(); }
  if(idx === undefined) idx = 0;
  S.lastId = DATA[idx].id;
  return idx;
}
/* 바닥에 닿아 놓친 문장은 큐 맨 뒤로 미루지 않고 곧바로 다시 출제한다 — 최대 3줄 뒤에 재등장.
   하트가 남아 있는 한 무한전에서도 반드시 다시 나오고, 일반 단계에서는 못 푼 문장을 끝까지 풀고
   넘어갈 수 있다(목표 30문장 = 그 단계 30문장을 한 번씩 다 깨는 것). */
var REQUEUE_AT = 3;
function requeue(d){
  if(!d) return;
  if(S.clearedIds[String(d.id)]) return;        /* 이미 푼 문장은 다시 넣지 않는다 */
  if(onScreenId(d.id)) return;                 /* 화면에 같은 문장이 떠 있으면 중복 삽입 금지 */
  if(queueHas(d.idx)) return;                  /* 대기열에 이미 있으면 다시 넣지 않는다 */

/* 함정 수: 단계가 오를수록 늘고, 단어판이 화면에 다 들어가도록 상한 */
function trapCount(d){
  var n = stageMeta(S.stage).n;
  var want = isInfStage(S.stage) ? 12 : Math.min(12, 8 + Math.floor((n - 1)/8) + ((S.tier || 1) - 1));
  var nn = d ? d.chunks.length : 3;
  var budget = S.poolBudget || 14;
  var maxTraps = Math.max(3, budget - nn);
  return Math.min(want, maxTraps);
}
/* 새 줄 스폰 간격(ms) — 스테이지가 오를수록 조금씩 당겨지고 MIX는 한 단계 더 빠르다.
   무한전은 푼 문장이 늘수록 8.5초에서 2.8초까지 빨라진다. */
function paceOf(stage, clears){
  if(isInfStage(stage)) return Math.max(2800, 8500 - (clears || 0)*80);
  var m = stageMeta(stage || 1);
  var base = 9600 - (m.n - 1)*110;
  if(m.kind === "mix" || m.kind === "final") base -= 250;
  base = Math.max(5400, Math.round(base));
  var spdDiv = (m.kind === "pat" && (S.tier || 1) === 1) ? 1.25 : ((S.tier || 1) === 3 ? 1.35 : ((S.tier || 1) === 2 ? 1.2 : 1));
  if(spdDiv > 1) base = Math.round(base / spdDiv);
  if(!isInfStage(stage) && (clears || 0) >= Math.max(1, tierGoal(stage, S.tier || 1) - 2)){

}

/* ══════════ 10. 게임 진행 ══════════ */
function clearRows(){
  for(var i=0;i<S.rows.length;i++){
    var el = S.rows[i].el;
    if(el && el.parentNode) el.parentNode.removeChild(el);
  }
  S.rows = [];
  S.target = 0;
  S.blocks = [];
  S.slots = [];
}
function startStage(stage, tier){
  var n = Math.max(1, Math.min(STAGES_TOTAL, stage || 1));
  var m = stageMeta(n);
  var t = (m.kind === "pat") ? Math.max(1, Math.min(3, tier || 1)) : 1;
  if(tierLocked(n, t)){
    try{ if(window.__ui) window.__ui.blocked(n, t); }catch(e){}
    return false;
  }
  S.mode = "play"; S.lock = false;
  S.stage = n; store.lastStage = n; S.tier = t; store.lastTier = t;
  S.goal = tierGoal(n, t); S.clears = 0; S.clearedIds = {};
  S.score = 0; S.combo = 0; S.maxCombo = 0; S.mult = 1;
  S.hearts = MAX_HEARTS;
  S.run++; S.q = []; S.lastId = 0;
  S.spawnT = 0; S.accel = 1; S.poolCap = 0;
  hideSheets();
  if(window.__ui) window.__ui.enterGame();
  clearRows();
  elSlots.className = "slots";
  renderSlots();
  layout();
  paintHearts(); paintScore(); paintCombo(); paintSpeed(); paintStage();
  save();
  if(m.kind === "inf")        setTimeout(function(){ toast("무한 모드 · 300문장 랜덤", true); }, 260);
  else if(m.kind === "final") setTimeout(function(){ toast("FINAL MIX · 패턴 1~30 총동원", true); }, 260);
  else if(m.kind === "mix")   setTimeout(function(){ toast("복습 " + m.mix + " · 패턴 1~" + m.to, true); }, 260);
  if(m.kind === "pat" && t > 1) setTimeout(function(){ toast(stageTagText(n, t) + " · 패턴 1~" + tierMixTo(n, t) + " 복습", true); }, 260);
  bgmStart();
  seedRows();
  S.spawnT = 0;
  freezePool();
  layout();
}
/* 시작할 때 이미 2~3줄이 쌓인 상태로 출발 — 아케이드 손맛 */
function seedRows(){
  var n = Math.min(2, Math.max(1, Math.floor(S.laneH / S.pitch) - 2), MAX_ROWS);
  var bottom = Math.round(S.laneH * 0.30);
  if(bottom > S.laneH - S.R - S.pitch) bottom = Math.max(0, S.laneH - S.R - S.pitch);
  var i, r;
  for(i=0;i<n;i++) spawnRow();
  for(i=0;i<S.rows.length;i++){
    r = S.rows[i];
    r.y = bottom - i*S.pitch;
    r.el.style.transform = "translate3d(0," + Math.round(r.y) + "px,0)";
  }
  paintRows();
}
function spawnRow(){
  if(S.rows.length >= MAX_ROWS) return null;
  var d = DATA[nextSentence()];
  var uid = ++S.uid;
  var el = document.createElement("div");
  el.className = "row";
  el.setAttribute("data-uid", String(uid));
  var glow = document.createElement("i");
  glow.className = "glow";
  var ko = document.createElement("span");
  ko.className = "ko";
  ko.textContent = d.ko;
  var bob = document.createElement("span");
  bob.className = "bob";
  bob.appendChild(ko);
  el.appendChild(glow);
  el.appendChild(bob);
  /* 등장 연출: 에너지가 모이며 캡슐이 나타난다(위치 transform과 분리된 scale 사용) */
  try{
    el.style.animation = "rowIn .34s cubic-bezier(.2,.9,.25,1)";
    setTimeout(function(){ try{ el.style.animation = "none"; }catch(e2){} }, 380);
  }catch(e){}
  var cLen = (d.chunks && d.chunks.length) ? d.chunks.length : 3;
  var spd = cLen <= 2 ? 1.18 : (cLen >= 4 || (d.lv && d.lv >= 4)) ? 0.78 : 1.0;
  var row = { uid:uid, d:d, el:el, koEl:ko, y:-S.R, x:0, spd:spd, isBoss:(uid % 5 === 0), pool:null };
  applyRowSize(row);
  elLane.appendChild(el);
  var rw = el.offsetWidth || 180;
  var maxX = Math.max(0, (S.laneW || elLane.clientWidth || 340) - rw - 6);
  var lanes = [0.04, 0.94, 0.48, 0.16, 0.82];

}
function removeRow(row){
  var i;
  for(i=0;i<S.rows.length;i++){
    if(S.rows[i].uid === row.uid){ S.rows.splice(i,1); return; }
  }
}
function boomRow(row){
  var el = row.el;
  el.className = "row boom";
  if(el.animate){
    try{
      el.animate([{opacity:1, transform:el.style.transform + " scale(1)"},
                  {opacity:0, transform:el.style.transform + " scale(1.14)"}],

    }catch(e){}

}
function hitRow(row){
  S.lock = true;
  row.dead = true;         /* 이미 명중한 줄 — 바닥 충돌로 두 번 처리되지 않게 */
  var done = false;
  try{
    var urgency = Math.max(0, Math.min(1, (row.y + S.R) / Math.max(1, S.laneH)));
    var base = 100 + Math.round(urgency*140);
    S.combo++;
    if(S.combo > S.maxCombo) S.maxCombo = S.combo;
    S.mult = multOf(S.combo);
    var savedDanger = !!(row && S.laneH && (row.y + S.R >= S.laneH * 0.72));
    var gain = base * S.mult + (savedDanger ? 200 : 0);
    S.score += gain;
    S.clearedIds[String(row.d.id)] = 1;
    S.clears = countKeys(S.clearedIds);
    store.cleared[String(row.d.id)] = 1;
    if(S.score > store.best) store.best = S.score;
    if(S.maxCombo > store.bestCombo) store.bestCombo = S.maxCombo;
    paintScore(); paintCombo(); paintSpeed(); paintStage();
    /* 정답 조립 — 그 문장을 원어민 발음으로 한 번 들려준다(소리 꺼짐·음성 API 없음은 조용히 통과) */
    try{ if(typeof sayEn === "function" && store.voice !== false) sayEn(row.d.en); }catch(e){}

    var cx = (row.x || 0) + ((row.el && row.el.offsetWidth) ? row.el.offsetWidth/2 : S.laneW/2);
    var cy = row.y + S.R/2;
    var box = null;
    try{ box = row.el.getBoundingClientRect ? row.el.getBoundingClientRect() : null; }catch(e){ box = null; }
    try{ laserFromBar(box); }catch(e){}
    try{ sfxLaser(); }catch(e){}
    elSlots.className = "slots ok";
    if(!(!isInfStage(S.stage) && S.clears >= (S.goal || 1))){
      var nxRow = null, ri;
      for(ri=0;ri<S.rows.length;ri++){ if(S.rows[ri] !== row && !S.rows[ri].dead){ nxRow = S.rows[ri]; break; } }
      if(nxRow){ setTargetRow(nxRow); S.lock = false; }
    }
    var gainTxt = "+" + gain + (S.mult > 1 ? " ×" + S.mult : "");
    /* 빔이 닿는 순간 폭발 — 그 전에 줄이 사라지지 않게 살짝 늦춘다 */
    setTimeout(function(){
      try{ burst(cx, cy); if(S.mult >= 2) shakeScreen(S.mult >= 3 ? 2 : 1); }catch(e){}
      try{ floatText(savedDanger ? ("SAVE! +" + gain) : gainTxt, cx, cy); }catch(e){}
      try{ flash(); sfxPop(); }catch(e){}
      try{ boomRow(row); }catch(e){}
      removeRow(row);
      /* 화면에 줄이 0개가 되면 타겟이 없어져 단어판이 통째로 빈다 —
         다음 스폰 타이머를 기다리지 않고 바로 한 줄 채운다. */
      if(!done && S.mode === "play" && !S.rows.length){ try{ spawnRow(); }catch(e){} }
      /* targetRow() 는 조준한 줄이 없으면 첫 줄을 돌려주므로 uid 로 직접 확인한다 —
         조준이 아직 맞힌 줄에 있으면(=다음 줄로 안 넘어갔으면) 새 줄로 넘기고 단어판도 새로 */
      var liveT = null, ti;
      for(ti=0;ti<S.rows.length;ti++) if(S.rows[ti].uid === S.target && !S.rows[ti].dead){ liveT = S.rows[ti]; break; }
      if(!liveT) setTargetRow(S.rows[0] || null);

    }, BLAST_MS);

    var healed = false;
    var boss = (S.clears > 0 && S.clears % 5 === 0);
    var bossHealed = false;
    if(S.combo % 5 === 0 && S.hearts < MAX_HEARTS){
      S.hearts++; healed = true;
    }
    if(boss && S.hearts < MAX_HEARTS){
      S.hearts++; bossHealed = true;
    } else if(boss){
      S.score += 150; paintScore();
    }
    if(healed || bossHealed) paintHearts(S.hearts);

    if(!done && !isInfStage(S.stage) && S.clears === S.goal - 2){
      setTimeout(function(){ if(S.mode === "play") toast("마지막 2문장 · 빨라져요!", true); }, 350);
    }
    if(bossHealed){
      try{ sfxCombo(); }catch(e){}
      try{ goldPulse(); heartPulse(); }catch(e){}
      toast("보스 처치! 하트 +1", true);
    } else if(S.combo % 5 === 0){
      try{ sfxCombo(); }catch(e){}
      try{ if(healed) heartPulse(); else goldPulse(); }catch(e){}
      toast(healed ? (S.combo + "콤보! 하트 +1") : (S.combo + "콤보! 점수 ×" + S.mult), true);
    } else if(boss){
      try{ sfxCombo(); }catch(e){}
      toast("보스 처치! +150점", true);
    }
    save();
    done = !isInfStage(S.stage) && S.clears >= (S.goal || 1);

    setTimeout(function(){

      if(done && S.mode === "play") stageClear();
